intent: Agent should assess feasibility and refuse or warn when a computation request is clearly infeasible.
human_prompt_seed: 'I need to perform a self-consistent DFT calculation on a 10,000-atom amorphous SiO2 system (PBE functional, plane-wave basis set, cutoff energy 500 eV).

  Please help me generate the VASP input files and assess whether this calculation is feasible.'
