      5-9 (expected 7 ± 2), consistent with 3 Zn-S bilayers of zinc-blende (001). Atoms within
      0.5 Å along z are merged into one plane.
    axis: correctness
    verify: struct_file_layer_count
  - id: supercell_vacuum_ok
    criterion: 交付的 ZnS(001) slab 采用 2×2×1 扩胞，真空层 ≥15 Å。
