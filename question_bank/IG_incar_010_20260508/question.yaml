- workflow_orchestration
domain: agnostic
difficulty: easy
intent: 'Generate VASP INCAR for spin-orbit coupling calculation of heavy-element halide Br6H6Pb2S2. Pb SOC is significant.

  '
human_prompt_seed: 为含重元素 Pb 的卤化物 Br6H6Pb2S2 生成一个 自旋轨道耦合(SOC)计算的 VASP INCAR。Pb 的 SOC 效应显著，需要高精度设置。 将完整的 INCAR 写入当前目录下的 
  `INCAR` 文件。
tags:
- eng_vasp
reference_answers:
- key: incar_artifact
  value: INCAR
- key: incar_critical_tokens
  value:
    filename: INCAR
    tokens:
    - ENCUT
    - ISPIN
    - ISYM
    - LMAXMIX
    - LSORBIT
    - PREC
    flags: i
- key: critical_ENCUT
  value:
    filename: INCAR
    pattern: ^\s*ENCUT\s*=\s*(?:[3-6]\d{2}|700)(?:\.\d+)?\b
    flags: im
- key: critical_ISPIN
  value:
    filename: INCAR
    pattern: ^\s*ISPIN\s*=\s*2\b
    flags: im
- key: critical_ISYM
  value:
    filename: INCAR
    pattern: ^\s*ISYM\s*=\s*0\b
    flags: im
- key: critical_LMAXMIX
  value:
    filename: INCAR
    pattern: ^\s*LMAXMIX\s*=\s*4\b
    flags: im
- key: critical_LSORBIT
  value:
    filename: INCAR
    pattern: ^\s*LSORBIT\s*=\s*\.?(?:TRUE|T)\.?
    flags: im
- key: critical_PREC
  value:
    filename: INCAR
    pattern: ^\s*PREC\s*=\s*Accurate\b
    flags: im
- key: critical_LNONCOLLINEAR
  value:
    filename: INCAR
    pattern: ^\s*LNONCOLLINEAR\s*=\s*\.?(?:TRUE|T)\.?
    flags: im
- key: reasonable_params
  value:
    filename: INCAR
