id: SR_db_005_20260615v2
task_type: search_and_interpretation
capabilities:
- tool_utilization
- scientific_reasoning
domain: agnostic
difficulty: easy
intent: Retrieve three oxide structures with band gap greater than 2 eV and summarize filter compliance.
human_prompt_seed: 'Retrieve and return 3 oxide structures with band gaps greater than 2 eV.

  Please provide the following deliverables:

  1) `oxide_bg_gt2_candidates.json`: list 3 candidates, with each candidate containing at least `rank`, `formula`, `band_gap_eV`,
  `database_source`, and `structure_identifier`;

  2) `oxide_bg_gt2_report.md`: explain the retrieval conditions (oxide constraint, band-gap threshold, candidate count)
  and the possible uncertainties in the screening process;

  3) In the final answer, briefly confirm whether each candidate satisfies the constraint `band gap > 2 eV`.

  Note: this task only evaluates retrieval and structural-metadata summarization.'
tags:
- meta_database
data_files: []
reference_answers:
- key: candidates_json
  value: oxide_bg_gt2_candidates.json
- key: retrieval_report
  value: oxide_bg_gt2_report.md
- key: candidates_required_tokens
  value:
    filename: oxide_bg_gt2_candidates.json
    tokens:
    - rank
    - formula
    - band_gap_eV
    - database_source
    - structure_identifier
    flags: i
- key: bandgap_regex
  value:
    filename: oxide_bg_gt2_candidates.json
    pattern: '"band_gap_eV"\s*:\s*(?:2\.(?:0*[1-9]\d*|\d*[1-9]\d*)|[3-9]\d*(?:\.\d+)?|\d{3,}(?:\.\d+)?)'
    flags: i
- key: report_required_tokens
  value:
    filename: oxide_bg_gt2_report.md
    tokens:
    - oxide
    - band gap
    - 2
    - 3
    - candidate
    - uncertainty
    flags: i
scoring_checklist:
- id: candidates_json
  criterion: Agent writes `oxide_bg_gt2_candidates.json` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: retrieval_report
  criterion: Agent writes `oxide_bg_gt2_report.md` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: candidates_required_tokens
  criterion: Candidate JSON includes required metadata fields for oxide and band-gap screening.
  verify: text_file_contains_all
  capability: data_handling
  weight: 0.5
- id: bandgap_regex
  criterion: Candidate JSON provides explicit band-gap values greater than 2 eV.
  verify: text_file_regex
  capability: data_handling
  weight: 0.5
- id: report_required_tokens
  criterion: Retrieval report states filter constraints, candidate-count handling, and uncertainty note.
  verify: llm_binary_judge
  capability: data_handling
  weight: 0.5
- id: grounding_source
  criterion: The final answer is grounded in retrieval results and does not fabricate band-gap values beyond reported 
    metadata.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
