domain: agnostic
difficulty: easy
intent: Perform Pawley refinement on variable-temperature PXRD patterns to extract lattice parameters at each 
  temperature, identify two structural phases (low-temperature RTP and high-temperature HTP), and fit linear thermal 
  expansion equations for each phase.
human_prompt_seed: 'The file `_td-pxrd_test.txt` contains variable-temperature powder X-ray diffraction (PXRD) data for
  one compound at 8 temperatures, with temperature-label correspondence as follows: 25°C→303K, 40°C→323K, 60°C→343K,
  80°C→363K, 100°C→383K, 115°C→393K, 130°C→403K, 140°C→413K. This compound belongs to the monoclinic crystal system.

  Please perform Pawley refinement on the PXRD pattern at each temperature, extract the lattice parameters (a, b, c, beta,
  V), and analyze the results: 1. Identify two structural phases: the low-temperature phase (1-RTP, 303K-363K) and the
  high-temperature phase (1-HTP, 383K-413K); 2. For each phase, perform linear fitting of each lattice parameter (a, b,
  c, beta, V) as a function of temperature, and provide the fitting equations (slope, intercept, R²); 3. Report the refinement
  results at each temperature (lattice parameters and Rp/Rwp metrics).

  '
