id: IG_vasp_dftu_001_20260616
task_type: simulation
capabilities:
- tool_utilization
- workflow_orchestration
domain: agnostic
difficulty: easy
intent: Generate VASP INCAR for NiO with DFT+U (Dudarev) settings.
human_prompt_seed: 'There is a file `NiO.vasp` in the workspace (rocksalt NiO, 4 atoms: 2 Ni + 2 O, with atom order Ni O in the POSCAR).

  NiO is a strongly correlated antiferromagnetic insulator, and the Ni 3d electrons have strong on-site Coulomb interaction. Please generate a static-calculation INCAR file `INCAR_dftu` that includes strong-correlation effects.

  Use a Hubbard U correction, with an effective U value of 6.2 eV for Ni. Use the PBE functional and ENCUT=550 eV.'
tags:
- eng_vasp
data_files: []
reference_answers:
- key: incar_dftu_artifact
  value: INCAR_dftu
- key: must_ldau
  value:
    filename: INCAR_dftu
    tokens:
    - LDAU = .TRUE.
    - LDAU=.TRUE.
    flags: i
- key: must_ldautype
  value:
    filename: INCAR_dftu
    tokens:
    - LDAUTYPE = 2
    - LDAUTYPE=2
    flags: i
- key: must_ldaul
  value:
    filename: INCAR_dftu
    pattern: LDAUL\s*=\s*2\s+(-1|0)
    flags: i
- key: must_ldauu
  value:
    filename: INCAR_dftu
    pattern: LDAUU\s*=\s*6\.2\s+0
    flags: i
- key: duration_budget
  value:
    max: 7200000
- key: must_ispin
  value:
    filename: INCAR_dftu
    pattern: ISPIN\s*=\s*2
    flags: i
