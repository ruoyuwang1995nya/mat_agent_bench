- id: SR_db_007_20260411v1
  capability: structure_retrieval
  domain: agnostic
  intent: Retrieve up to five CoREMOF-2019 entries satisfying atom-count, surface-area, and
    element constraints.
  human_prompt_seed: '从 CoREMOF 2019 数据库检索并返回不超过 5 个 MOF，约束如下：

    - 原子数 < 50； - 比表面积 > 1000 m²/g； - 同时包含 O 和 C 元素。

    请完成以下交付：

    1) `coremof_filtered_candidates.json`：至少包含 `rank`, `name`, `database`, `n_atom`, `surface_area_m2g`,
    `elements`, `structure_identifier`； 2) `coremof_filter_report.md`：说明筛选条件、排序逻辑和结果不确定性。

    最终回答需确认每条候选是否满足阈值条件。'
