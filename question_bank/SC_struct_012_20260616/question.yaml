human_prompt_seed: 'Please construct the crystal structure of corundum (alpha-Al2O3) based on its Wyckoff-position information, and export it as `corundum_wyckoff.cif`.

  Known target information: - space group number: 167; - approximate lattice constants: a=b≈4.7602 Å, c≈12.9933 Å; - the structure should be built using Wyckoff positions rather than only giving the final chemical formula.

  Deliverables: 1) `corundum_wyckoff.cif`; 2) `wyckoff_construction_notes.md`, describing the space group used, the site settings, the coordinate parameters, and the key points for validating the result.

  In the final answer, briefly explain why the structure is consistent with corundum, and what may cause small parameter deviations.'
