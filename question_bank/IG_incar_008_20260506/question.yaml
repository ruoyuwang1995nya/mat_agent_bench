id: IG_incar_008_20260506
capability: input_generation
domain: agnostic
intent: 'Generate VASP INCAR for elastic constants calculation of perovskite BaZrO3.
  Finite-difference method (IBRION=6), displacement 0.015 A.

  '
human_prompt_seed: 为钙钛矿 BaZrO3 生成一个弹性常数计算的 VASP INCAR。使用有限差分法计算弹性张量，位移幅度 0.015 A。将完整的
  INCAR 写入当前目录下的 `INCAR` 文件。
tags:
- eng_vasp
reference_answers:
- key: incar_artifact
  value: INCAR
- key: incar_critical_tokens
  value:
    filename: INCAR
    tokens:
    - IBRION
    - ISIF
    - NFREE
    - POTIM
    flags: i
- key: critical_IBRION
  value:
    filename: INCAR
    pattern: ^\s*IBRION\s*=\s*6\b
    flags: im
- key: critical_ISIF
  value:
    filename: INCAR
    pattern: ^\s*ISIF\s*=\s*3\b
    flags: im
- key: critical_NFREE
  value:
    filename: INCAR
    pattern: ^\s*NFREE\s*=\s*2\b
    flags: im
- key: critical_POTIM
  value:
    filename: INCAR
    pattern: ^\s*POTIM\s*=\s*\S+
    flags: im
- key: turn_budget
  value:
    max: 8
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 15000
- key: reasonable_params
  value:
    filename: INCAR
