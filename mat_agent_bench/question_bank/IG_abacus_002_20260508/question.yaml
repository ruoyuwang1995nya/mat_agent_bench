id: IG_abacus_002_20260508
capability: input_generation
domain: agnostic
intent: Add ABACUS LCAO BSSE correction at a bulk Fe vacancy site using a single Fe_empty
  ghost atom and SCF INPUT.
human_prompt_seed: '工作区中提供了一个 Fe 体相空位结构（已去掉一个 Fe 原子）。


  请准备 ABACUS LCAO 单点输入用于 vacancy 位置的 BSSE 校正：

  1) 在空位处引入 Fe_empty ghost 基组位点。

  2) 生成与体相场景匹配的 SCF INPUT（均匀三维采样）。

  3) 在最终回答中简要说明 vacancy 场景为何需要 ghost 基组补偿。 说明：均匀三维采样可用 kspacing 或 KPT 两种路线；若使用 KPT，建议采用
  `KPT_vac_bsse` 文件名与 Gamma 风格。


  将结果写入当前目录：`STRU_vac_bsse`、`INPUT_vac_bsse`。

  '
tags:
- eng_abacus
- struct_transform
priority: P0
data_files:
- key: base_vacancy
  path: base_vacancy.stru
  oss_url: ''
  description: 53-Fe supercell with one vacancy (no Fe_empty yet).
reference_answers:
- key: must_stru_vac_fe_empty_core
  value:
    filename: STRU_vac_bsse
    filenames:
    - STRU_vac_bsse
- key: must_input_vac_core
  value:
    filename: INPUT_vac_bsse
    tokens:
    - calculation scf
    - basis_type lcao
    - nspin 2
    flags: i
- key: must_input_vac_ntype_matches_species
  value:
    filename: INPUT_vac_bsse
    pattern: (?im)^\s*ntype\s+2\s*$
    flags: im
- key: must_input_vac_uniform_kspacing
  value:
    filename: INPUT_vac_bsse
    if_filename: INPUT_vac_bsse
    if_pattern: ^\s*kspacing\b
    then_pattern: ^\s*kspacing\s+((?:0\.(?:0[89]|1\d|20?)(?:0+)?))(?:\s+\1\s+\1)?\s*$
    else_filename: KPT_vac_bsse
    else_pattern: ^\s*([1-9]\d*)\s+\1\s+\1(?:\s+\d+){0,3}\s*$
    flags: m
- key: suggested_input_vac_numerics
  value:
    filename: INPUT_vac_bsse
    checks:
    - key: ecutwfc
      min: 80
      max: 120
    - key: scf_thr
      min: 1.0e-10
      max: 0.01
- key: suggested_input_vac_smearing
  value:
    filename: INPUT_vac_bsse
    checks:
    - key: smearing_method
      allow_missing_key: true
      allowed_values:
      - gauss
      - gaussian
      - fixed
      - mp
      - mp2
      - methfessel-paxton
      - mv
      - cold
      - marzari-vanderbilt
      - fd
      - fermi-dirac
    - key: smearing_sigma
      allow_missing_key: true
      min: 0.001
      max: 0.1
- key: variable_bsse_explanation
  value: {}
- key: variable_fe_empty_at_vacancy
  value: {}
- key: stru_vac_bsse_artifact
  value: STRU_vac_bsse
- key: input_vac_bsse_artifact
  value: INPUT_vac_bsse
- key: grounding_source
  value:
    filename: base_vacancy.stru
- key: turn_budget
  value:
    max: 20
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 30000
scoring_checklist:
- id: must_stru_vac_fe_empty_core
  criterion: '[Must] Judge from `STRU_vac_bsse` file content: STRU_vac_bsse defines
    Fe_empty as vacancy ghost-basis species with physically consistent empty-site
    marker (allowing equivalent numeric formats).'
  axis: correctness
  verify: llm_binary_judge
  weight: 1.0
- id: must_input_vac_core
  criterion: '[Must] INPUT_vac_bsse uses LCAO SCF core controls (`calculation scf`,
    `basis_type lcao`, `nspin 2`).'
  axis: correctness
  verify: text_file_contains_all
  weight: 1.0
- id: must_input_vac_ntype_matches_species
  criterion: '[Must] INPUT_vac_bsse sets ntype to 2, matching the two species (Fe
    and Fe_empty) defined in STRU_vac_bsse ATOMIC_SPECIES.'
  axis: correctness
  verify: text_file_regex
  weight: 1.0
- id: must_input_vac_uniform_kspacing
  criterion: '[Must] Conditional routing: if INPUT_vac_bsse has `kspacing`, it must
    be either a single value in 0.08~0.20 or an explicit uniform three-component form
    in the same range; if INPUT_vac_bsse has no `kspacing`, then KPT_vac_bsse must
    provide a uniform mesh line (n n n).'
  axis: correctness
  verify: text_file_regex
  weight: 1.0
- id: suggested_input_vac_numerics
  criterion: '[Suggested] INPUT_vac_bsse follows benchmark numeric settings with tolerance
    (`ecutwfc ~100`, `scf_thr around 1e-7~1e-6`).'
  axis: correctness
  verify: text_file_numeric_range
  weight: 0.6
- id: suggested_input_vac_smearing
  criterion: '[Suggested] If INPUT_vac_bsse includes smearing parameters, they should
    be physically reasonable for this benchmark family; missing smearing fields should
    not be treated as failure.'
  axis: correctness
  verify: text_file_numeric_range
  weight: 0.6
- id: variable_bsse_explanation
  criterion: '[Variable] Final answer explains why vacancy-site ghost basis is needed
    for NAO BSSE correction.'
  axis: correctness
  verify: llm_binary_judge
  weight: 0.3
- id: variable_fe_empty_at_vacancy
  criterion: '[Variable] Fe_empty is placed at the vacancy position (not elsewhere)
    with physically consistent vacancy-ghost intent.'
  axis: correctness
  verify: llm_binary_judge
  weight: 0.3
- id: stru_vac_bsse_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `STRU_vac_bsse` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 0.5
- id: input_vac_bsse_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `INPUT_vac_bsse` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 0.5
- id: grounding_source
  criterion: Modified STRU keeps the original 53 real Fe fractional coordinates and
    lattice from base_vacancy.stru; only Fe_empty is added at the vacancy. Judge solely
    from the final answer; do not fail because the tool-call log omits MCP, web_search,
    or any specific tool.
  axis: grounding
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: no_retries
  criterion: No repeated identical tool calls with the same parameter set.
  axis: efficiency
  verify: no_retries
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
  axis: efficiency
  verify: token_budget
