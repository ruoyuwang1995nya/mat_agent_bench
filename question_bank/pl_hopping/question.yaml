id: pl_hopping
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: battery
difficulty: easy
intent: Analyze Li+ hopping in PEO-LiTFSI by comparing PMF barriers and diffusion evidence for two salt-ratio 
  conditions.
human_prompt_seed: 'The file `free_energy_hopping_bundle.json` provides local-structure, PMF, and diffusion-related data for PEO-LiTFSI under two salt-concentration conditions.

  Please complete a Li+ hopping mechanism analysis:

  1. Explain the physical meaning of the reaction coordinate.

  2. Compare the PMF minima, main barriers, and stable states under the two conditions.

  3. Combine the coordination and diffusion information from conventional MD to determine which condition is more favorable for hopping.

  4. Explain what should be prioritized for validation if further experiments or higher-accuracy simulations are performed.

  '
tags:
- chem_her
- phy_elastic
- mat_polymer
data_files:
- key: free_energy_bundle
  path: free_energy_hopping_bundle.json
  description: Free-energy bundle with PMF barriers, minima, state labels, and corresponding MD diffusion/coordination 
    descriptors for two salt-ratio conditions.
reference_answers:
- key: lower_barrier_condition
  value: EO_Li_20
- key: barrier_eo_li_20_eV
  value: 0.18
  tolerance: 0.05
- key: barrier_eo_li_10_eV
  value: 0.33
  tolerance: 0.05
- key: required_fields
  value:
  - pmf_profile
  - barrier_table
  - reaction_coordinate_note
  - hopping_mechanism
  - validation_suggestion
scoring_checklist:
- id: barrier_eo_li_20_eV
  criterion: PMF main barrier for EO/Li = 20 is reported within tolerance of the curated value (~0.18 eV).
  verify: numerical_range
  capability: data_handling
  weight: 0.5
- id: barrier_eo_li_10_eV
  criterion: PMF main barrier for EO/Li = 10 is reported within tolerance of the curated value (~0.33 eV).
  verify: numerical_range
  capability: data_handling
  weight: 0.5
- id: lower_barrier_condition_correctness
  criterion: Final mechanism analysis identifies EO/Li = 20 as the condition with the lower hopping barrier and the more
    favorable Li+ migration pathway.
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: required_fields
  criterion: Report includes PMF profile discussion, barrier table, reaction-coordinate note, hopping-mechanism 
    interpretation, and a validation suggestion.
  verify: llm_binary_judge
  capability: tool_utilization
  weight: 0.5
- id: grounding_source
  criterion: The PMF interpretation is explicitly tied to the provided free-energy and MD descriptors from 
    free_energy_hopping_bundle.json rather than generic statements about ion transport.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
