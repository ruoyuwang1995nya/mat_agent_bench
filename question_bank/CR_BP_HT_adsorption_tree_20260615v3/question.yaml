human_prompt_seed: 'Construct a high-throughput adsorption modeling dataset directory `HT_adsorption/`, with three top-level
  sections: `pure_metals`, `compounds`, and `clusters`. The naming and hierarchy must follow Document 4.1: under `pure_metals`,
  organize by element and `std-{structure}`, and include `bulk/`, `slab/001/`, `slab/011/`, `adslab/001/`, and `adslab/011/`.
  Slabs must have at least 5 layers, vacuum >=15 A, and lateral size >=10 A. The adsorbates are HCOOH, CO2, COOH, HCOO,
  H, and CO. Each slab must contain at least three adsorption sites: `top`, `bridge`, and `hollow`, with filenames in
  the format `{adsorbate}_{site}.xyz`. The `compounds` list and `clusters` (such as Au13) should be included according
  to the document. If it is not feasible to generate all elements at once, please provide a reproducible script plus complete
  example subtrees for Ag, ZnO, and Au13, and explain how to scale the approach to the full set.

  '
