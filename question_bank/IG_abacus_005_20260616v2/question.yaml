id: IG_abacus_005_20260616v2
task_type: simulation
capabilities:
- tool_utilization
- workflow_orchestration
domain: agnostic
difficulty: easy
intent: Prepare ABACUS PW bulk-and-slab inputs for Al fcc(100) surface-energy convergence using bulk, 5-layer slab, and 
  7-layer slab structures.
human_prompt_seed: 'The workspace provides Al fcc(100) structures for the bulk and for slabs of two different thicknesses.


  Please prepare ABACUS plane-wave inputs for a surface-energy convergence test:

  1) Use `cell-relax` for the bulk input.

  2) Use ionic relaxation for the two slab inputs, while preserving the fixed/relaxed tags already present in the original
  STRU files and not modifying the given structures.

  3) Provide separate k-point files matched to the bulk and slab cases; the slab should use anisotropic sampling with
  single-point sampling along the surface-normal direction.


  Write the results to the current directory as `INPUT_bulk_relax`, `INPUT_slab5`, `INPUT_slab7`, `KPT_bulk`, and `KPT_slab`.

  '
tags:
- eng_abacus
- struct_surface
data_files:
- key: bulk_al_fcc
  path: bulk_al_fcc.stru
  oss_url: ''
  description: Bulk Al fcc structure for equilibrium energy reference.
- key: slab_al_fcc100_5l
  path: slab_al_fcc100_5l.stru
  oss_url: ''
  description: Five-layer Al fcc(100) slab with selective-relaxation flags.
- key: slab_al_fcc100_7l
  path: slab_al_fcc100_7l.stru
  oss_url: ''
  description: Seven-layer Al fcc(100) slab with selective-relaxation flags.
reference_answers:
- key: must_input_bulk_relax_core
  value:
    filename: INPUT_bulk_relax
    tokens:
    - calculation cell-relax
    - basis_type pw
    flags: i
- key: must_input_slab5_relax_mode
  value:
    filename: INPUT_slab5
    tokens:
    - calculation relax
    - basis_type pw
    flags: i
- key: must_input_slab7_relax_mode
  value:
    filename: INPUT_slab7
    tokens:
    - calculation relax
    - basis_type pw
    flags: i
- key: must_input_bulk_relax_cal_force_stress
  value:
    filename: INPUT_bulk_relax
    tokens:
    - cal_force 1
    - cal_stress 1
    flags: i
- key: must_input_slab5_cal_force
  value:
    filename: INPUT_slab5
    tokens:
    - cal_force 1
    flags: i
- key: must_kpt_slab_gamma_marker
  value:
    filename: KPT_slab
    tokens:
    - K_POINTS
    - Gamma
    flags: i
- key: must_kpt_slab_vacuum_axis_one
  value:
    filename: KPT_slab
    pattern: ^\s*\d+\s+\d+\s+1(?:\s+\d+){0,3}\s*$
    flags: m
- key: suggested_input_bulk_relax_numerics
  value:
    filename: INPUT_bulk_relax
    checks:
    - key: ecutwfc
      min: 35
      max: 100
- key: variable_input_bulk_smearing_or_mixing
  value:
    filename: INPUT_bulk_relax
    checks:
    - key: smearing_method
      allow_missing_key: true
      allowed_values:
      - gauss
      - gaussian
      - fixed
      - mp
      - mp2
      - methfessel-paxton
      - mv
      - cold
      - marzari-vanderbilt
      - fd
      - fermi-dirac
    - key: smearing_sigma
      allow_missing_key: true
      min: 0.001
      max: 0.1
    - key: mixing_type
      allow_missing_key: true
      allowed_values:
      - broyden
      - plain
      - pulay
- key: variable_kpt_slab_inplane_density
  value:
    filename: KPT_slab
    pattern: ^\s*(?:1[2-9]|[2-9]\d|[1-9]\d{2,})\s+(?:1[2-9]|[2-9]\d|[1-9]\d{2,})\s+1(?:\s+\d+){0,3}\s*$
    flags: m
- key: input_bulk_relax_artifact
  value: INPUT_bulk_relax
- key: input_slab5_artifact
  value: INPUT_slab5
- key: input_slab7_artifact
  value: INPUT_slab7
- key: kpt_bulk_artifact
  value: KPT_bulk
- key: kpt_slab_artifact
  value: KPT_slab
- key: grounding_source
  value:
    filenames:
    - bulk_al_fcc.stru
    - slab_al_fcc100_5l.stru
    - slab_al_fcc100_7l.stru
