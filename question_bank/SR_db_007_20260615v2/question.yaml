id: SR_db_007_20260615v2
task_type: search_and_interpretation
capabilities:
- tool_utilization
- scientific_reasoning
domain: agnostic
difficulty: easy
intent: Retrieve up to five CoREMOF-2019 entries satisfying atom-count, surface-area, and element constraints.
human_prompt_seed: 'Retrieve and return no more than 5 MOFs from the CoREMOF 2019 database under the following constraints:

  - Number of atoms < 50;
  - Surface area > 1000 m²/g;
  - Contains both O and C elements.

  Please provide the following deliverables:

  1) `coremof_filtered_candidates.json`: containing at least `rank`, `name`, `database`, `n_atom`, `surface_area_m2g`,
  `elements`, and `structure_identifier`;
  2) `coremof_filter_report.md`: explain the filter conditions, ranking logic, and result uncertainty.

  In the final answer, confirm whether each candidate satisfies the threshold conditions.'
tags:
- meta_database
data_files: []
reference_answers:
- key: candidates_json
  value: coremof_filtered_candidates.json
- key: retrieval_report
  value: coremof_filter_report.md
- key: candidates_required_tokens
  value:
    filename: coremof_filtered_candidates.json
    tokens:
    - rank
    - name
    - database
    - n_atom
    - surface_area_m2g
    - elements
    - structure_identifier
    - CoREMOF
    - O
    - C
    flags: i
- key: threshold_regex
  value:
    filename: coremof_filtered_candidates.json
    pattern: '"n_atom"\s*:\s*(?:[0-9]|[1-3][0-9]|4[0-9])[\s\S]*?"surface_area_m2g"\s*:\s*(?:1000\.\d+|10[1-9]\d|[1-9]\d{3,})(?:\.\d+)?'
    flags: i
- key: report_required_tokens
  value:
    filename: coremof_filter_report.md
    tokens:
    - CoREMOF 2019
    - n_atom
    - surface_area
    - O
    - C
    - uncertainty
    flags: i
scoring_checklist:
- id: candidates_json
  criterion: Agent writes `coremof_filtered_candidates.json` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: retrieval_report
  criterion: Agent writes `coremof_filter_report.md` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: candidates_required_tokens
  criterion: Candidate JSON includes required MOF metadata and source/context fields.
  verify: text_file_contains_all
  capability: data_handling
  weight: 0.5
- id: threshold_regex
  criterion: Candidate JSON explicitly reflects atom-count and surface-area thresholds.
  verify: text_file_regex
  capability: data_handling
  weight: 0.5
- id: report_required_tokens
  criterion: Report explains filter constraints and uncertainty handling.
  verify: llm_binary_judge
  capability: data_handling
  weight: 0.5
- id: grounding_source
  criterion: The final answer is grounded in filtered retrieval outputs and does not fabricate candidates outside stated
    constraints.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
