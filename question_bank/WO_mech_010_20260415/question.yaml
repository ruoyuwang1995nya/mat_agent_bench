human_prompt_seed: '评估 AlCr0.8CoFeNi 高熵合金（HEA）的相形成倾向，需覆盖以下信息：

  1) 价电子浓度（VEC）、混合焓、混合熵等关键描述符； 2) 二元形成能/相图相关信息（用于辅助稳定性判断）； 3) 是否倾向形成固溶体，以及可能晶体结构。

  请完成以下交付： - `hea_alcr0.8cofeni_summary.json`：至少包含 `vec`, `mixing_enthalpy`, `mixing_entropy`,
  `binary_formation_energy_summary`, `solid_solution_prediction`, `possible_structure`；
  - `hea_alcr0.8cofeni_report.md`：解释判据、结论与不确定性。

  最终回答中简要给出”是否可能形成固溶体”的结论与依据。'
