version: v5
capability: scientific_analysis
domain: battery
questions:
- id: WO_general_sse_006_20260411v1
  capability: scientific_analysis
  domain: battery
  intent: Summarize sulfur-containing solid-electrolyte candidates for Li-metal interfaces
    by balancing interface stability and ionic conductivity from recent literature.
  human_prompt_seed: '请基于近年文献，推荐可用于锂金属负极界面的含硫固态电解质候选，并强调“界面稳定性 + 高离子电导”两方面的平衡。

    请输出： 1) `sulfur_sse_candidates.json`：至少包含 `material`, `key_property`, `interface_stability_note`,
    `ionic_conductivity_note`, `reference_hint`； 2) `sulfur_sse_review.md`：说明筛选逻辑、代表性体系与适用边界。

    最终回答中简要给出你最推荐的 2-3 个候选及理由。'
  tags:
  - meta_userlog
  - meta_literature
  data_files: []
  reference_answers:
  - key: candidates_json
    value: sulfur_sse_candidates.json
  - key: review_md
    value: sulfur_sse_review.md
  - key: candidates_required_tokens
    value:
      filename: sulfur_sse_candidates.json
      tokens:
      - material
      - key_property
      - interface_stability_note
      - ionic_conductivity_note
      - reference_hint
      flags: i
  - key: review_required_tokens
    value:
      filename: sulfur_sse_review.md
      tokens:
      - 含硫
      - 固态电解质
      - 界面稳定
      - 离子电导
      - 不确定性
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: candidates_json
    criterion: Agent writes `sulfur_sse_candidates.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: review_md
    criterion: Agent writes `sulfur_sse_review.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: candidates_required_tokens
    criterion: Candidate JSON includes required per-material fields.
    axis: correctness
    verify: text_file_contains_all
  - id: review_required_tokens
    criterion: Review explains the conductivity-stability tradeoff with uncertainty notes.
    axis: correctness
    verify: text_file_contains_all
  - id: grounding_source
    criterion: Deliverables are grounded in literature-oriented evidence and avoid unsupported
      performance claims.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget
- id: pl_hopping
  capability: scientific_analysis
  domain: battery
  intent: Analyze Li+ hopping in PEO-LiTFSI by comparing PMF barriers and diffusion evidence
    for two salt-ratio conditions.
  human_prompt_seed: '文件 `free_energy_hopping_bundle.json` 给出了 PEO-LiTFSI 在两个盐浓度条件下的局域结构、PMF
    和扩散关联数据。

    请完成一个 Li+ hopping 机制分析：

    1. 解释 reaction coordinate 的物理意义；

    2. 比较两种条件下 PMF 最低点、主要能垒和稳定态；

    3. 结合常规 MD 中的配位和扩散信息，判断哪种条件更有利于 hopping；

    4. 说明如果进一步做实验或更高精度模拟，应优先验证什么。

    '
  tags:
  - chem_her
  - phy_elastic
  - mat_polymer
  data_files:
  - key: free_energy_bundle
    path: data/pl_hopping/free_energy_hopping_bundle.json
    description: Free-energy bundle with PMF barriers, minima, state labels, and corresponding
      MD diffusion/coordination descriptors for two salt-ratio conditions.
  reference_answers:
  - key: lower_barrier_condition
    value: EO_Li_20
  - key: barrier_eo_li_20_eV
    value: 0.18
    tolerance: 0.05
  - key: barrier_eo_li_10_eV
    value: 0.33
    tolerance: 0.05
  - key: required_fields
    value:
    - pmf_profile
    - barrier_table
    - reaction_coordinate_note
    - hopping_mechanism
    - validation_suggestion
  - key: turn_budget
    value:
      max: 24
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 14000
  scoring_checklist:
  - id: barrier_eo_li_20_eV
    criterion: PMF main barrier for EO/Li = 20 is reported within tolerance of the curated
      value (~0.18 eV).
    axis: correctness
    verify: numerical_range
  - id: barrier_eo_li_10_eV
    criterion: PMF main barrier for EO/Li = 10 is reported within tolerance of the curated
      value (~0.33 eV).
    axis: correctness
    verify: numerical_range
  - id: lower_barrier_condition_correctness
    criterion: Final mechanism analysis identifies EO/Li = 20 as the condition with the lower
      hopping barrier and the more favorable Li+ migration pathway.
    axis: correctness
    verify: llm_binary_judge
  - id: required_fields
    criterion: Report includes PMF profile discussion, barrier table, reaction-coordinate
      note, hopping-mechanism interpretation, and a validation suggestion.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The PMF interpretation is explicitly tied to the provided free-energy and MD
      descriptors from free_energy_hopping_bundle.json rather than generic statements about
      ion transport.
    axis: grounding
    verify: llm_binary_judge
  - id: efficiency_judge
    criterion: The free-energy analysis compares the two conditions directly and avoids redundant
      side analysis.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
