human_prompt_seed: "计算CO在Ag(001)表面的吸附能：\n1. 获取Ag FCC体相结构（a=4.085 Å），切出(001)表面slab（4层，15\
  \ Å真空，3×3扩胞）；\n2. 构建气相CO分子（键长约1.128 Å）；\n3. 在slab顶层ontop位点放置CO分子（C端朝下，初始距离~2.0 Å）构建吸附结构；\n\
  4. 使用以下mock能量值（模拟DPA弛豫结果）：\n   - E_slab = -108.45 eV\n   - E_CO = -12.85 eV\n  \
  \ - E_adsorbed = -121.50 eV\n5. 按公式 E_ads = E(adsorbed) - E(slab) - E(CO) 计算吸附能；\n\
  6. 输出吸附能(eV)及三个结构的能量值。\n"
