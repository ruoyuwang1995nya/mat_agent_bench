intent: Compute vacancy formation energies for Fe-X doped supercells from mock BSSE-corrected energies; compare to QE 
  references and rank trends.
human_prompt_seed: 'Single-vacancy formation energies in doped Fe alloys (mock data only, no real DFT). Use the same formula for the following seven systems:


  E_f,vac = E_vac + μ_A − E_novac


  Here, E_vac has already been BSSE-corrected for the vacancy under ABACUS LCAO (with ghost/empty basis functions at the vacancy site), E_novac is the energy of the supercell without a vacancy, and μ_A is the chemical potential of the removed atom (given in the prompt).


  Mock data (unit: eV):

  - Fe53Cr: E_novac=-963.52, E_vac=-946.21, μ_A=-15.23; QE reference E_f=2.00

  - Fe53Al: E_novac=-958.73, E_vac=-942.88, μ_A=-13.98; QE reference E_f=1.92

  - Fe53Ti: E_novac=-961.45, E_vac=-944.82, μ_A=-14.70; QE reference E_f=1.99

  - Fe53Co: E_novac=-968.91, E_vac=-951.02, μ_A=-15.70; QE reference E_f=2.26

  - Fe53Mo: E_novac=-967.23, E_vac=-949.91, μ_A=-15.30; QE reference E_f=2.13

  - Fe53Nb: E_novac=-964.85, E_vac=-948.32, μ_A=-14.68; QE reference E_f=1.91

  - Fe53B:  E_novac=-955.40, E_vac=-939.54, μ_A=-13.93; QE reference E_f=1.97


  Requirements: compute E_f,vac for each case; provide a comparison table between ABACUS (mock) and QE; rank the systems from low to high E_f and briefly discuss which dopants trend toward easier vacancy formation. Also explain why E_vac requires BSSE correction.

  '
