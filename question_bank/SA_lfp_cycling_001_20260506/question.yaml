id: SA_lfp_cycling_001_20260506
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: battery
intent: Analyze LiFePO4 half-cell cycling data from a Neware workbook.
human_prompt_seed: '请下载并分析以下通过 OSS URL 提供的 Neware 工作簿：

  - `lfp_cycling.xlsx` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_lfp_cycling_001/1778083319_002_6(--).xlsx`

  该工作簿来自 LiFePO4 半电池恒流充放电测试。

  请完成以下分析：

  1. 读取循环汇总数据，整理前若干圈的充放电容量、比容量和库伦效率； 2. 报告首圈放电比容量和首圈库伦效率； 3. 报告第 10 圈放电比容量，并以第 2 圈为较稳定的早期参考计算容量保持情况； 4. 判断该数据是否表现出明显首圈不可逆损失或早期活化/衰减特征；
  5. 简要说明你如何处理工作簿中的多张表。

  最终回答末尾请追加 `<eval_results>...</eval_results>` JSON，至少包含： `cycle1.discharge_capacity_mAh_g`, `cycle1.coulombic_efficiency_pct`,
  `cycle10.discharge_capacity_mAh_g`, `cycle10.retention_vs_cycle2_pct`。

  JSON 中字段名形如 `a.b` 表示嵌套对象（顶层 `a` 下的子键 `b`），请使用嵌套结构而不要写成扁平字符串键。结构示例（数值仅占位）：

  ```json {"cycle1": {"discharge_capacity_mAh_g": 0, "coulombic_efficiency_pct": 0}, "cycle10": {"discharge_capacity_mAh_g":
  0, "retention_vs_cycle2_pct": 0}} ```'
tags:
- char_battery_cycling
