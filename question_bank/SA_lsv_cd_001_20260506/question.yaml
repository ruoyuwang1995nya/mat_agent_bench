  capability: data_handling
  weight: 0.5
- id: regulatory_conclusion
  criterion: The final answer compares the sample Cd concentration with the 0.1 mg/L limit and concludes that it is 
    below the limit.
  axis: correctness
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: grounding_source
  criterion: The analysis is grounded in the uploaded LSV traces and does not rely on unstated report values.
  axis: grounding
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
