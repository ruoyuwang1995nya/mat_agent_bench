  criterion: 'In the FINAL delivered answer (not intermediate steps), a Cu(001) H
    adsorption energy of approximately −0.62 eV is explicitly reported as a number
    (accept ±0.2 eV). NOTE: The answer may be in Chinese with markdown tables; ''|------|''
    separator lines are standard table formatting, NOT truncation indicators. Intermediate
    computation errors do not matter if the final answer contains the value.'
  axis: correctness
  verify: llm_binary_judge
- id: E_ads_Ag
  criterion: 'In the FINAL delivered answer (not intermediate steps), an Ag(001) H
    adsorption energy of approximately −0.73 eV is explicitly reported as a number
