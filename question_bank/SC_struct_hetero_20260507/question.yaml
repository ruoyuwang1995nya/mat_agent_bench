id: SC_struct_hetero_20260507
task_type: simulation
capabilities:
- structure_manipulation
domain: semiconductor
difficulty: easy
intent: Build a graphene/h-BN vertical van der Waals heterostructure with controlled lattice mismatch.
human_prompt_seed: '读取 `hetero_spec.json`，构建 graphene/h-BN 垂直范德华异质结。 要求：(1) 构建共度超胞使晶格失配 < 2%；(2) AB 堆叠，层间距 3.35 A； (3) z 方向加
  15 A 真空层。输出 `hetero_graphene_hBN.cif` 和 `hetero_graphene_hBN_POSCAR`，报告实际失配度和总原子数。

  最终答案必须包含 `<eval_results>{"lattice_mismatch_percent": <number>}</eval_results>`，其中 `lattice_mismatch_percent` 为实际晶格失配百分比。

  '
tags:
- struct_surface
data_files:
- key: hetero_spec
  path: hetero_spec.json
  oss_url: ''
  description: Specification for graphene/h-BN heterostructure construction.
reference_answers:
- key: poscar_exists
  value: hetero_graphene_hBN_POSCAR
- key: poscar_parsable
  value:
    filename: hetero_graphene_hBN_POSCAR
- key: mismatch_percent
  value:
    json_path: lattice_mismatch_percent
    target: 1.6
    tolerance: 1.0
- key: b_n_ratio
  value:
    filename: hetero_graphene_hBN.cif
    element_a: B
    element_b: N
    expected_ratio: 1.0
    tolerance: 0.01
- key: c_b_ratio
  value:
    filename: hetero_graphene_hBN.cif
    element_a: C
    element_b: B
    expected_ratio: 2.0
    tolerance: 0.05
- key: interlayer_distance_A
  value:
    filename: hetero_graphene_hBN.cif
    element_a: C
    element_b: B
    cutoff_A: 5.0
    expected: 3.35
    tolerance: 0.3
- key: required_fields
  value:
  - structure_file
  - lattice_mismatch_percent
  - total_atoms
  - interlayer_distance_A
  - stacking
  - vacuum_A
scoring_checklist:
- id: poscar_exists
  criterion: Agent writes `hetero_graphene_hBN_POSCAR` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: poscar_parsable
  criterion: The POSCAR deliverable can be parsed as a structure file.
  verify: struct_file_parsable
  capability: structure_manipulation
  weight: 0.5
- id: mismatch_percent
  criterion: Lattice mismatch reported in `<eval_results>` is below 2% and close to the reference.
  verify: answer_json_numeric
  capability: scientific_reasoning
  weight: 0.5
- id: b_n_ratio
  criterion: The output CIF preserves B:N = 1:1 stoichiometry for the h-BN layer.
  verify: struct_file_stoichiometry_ratio
  capability: structure_manipulation
  weight: 0.5
- id: c_b_ratio
  criterion: The output CIF preserves C:B = 2:1, equivalent to graphene/h-BN composition BC2N up to supercell scaling.
  verify: struct_file_stoichiometry_ratio
  capability: structure_manipulation
  weight: 0.5
- id: interlayer_distance_A
  criterion: The mean C-B interlayer distance read from the output CIF is near 3.35 A.
  verify: struct_file_bond_length
  capability: structure_manipulation
  weight: 0.5
- id: required_fields
  criterion: Output includes structure file, lattice mismatch percentage below 2%, total atom count, interlayer distance
    near 3.35 A, AB stacking, and vacuum thickness near 15 A.
  verify: llm_binary_judge
  capability: structure_manipulation
  weight: 0.5
- id: grounding_source
  criterion: The answer states the physical picture (lattice matching, AB stacking, interlayer spacing, vacuum, how 
    mismatch is defined) and ties it to the delivered POSCAR/CIF, not generic claims disconnected from those files. 
    Judge solely from the final answer and named deliverables; do not fail because the tool-call log omits MCP, 
    web_search, or any specific tool.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
