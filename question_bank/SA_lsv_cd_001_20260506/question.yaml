reference_answers:
- key: calibration_slope
  value:
    json_path: calibration.slope_A_per_ugL
    target: 4.231258196721311e-07
    tolerance: 7.0e-08
  unit: A/(ug/L)
- key: calibration_r2
  value:
    json_path: calibration.r_squared
    target: 0.9943284089797766
    tolerance: 0.03
- key: sample_cd
  value:
    json_path: sample.cd_mg_L
    target: 0.03708103333213872
    tolerance: 0.005
  unit: mg/L
- key: sample_ep
