id: SC_struct_006_20260507
task_type: simulation
capabilities:
- structure_manipulation
domain: agnostic
intent: Add missing hydrogens to the diacetylmorphine (DACMOR) molecular crystal CIF
  and validate the formula, local molecular environment, and tetrahedral geometry
  using MolCrysKit.
human_prompt_seed: '对以下通过 OSS URL 提供的 CIF 结构进行补氢处理：

  - `DACMOR.cif` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/cda9f292ec4b411facb478d0486b54ce/DACMOR.cif`


  该结构为二乙酰吗啡（diacetylmorphine）分子晶体，从单晶XRD解析得到，但缺少了 H 原子。

  请对该结构补氢，并导出为 `dacmor_hydrogenated.cif`。

  要求：添加 H 原子使结构符合价键规则、具备化学意义。


  重点检查并在最终答案中明确报告：

  (1) 补氢后每个分子的最简化学式；

  (2) 每个分子中 H 原子的总数；

  (3) 代表性的 H-C-H 键角（度）；

  (4) 补氢后分子的连接性是否完整（无断裂或多余键）。


  输出结构文件，并给出上述核查结论。

  '
tags:
- struct_molcrys
data_files:
- key: dacmor_cif
  path: DACMOR.cif
  oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/cda9f292ec4b411facb478d0486b54ce/DACMOR.cif
  description: DACMOR (diacetylmorphine) molecular-crystal CIF missing explicit H
    atoms.
reference_answers:
- key: file_exists
  value: dacmor_hydrogenated.cif
- key: target_formula
  value:
    filename: dacmor_hydrogenated.cif
    formula: C21H23NO5
- key: hch_angle_deg
  value:
    filename: dacmor_hydrogenated.cif
    triplet:
    - H
    - C
    - H
    expected_deg: 109.48
    tolerance_deg: 8.0
    cutoff_A: 1.5
- key: molcrys_local_env
  value:
    filename: dacmor_hydrogenated.cif
    expected_formula: C21H23NO5
    z_value: 4
- key: explicit_report_tokens
  value:
  - C21H23NO5
  - '109'
  - dacmor_hydrogenated.cif
- key: turn_budget
  value:
    max: 20
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 28000
scoring_checklist:
- id: file_exists
  criterion: The output file `dacmor_hydrogenated.cif` exists.
  axis: correctness
  verify: artifact_exists
- id: target_formula
  criterion: The reduced chemical formula read from dacmor_hydrogenated.cif matches
    C21H23NO5.
  axis: correctness
  verify: struct_file_formula
- id: hch_angle_deg
  criterion: The mean H-C-H angle computed from dacmor_hydrogenated.cif is close to
    tetrahedral 109.48 degrees within a reasonable tolerance.
  axis: correctness
  verify: struct_file_bond_angle
- id: molcrys_local_env
  criterion: MolCrysKit validates that the hydrogenated output has correct molecular
    connectivity (no fragmented or over-bonded molecules), each molecule matches the
    expected formula, and ChemicalEnvironment analysis confirms H-bearing atoms have
    chemically consistent local geometry (hybridisation, coordination).
  axis: correctness
  verify: molcrys_local_env
- id: explicit_report_tokens
  criterion: Final answer explicitly reports formula C21H23NO5, a representative H-C-H
    angle near 109 degrees, and the `dacmor_hydrogenated.cif` output basename.
  axis: correctness
  verify: contains_all
- id: grounding_source
  criterion: The answer states the chemical/geometry rationale (which C/N atoms receive
    H, tetrahedral geometry targets, carbonyl/ester O should not be hydrogenated)
    and ties checks to `dacmor_hydrogenated.cif` and the input CIF, not only procedural
    wording disconnected from those files. Judge solely from the final answer and
    named deliverables; do not fail because the tool-call log omits MCP, web_search,
    or any specific tool.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: Hydrogen addition is not repeated with identical parameters.
  axis: efficiency
  verify: no_retries
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: efficiency_judge
  criterion: The hydrogenation and validation workflow completes directly without
    redundant exploratory steps.
  axis: efficiency
  verify: llm_binary_judge
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage is recorded and stays within a generous benchmark ceiling
    (tunable per task after calibration).
  axis: efficiency
  verify: token_budget
