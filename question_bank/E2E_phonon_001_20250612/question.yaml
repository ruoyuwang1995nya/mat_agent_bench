reference_answer_prompt: '1. Read poscar_initial.txt with ASE. 2. Attach uMLIP calculator (e.g., MACE). 3. Relax structure:
  FIRE optimizer, fmax=0.005 eV/Å, with symmetrization. 4. Save relaxed structure. 5. Set up PHONOPY: determine supercell
  matrix (e.g., 2x2x2 for zincblende), displacement distance 0.01 Å. 6. Generate displaced supercells and compute forces.
  7. Build force constants matrix. 8. Fourier interpolate to 20x20x20 q-grid for DOS. 9. Compute max phonon frequency from
  eigenvalues. 10. Assess dynamical stability: check for imaginary modes beyond -50 K threshold away from Gamma. 11. Compute
  thermodynamic properties at 300 K: entropy, free energy, heat capacity from DOS integration. 12. Write benchmark_results.json
  with all properties. 13. Write workflow_log.txt documenting decisions and intermediate results.'
