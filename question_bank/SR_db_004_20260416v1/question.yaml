id: SR_db_004_20260416v1
task_type: search_and_interpretation
capabilities:
- tool_utilization
- scientific_reasoning
domain: battery
difficulty: easy
intent: Retrieve five Li-Mn-O materials from Alexandria and summarize machine-checkable provenance metadata.
human_prompt_seed: '从 Alexandria 数据源检索包含 Li、Mn、O 三种元素的材料，并返回 5 条候选。

  请完成以下交付：

  1) `lmo_candidates.json`：列出 5 条候选，每条至少包含 `rank`, `formula`, `database_source`, `structure_identifier`, `elements`, `format_available`；

  2) `lmo_retrieval_report.md`：说明检索条件（元素约束、结果数量）、候选筛选与结果不确定性；

  3) 在最终回答中简要确认：是否满足“Li+Mn+O 全部同时包含”与“共 5 条”这两个约束。

  注意：本题是结构检索与汇总，不要求后续计算。'
tags:
- meta_database
data_files: []
reference_answers:
- key: candidates_json
  value: lmo_candidates.json
- key: retrieval_report
  value: lmo_retrieval_report.md
- key: candidates_required_tokens
  value:
    filename: lmo_candidates.json
    tokens:
    - rank
    - formula
    - database_source
    - structure_identifier
    - elements
    - format_available
    - Li
    - Mn
    - O
    flags: i
- key: report_required_tokens
  value:
    filename: lmo_retrieval_report.md
    tokens:
    - Alexandria
    - Li
    - Mn
    - O
    - 5
    - 检索条件
    - 不确定性
    flags: i
scoring_checklist:
- id: candidates_json
  criterion: Agent writes `lmo_candidates.json` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: retrieval_report
  criterion: Agent writes `lmo_retrieval_report.md` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: candidates_required_tokens
  criterion: Candidate JSON includes required provenance fields and explicitly contains Li/Mn/O element information.
  verify: text_file_contains_all
  capability: data_handling
  weight: 0.5
- id: report_required_tokens
  criterion: Retrieval report states Alexandria source, filter constraints, candidate count, and uncertainty note.
  verify: llm_binary_judge
  capability: data_handling
  weight: 0.5
- id: grounding_source
  criterion: The final answer is grounded in retrieval outputs and accurately reflects whether all constraints (elements
    + count) are met.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
