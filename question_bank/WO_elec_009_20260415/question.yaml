intent: Compute Si phonon dispersion with ABACUS (including relaxation step) and summarize key spectrum outcomes.
human_prompt_seed: "计算 Si 的声子特征（Mock版）：\n1. 先 query/检索并梳理本任务所需输入文件（结构文件、参数文件、声子相关输入）；\n2. 给出你会采用的声子设置（k 路径/采样、超胞或最小长度、位移步长）；\n\
  3. 不做真实 ABACUS 计算，使用以下 mock 结果进行后处理：\n   - supercell_or_min_length = \"3x3x3\"\n   - displacement_step = 0.01\n   - gamma_optical_frequency_THz
  = 15.6\n   - imaginary_mode_check = false\n4. 汇总是否存在虚频，并给出结果可信度与不确定性说明。\n\n请完成以下交付：\n1) `si_phonon_abacus.json`：至少包含 `input_files`,
  `kpath_or_sampling`, `supercell_or_min_length`, `displacement_step`, `imaginary_mode_check`, `key_frequency_summary`；\n\
  2) `si_phonon_abacus_report.md`：说明 query 输入梳理 + mock 后处理流程、关键结论与不确定性。\n\n最终回答请简要说明是否出现虚频，并标注为 mock 后处理结论。\n"
