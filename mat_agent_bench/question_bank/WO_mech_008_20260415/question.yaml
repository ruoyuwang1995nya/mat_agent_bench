  \ 说明采用的弹性方法与形变设置；\n3. 不做真实计算，使用以下 mock 结果：\n   - C11 = 316.8 GPa\n   - C12 = 101.5\
  \ GPa\n   - C44 = 125.7 GPa\n   - elastic_method = finite_strain\n4. 基于 mock 结果完成后处理与物理意义讨论。\n\
  \n请完成以下交付：\n1) `srtio3_elastic_apex.json`：至少包含 `input_files`, `C11`, `C12`, `C44`,\
  \ `elastic_method`, `deformation_settings`；\n2) `srtio3_elastic_apex_report.md`：说明\
  \ query 输入梳理、mock 后处理流程与结果可靠性讨论。\n\n最终回答中简要给出关键弹性常数并解释其物理含义。\n"
