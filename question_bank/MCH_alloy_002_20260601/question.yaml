reference_answer_prompt: 'For hexagonal system: BV=(2*(C11+C12)+4*C13+C33)/9, BR=C^2/M where M=C11+C12+2*C33-4*C13, C=(C11+C12)*C33-2*C13^2.
  GV=(C11-C12+3*C44+2*C66)/10 (with C66=(C11-C12)/2). GR formulas are more complex. Then AU=5*GV/GR+BV/BR-6. Paper values:
  AU=1.479, A1=1.017, A2=1.017, A3=0.991.'
