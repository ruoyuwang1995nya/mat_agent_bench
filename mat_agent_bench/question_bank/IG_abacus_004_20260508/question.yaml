id: IG_abacus_004_20260508
capability: input_generation
domain: agnostic
intent: Generate ABACUS PW SCF input for dipole correction on an asymmetric H2O slab,
  with the saw-like region placed in vacuum and no finite external field.
human_prompt_seed: '工作区中提供了一个带较大真空区的 H2O 结构（STRU）。


  请准备 ABACUS 平面波单点输入，目标是做偶极修正的静电势分析：

  1) 生成一份 SCF INPUT，开启偶极修正相关设置，并明确这是“偶极修正场景”而非施加有限外场。

  2) 生成与该大真空超胞匹配的 Gamma 点 KPT。


  将结果写入当前目录：`INPUT_dipole`、`KPT_dipole`。

  '
tags:
- eng_abacus
- struct_surface
data_files:
- key: base_h2o
  path: base_h2o.stru
  oss_url: ''
  description: H2O in a vacuum cell for dipole-correction setup.
reference_answers:
- key: must_input_dipole_core
  value:
    filename: INPUT_dipole
    tokens:
    - calculation scf
    - basis_type pw
    - efield_flag 1
    - dip_cor_flag 1
    - efield_amp 0.0
    flags: i
- key: must_input_dipole_ntype_matches_species
  value:
    filename: INPUT_dipole
    pattern: (?im)^\s*ntype\s+2\s*$
    flags: im
- key: must_kpt_dipole_gamma_marker
  value:
    filename: KPT_dipole
    tokens:
    - K_POINTS
    - Gamma
    flags: i
- key: must_kpt_dipole_single_point
  value:
    filename: KPT_dipole
    pattern: ^\s*1\s+1\s+1(?:\s+\d+){0,3}\s*$
    flags: m
- key: suggested_input_dipole_numerics
  value:
    filename: INPUT_dipole
    checks:
    - key: ecutwfc
      min: 35
      max: 75
    - key: scf_thr
      min: 1.0e-10
      max: 0.01
    - key: out_pot
      expected: 2
      tolerance: 0
    - key: efield_dir
      expected: 2
      tolerance: 0
- key: variable_input_dipole_window
  value:
    filename: INPUT_dipole
    tokens:
    - efield_pos_max
    - efield_pos_dec
    flags: i
- key: variable_input_dipole_smearing
  value:
    filename: INPUT_dipole
    checks:
    - key: smearing_method
      allow_missing_key: true
      allowed_values:
      - gauss
      - gaussian
      - fixed
      - mp
      - mp2
      - methfessel-paxton
      - mv
      - cold
      - marzari-vanderbilt
      - fd
      - fermi-dirac
    - key: smearing_sigma
      allow_missing_key: true
      min: 0.001
      max: 0.1
- key: input_dipole_artifact
  value: INPUT_dipole
- key: kpt_dipole_artifact
  value: KPT_dipole
- key: grounding_source
  value:
    filename: base_h2o.stru
- key: turn_budget
  value:
    max: 8
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 8000
scoring_checklist:
- id: must_input_dipole_core
  criterion: '[Must] INPUT_dipole contains core mandatory dipole-correction controls.'
  axis: correctness
  verify: text_file_contains_all
  weight: 1.0
- id: must_input_dipole_ntype_matches_species
  criterion: '[Must] INPUT_dipole sets ntype to 2, matching the two species (H and
    O) defined in the STRU ATOMIC_SPECIES section.'
  axis: correctness
  verify: text_file_regex
  weight: 1.0
- id: must_kpt_dipole_gamma_marker
  criterion: '[Must] KPT_dipole is a Gamma-centered K-point file.'
  axis: correctness
  verify: text_file_contains_all
  weight: 1.0
- id: must_kpt_dipole_single_point
  criterion: '[Must] KPT_dipole uses a single Gamma point (1x1x1).'
  axis: correctness
  verify: text_file_regex
  weight: 1.0
- id: suggested_input_dipole_numerics
  criterion: '[Suggested] INPUT_dipole follows benchmark numeric settings with tolerance
    (ecut/scf_thr/out_pot/dir).'
  axis: correctness
  verify: text_file_numeric_range
  weight: 0.6
- id: variable_input_dipole_window
  criterion: '[Variable] INPUT_dipole provides dipole window position controls (`efield_pos_max`,
    `efield_pos_dec`).'
  axis: correctness
  verify: text_file_contains_all
  weight: 0.3
- id: variable_input_dipole_smearing
  criterion: '[Variable] If INPUT_dipole includes smearing parameters, they should
    be acceptable for this task family; missing smearing settings should not fail
    this item.'
  axis: correctness
  verify: text_file_numeric_range
  weight: 0.3
- id: input_dipole_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `INPUT_dipole` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 0.5
- id: kpt_dipole_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `KPT_dipole` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 0.5
- id: grounding_source
  criterion: The generated setup is grounded in base_h2o.stru and does not modify
    the provided structure beyond preparing INPUT/KPT.
  axis: grounding
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: no_retries
  criterion: No repeated identical tool calls with the same parameter set.
  axis: efficiency
  verify: no_retries
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
  axis: efficiency
  verify: token_budget
