intent: Generate GROMACS simulation parameter file for energy minimization.
human_prompt_seed: 'Please generate a GROMACS energy-minimization parameter file for a protein system with the following
  requirements:

  1. Use the steepest-descent method

  2. Maximum number of steps: 50000

  3. Energy-convergence criterion: emtol = 1000.0 kJ/mol/nm

  4. Step size: emstep = 0.01 nm

  5. Use the Verlet cutoff scheme, with Coulomb and van der Waals cutoff distances of 1.0 nm

  The output filename must be `em.mdp`.'
