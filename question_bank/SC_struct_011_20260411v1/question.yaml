id: SC_struct_011_20260411v1
task_type: simulation
capabilities:
- structure_manipulation
domain: agnostic
intent: Build a multi-component Fe-Ni-Co-Cr-V alloy structure from an fcc-Ni 5x5x5
  supercell template and report composition constraints.
human_prompt_seed: '请构建一个 Fe-Ni-Co-Cr-V 合金结构并导出为 `alloy_5x5x5_feni_cocrv.cif`。

  目标组成比例（原子分数）： Fe:Ni:Co:Cr:V = 0.635:0.165:0.10:0.05:0.05。

  要求： 1) 先以 fcc-Ni 为模板，构建 5×5×5 超胞后再进行掺杂替换； 2) 生成 `alloy_composition_report.json`，至少包含：
  `template`, `supercell`, `target_ratio`, `element_counts`, `notes`； 3) 在最终回答中说明比例如何映射到整数原子数，并给出可能的取整偏差说明。

  '
tags:
- mat_alloy
- phy_surface
- mat_hea
- meta_userlog
data_files: []
reference_answers:
- key: structure_artifact
  value: alloy_5x5x5_feni_cocrv.cif
- key: report_artifact
  value: alloy_composition_report.json
- key: report_required_tokens
  value:
    filename: alloy_composition_report.json
    tokens:
    - template
    - supercell
    - target_ratio
    - element_counts
    - Fe
    - Ni
    - Co
    - Cr
    - V
    flags: i
- key: turn_budget
  value:
    max: 18
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 10000
scoring_checklist:
- id: structure_artifact
  criterion: Agent writes `alloy_5x5x5_feni_cocrv.cif` to workspace.
  axis: correctness
  verify: artifact_exists
- id: report_artifact
  criterion: Agent writes `alloy_composition_report.json` to workspace.
  axis: correctness
  verify: artifact_exists
- id: report_required_tokens
  criterion: Composition report includes template/supercell metadata and explicit
    element-count entries for Fe, Ni, Co, Cr, and V.
  axis: correctness
  verify: text_file_contains_all
- id: grounding_source
  criterion: The final answer ties alloy construction details to `alloy_5x5x5_feni_cocrv.cif`
    and `alloy_composition_report.json`, and explicitly discusses integer mapping
    or rounding of the target fractions.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: No repeated identical tool calls with the same parameter set.
  axis: efficiency
  verify: no_retries
- id: efficiency_judge
  criterion: Workflow follows a compact path (template build → supercell → doping
    → report) without redundant loops.
  axis: efficiency
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage is recorded and stays within a generous benchmark ceiling
    (tunable per task after calibration).
  axis: efficiency
  verify: token_budget
