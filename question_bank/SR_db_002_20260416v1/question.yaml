domain: agnostic
intent: Retrieve a target prototype crystal structure from an open database and summarize the returned structural 
  metadata.
human_prompt_seed: '从开源数据库获取一个 MgB2 晶体结构。


  请完成以下交付：

  1) `mgb2_retrieval.json`：至少包含 `formula`, `database_source`, `structure_identifier`, `space_group`, `lattice_summary`, `candidate_count`；

  2) `mgb2_notes.md`：解释你如何确认该结果是 MgB2，以及如果返回了多个候选你是如何筛选的；

  3) 在最终回答中说明这是“结构检索结果总结”，不要扩展到后续声子或电子结构计算。

  '
