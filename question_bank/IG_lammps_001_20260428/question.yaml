- workflow_orchestration
domain: agnostic
intent: Generate a LAMMPS molecular dynamics input file for a simple Lennard-Jones system relaxation.
human_prompt_seed: '请为一个 FCC 铜体系生成 LAMMPS 分子动力学输入文件，要求：

  1. 使用 EAM 势（Cu_u3.eam），晶格常数 3.615 Å

  2. 3×3×3 超胞

  3. NPT 系综，温度 300 K，压力 0 bar

  4. 运行 10000 步，时间步长 1 fs

  5. 每 100 步输出热力学信息

  输出文件名为 `in.lammps`。'
tags:
- eng_lammps
data_files: []
reference_answers:
- key: input_artifact
  value: in.lammps
- key: required_keywords
  value:
    filename: in.lammps
    tokens:
    - pair_style
    - pair_coeff
    - fix
    - npt
    - run
    - thermo
    flags: i
