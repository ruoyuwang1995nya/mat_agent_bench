- key: sigma_J_m2
  value: 2.411
  tolerance: 0.12
- key: required_fields
  value:
  - sigma_J_m2
  - formula
  - bsse_note
  - vasp_compare
scoring_checklist:
- id: sigma_J_m2
  criterion: Surface energy sigma in J/m^2 matches mock-data calculation within tolerance (~2.41 J/m^2).
  axis: correctness
  verify: numerical_range
  capability: tool_utilization
  weight: 0.5
- id: required_fields
  criterion: Report states sigma in J/m^2, shows sigma=(E_slab-E_bulk)/(2A), notes BSSE empty-layer rationale, and 
    compares to VASP ~2.412 J/m^2.
  axis: correctness
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: grounding_source
  criterion: Numeric sigma is computed from the given mock E_bulk, E_slab, and A; no invented energies. Judge solely 
    from the final answer; do not fail because the tool-call log omits MCP, web_search, or any specific tool.
  axis: grounding
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
