domain: catalysis
difficulty: easy
intent: Build ZnS(001) polar surface slab with 3 layers and 2x2x1 supercell per doc 3.1.2.
human_prompt_seed: 'ZnS 化合物 (001) 切面 slab：3 层厚度、2×2×1 扩胞，真空 ≥15 Å。若为极性表面，说明是否采用对称 slab 或偶极修正策略。输出 slab 结构文件为 `ZnS_001_slab.cif`，并简述终止面/化学计量处理。

  '
tags:
- struct_surface
data_files: []
