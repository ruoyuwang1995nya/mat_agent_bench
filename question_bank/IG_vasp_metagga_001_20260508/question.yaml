id: IG_vasp_metagga_001_20260508
task_type: simulation
capabilities:
- tool_utilization
- workflow_orchestration
domain: agnostic
intent: Generate VASP INCAR for r2SCAN meta-GGA calculation with required LASPH setting.
human_prompt_seed: '工作区中有 TiO2_rutile.vasp（金红石结构 TiO2，6 个原子）。

  生成 r2SCAN 泛函结构优化的 INCAR 文件 `INCAR_r2scan`，要求：

  - r2SCAN meta-GGA 泛函

  - 结构优化（离子+晶胞）

  - ENCUT = 600 eV

  - 力收敛标准 0.01 eV/A'
tags:
- eng_vasp
data_files: []
reference_answers:
- key: incar_r2scan_artifact
  value: INCAR_r2scan
- key: must_metagga
  value:
    filename: INCAR_r2scan
    tokens:
    - METAGGA = R2SCAN
    - METAGGA=R2SCAN
    flags: i
- key: must_lasph
  value:
    filename: INCAR_r2scan
    tokens:
    - LASPH = .TRUE.
    - LASPH=.TRUE.
    flags: i
- key: must_isif3
  value:
    filename: INCAR_r2scan
    pattern: ISIF\s*=\s*3
    flags: i
- key: must_ediffg
  value:
    filename: INCAR_r2scan
    pattern: EDIFFG\s*=\s*-0\.01
    flags: i
- key: duration_budget
  value:
    max: 7200000
