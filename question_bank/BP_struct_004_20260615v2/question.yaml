id: BP_struct_004_20260615v2
task_type: simulation
capabilities:
- data_handling
- scientific_reasoning
domain: semiconductor
difficulty: easy
intent: Perform batch post-processing of pre-computed band structures for 3 materials (Si, Ge, GaAs) with unified 
  analysis parameters. Extract band gaps and band edge positions using identical k-paths, energy windows, and plot 
  specifications across all materials.
human_prompt_seed: 'Read the band structure post-processing configuration for 3 materials (Si, Ge, GaAs) from `postprocessing_bandstr.json`.

  Each material corresponds to one pre-computed band structure CSV file (Si_bandstructure.csv, Ge_bandstructure.csv, GaAs_bandstructure.csv),
  containing band eigenvalue data along the M-Gamma-K path. The CSV columns are formatted as: k_index, k_distance, k_label,
  band_1, ..., band_N, where band_1-band_4 are valence bands and band_5-band_7 are conduction bands. The energy unit is
  eV, with energies referenced to VBM = 0.

  Apply the same analysis workflow to each material: 1. The k-path is fixed as M-Gamma-K, with 50 k-points per segment
  2. Use a unified energy window of [-5, 5] eV 3. Use VBM (valence band maximum) as the Fermi level reference 4. Use
  the same plot style and range for all figures

  Output requirements: 1. 3 band structure PNG plots 2. 3 data tables (CSV format) 3. A summary table of band gap values
  and band edge positions

  Key evaluation points: 1. Analysis parameters (k-path, energy window) are exactly consistent across all materials 2.
  Although the absolute band gaps differ among materials, the analysis workflow is the same 3. Output files and data formats
  are uniform

  '
tags:
- eng_vasp
