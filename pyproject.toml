[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mat-bench"
version = "0.3.2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.10.0",
]

[project.optional-dependencies]
validators = ["pymatgen>=2024.1.1"]
server = ["fastapi>=0.100.0", "uvicorn>=0.20.0", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0"]

[project.scripts]
mat-bench = "mat_bench.cli:main"

[tool.setuptools]
packages = { find = { include = ["mat_bench", "mat_bench.*"] } }

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_parser = "angular"
tag_format = "v{version}"
commit_message = "chore(release): bump version to {version} [skip ci]"
major_on_zero = false
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
dist_glob_patterns = []
upload_to_vcs_release = true
