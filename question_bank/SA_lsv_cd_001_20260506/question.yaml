    json_path: sample.peak_potential_V
    target: -0.82
    tolerance: 0.03
  unit: V
scoring_checklist:
- id: calibration_slope
  criterion: The calibration slope reported in eval_results is consistent with the uploaded Cd standard traces.
  axis: correctness
  verify: answer_json_numeric
  weight: 0.5
  capability: data_handling
- id: calibration_r2
  criterion: The calibration quality reported in eval_results is consistent with the uploaded standard traces.
  axis: correctness
  verify: answer_json_numeric
  weight: 0.5
  capability: data_handling
- id: sample_cd
  criterion: The wastewater Cd concentration reported in eval_results is consistent with the uploaded sample trace and
    calibration data.
  axis: correctness
  verify: answer_json_numeric
  weight: 0.5
  capability: data_handling
- id: sample_ep
  criterion: The sample peak potential reported in eval_results is consistent with the uploaded sample trace.
  axis: correctness
