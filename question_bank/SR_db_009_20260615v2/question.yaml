difficulty: easy
intent: Retrieve five candidate Heusler-alloy structures and summarize downloadable structure resources.
human_prompt_seed: 'Retrieve and return 5 candidate Heusler-alloy structures, and provide structure-file or download-link
  information.

  Please provide the following deliverables:

  1) `heusler_candidates.json`: containing at least `rank`, `formula`, `space_group`, `space_group_number`, `database_source`,
  `structure_identifier`, and `cif_link_or_path`;
  2) `heusler_retrieval_report.md`: explain the retrieval conditions, the basis for identifying Heusler structures, and
  the uncertainty of the results.

  In the final answer, briefly confirm the number of candidates and the availability of downloadable resources.'
