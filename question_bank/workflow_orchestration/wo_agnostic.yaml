      - Al2O3
      - charge
      - transfer
      - Al
      - O
      - 不确定性
      flags: i
  - key: al_bader_charge_mock
    value: 2.31
    tolerance: 0.3
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
