difficulty: hard
intent: Starting from crystal structures of LiFePO4 and LiFeSO4F (favorite polymorph), compute Madelung fields at both 
  transition-metal and alkali sites using Ewald summation with formal charges, predict cell voltages using the model 
  V_cell proportional to |M_M + M_A|, and explain the physical origin of the voltage difference between the two 
  materials.
human_prompt_seed: 'Starting from the provided crystal structures of LiFePO4 (olivine) and LiFeSO4F (favorite polymorph),
  predict the cell voltage for each material using the Madelung field model. Report all intermediate values and final predictions in results.json with keys: lifepo4_madelung_fe,
  lifepo4_madelung_li, lifepo4_voltage_au, lifeso4f_madelung_fe, lifeso4f_madelung_li, lifeso4f_voltage_au. Provide a physical
  explanation for the voltage difference between the two materials in terms of ligand inductive effects and crystal structure
  contributions in analysis.txt. Write a trajectory of your workflow steps in workflow.txt, including all intermediate calculations.'
tags:
- madelung
- ewald_summation
- polymorphism
- cell_voltage
- formal_charges
