intent: Orchestrate Ni-content sweeps for duplex stainless-steel compositions, produce machine-checkable tensile 
  predictions, and summarize trend plus uncertainty in a report.
human_prompt_seed: 'Study the effect of Ni-content variation on tensile-strength prediction in compositions approximating
  2209/ER2209.

  Please output:
  1) `duplex_ni_tensile_predictions.json`: containing at least `formula`, `ni_content`, `predicted_uts`, and `trend_label`;
  2) `duplex_ni_tensile_analysis.md`: explain the mechanistic interpretation of how changes in Ni content lead to strength
  changes, together with the uncertainty.

  In the final answer, provide the overall trend judgment for "Ni-content change vs. strength change".'
