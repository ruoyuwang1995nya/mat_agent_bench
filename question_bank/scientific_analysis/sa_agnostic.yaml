- id: DF_mech_pressure_003_20260410v3
  capability: scientific_analysis
  domain: agnostic
  intent: Produce structured mechanical-pressure estimation with sensitivity analysis and
    go/no-go recommendation.
  human_prompt_seed: '工作区已提供 `implant_params.json`。


    请先读取该文件，再生成：

    1) `calc_sheet.json`：包含 `load_N`, `contact_area_mm2`, `pressure_MPa`, `formula`；

    2) `estimation_report.md`：包含参数表、公式、计算步骤、不确定性来源、验证建议。

    3) `sensitivity_note.md`：对 `load_N` 和 `contact_area_mm2` 各做 ±10% 扰动，说明压力变化方向与量级。


    说明：

    - 可用关系 `pressure_MPa = load_N / contact_area_mm2`（N/mm^2 = MPa）；

    - 不要使用文件外的虚构参数。

    '
  tags:
  - meta_userlog
  - phy_elastic
  data_files:
  - key: implant_params
    path: data/WO_general_userlog_004_20260410v3/implant_params.json
    oss_url: ''
    description: Minimal parameter set for interface pressure estimation.
  reference_answers:
  - key: calc_sheet_artifact
    value: calc_sheet.json
  - key: estimation_report_artifact
    value: estimation_report.md
  - key: sensitivity_artifact
    value: sensitivity_note.md
  - key: calc_sheet_required_tokens
    value:
      filename: calc_sheet.json
      tokens:
      - load_N
      - contact_area_mm2
      - pressure_MPa
      - formula
      flags: i
  - key: pressure_value_regex
    value:
      filename: calc_sheet.json
      pattern: '"pressure_MPa"\s*:\s*3(?:\.0+)?\b'
      flags: i
  - key: estimation_report_required_tokens
    value:
      filename: estimation_report.md
      tokens:
      - 参数
      - 公式
      - 不确定性
      - 验证建议
      - MPa
      flags: i
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 7000
  scoring_checklist:
  - id: calc_sheet_artifact
    criterion: Agent writes `calc_sheet.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: estimation_report_artifact
    criterion: Agent writes `estimation_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: sensitivity_artifact
    criterion: Agent writes `sensitivity_note.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: calc_sheet_required_tokens
    criterion: Calculation sheet JSON includes required keys.
    axis: correctness
    verify: text_file_contains_all
  - id: pressure_value_regex
    criterion: Calculation sheet reports pressure around 3 MPa from provided parameters.
    axis: correctness
    verify: text_file_regex
  - id: estimation_report_required_tokens
    criterion: Report includes formula, units, uncertainty discussion, and validation suggestions.
    axis: correctness
    verify: text_file_contains_all
  - id: grounding_source
    criterion: The estimate is grounded in `implant_params.json` and avoids fabricated non-provided
      parameters.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: The workflow is delivered in a compact engineering format without unnecessary
      digressions.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget
- id: DF_scxrd_001_20260408
  capability: scientific_analysis
  domain: agnostic
  intent: Determine the crystal structure of an ordered molecular crystal (1-RTP, 293 K) from
    raw single-crystal X-ray diffraction data. Starting from the reduced reflection file (.hkl)
    and the data-collection summary (.p4p), the agent must determine the space group, solve
    the structure, refine it, and generate a validated CIF with no A-level checkCIF alerts.
  human_prompt_seed: '文件 `A23050101A0735.hkl` 和 `A23050101A0735.p4p` 是一个有机-无机杂化硝普盐在 293 K
    下采集的单晶 X 射线衍射数据（已经过数据还原）。请完成以下工作：

    1. 根据 .p4p 文件中的晶胞参数和系统消光规律，确定空间群；

    2. 使用合适的程序解析晶体结构；

    3. 对结构进行全矩阵最小二乘精修，直至收敛；

    4. 生成 CIF 文件，并通过 IUCr checkCIF 验证（不允许有 A 类警告）；

    5. 报告最终精修结果：R1、wR2、GooF 及晶胞参数。

    '
  tags:
  - char_xrd
  - char_cif_validation
  - phy_defect
  data_files:
  - key: hkl_file
    path: data/DF_scxrd_001_20260408/A23050101A0735.hkl
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/DF_scxrd_001_20260408/1775644505_A23050101A0735.hkl
    description: Reduced reflection data file (SHELX .hkl format) for 1-RTP at 293 K.
  - key: p4p_file
    path: data/DF_scxrd_001_20260408/A23050101A0735.p4p
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/DF_scxrd_001_20260408/1775644506_A23050101A0735.p4p
    description: Data-collection summary file (.p4p) with unit cell parameters, wavelength,
      and crystal system information.
  reference_answers:
  - key: r1_factor
    value: 0.0418
    tolerance: 0.008
    unit: dimensionless
  - key: wr2_factor
    value: 0.0981
    tolerance: 0.02
    unit: dimensionless
  - key: goof
    value: 1.048
    tolerance: 0.1
    unit: dimensionless
  - key: space_group_number
    value: 4
    tolerance: 0
    unit: IT_number
  - key: cell_volume
    value: 1001.05
    tolerance: 5.0
    unit: A3
  - key: checkcif_validation
    value:
      filename: '*.cif'
      max_a_alerts: 0
  - key: turn_budget
    value:
      max: 30
  - key: duration_budget
    value:
      max: 14400000
  - key: token_budget_total
    value:
      max: 20000
  scoring_checklist:
  - id: r1_factor
    criterion: Final R1 factor (on F, I>2sigma) is within tolerance of 0.0418 (human baseline).
      A value ≤ 0.05 is acceptable for a well-refined ordered structure.
    axis: correctness
    verify: numerical_range
    weight: 2.0
  - id: wr2_factor
    criterion: Final wR2 factor (on F², all data) is within tolerance of 0.0981 (human baseline).
      A value ≤ 0.12 is acceptable.
    axis: correctness
    verify: numerical_range
    weight: 1.5
  - id: goof
    criterion: Goodness-of-fit (GooF, S) is within tolerance of 1.048. A value between 0.9
      and 1.2 indicates a well-refined structure.
    axis: correctness
    verify: numerical_range
    weight: 1.0
  - id: space_group_number
    criterion: The agent correctly identifies the space group number as 4 (P2₁, monoclinic).
      The answer or CIF must report space group No. 4.
    axis: correctness
    verify: numerical_range
    weight: 1.5
  - id: cell_volume
    criterion: Refined unit cell volume is within tolerance of 1001.05 Å³.
    axis: correctness
    verify: numerical_range
    weight: 1.0
  - id: checkcif_validation
    criterion: The generated CIF passes IUCr checkCIF with zero A-level alerts.
    axis: correctness
    verify: checkcif_no_a_alerts
    weight: 2.0
  - id: cif_generated
    criterion: The agent produces a valid CIF file as output of the refinement.
    axis: correctness
    verify: llm_binary_judge
    weight: 1.0
  - id: turn_budget
    criterion: Task completed within 30 turns.
    axis: efficiency
    verify: turn_budget
    weight: 1.0
  - id: duration_budget
    criterion: Task completed within 4 hours (14400 seconds).
    axis: efficiency
    verify: duration_budget
    weight: 1.0
  - id: token_budget_total
    criterion: Total token usage does not exceed 20000 tokens.
    axis: efficiency
    verify: token_budget
    weight: 1.0
- id: DF_scxrd_002_20260408
  capability: scientific_analysis
  domain: agnostic
  intent: Determine the crystal structure of a disordered molecular crystal (1-HTP, 385 K)
    from raw single-crystal X-ray diffraction data. The high-temperature phase features cation
    orientational disorder, requiring split-atom or constraint-based modeling. Starting from
    the reduced reflection file (.hkl) and the data-collection summary (.p4p), the agent must
    determine the space group, solve the structure, refine it with disorder modeling, and
    generate a validated CIF with no A-level checkCIF alerts.
