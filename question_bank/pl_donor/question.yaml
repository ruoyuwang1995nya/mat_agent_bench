id: pl_donor
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: polymer
difficulty: easy
intent: Pre-screen PM6, PTB7-Th, D18, and P3HT donor polymers for a Y6-like acceptor window using curated oligomer, 
  conformational, and ranking data.
human_prompt_seed: '文件 `donor_prescreen_bundle.json` 提供了 PM6、PTB7-Th、D18 和 P3HT 四类给体聚合物的低聚体建模、量化、构象采样和简化 ranking 结果。

  请完成一个给体预筛选报告：

  1. 比较 HOMO/LUMO、带隙、主链扭转角和平面性；

  2. 结合 1/n 外推结果，判断哪些体系更适合与 Y6 类受体匹配；

  3. 输出最终 shortlist，并分别说明“综合最优”和“高 Voc 候选”；

  4. 写出至少一个不确定性来源。

  '
tags:
- mat_polymer
data_files:
- key: donor_bundle
  path: donor_prescreen_bundle.json
  description: Curated donor-polymer bundle with oligomer-level electronic structure, torsional descriptors, 
    extrapolated gaps, and ranking metrics.
reference_answers:
- key: best_candidate
  value: D18
- key: d18_gap_extrapolated_eV
  value: 1.84
  tolerance: 0.08
- key: pm6_homo_eV
  value: -5.45
  tolerance: 0.1
- key: required_fields
  value:
  - ranking_table
  - gap_extrapolation
  - conformational_note
  - shortlist
  - uncertainty_note
scoring_checklist:
- id: d18_gap_extrapolated_eV
  criterion: D18 extrapolated polymer-limit gap is reported within tolerance of the curated value (~1.84 eV).
  verify: numerical_range
  capability: data_handling
  weight: 0.5
- id: pm6_homo_eV
  criterion: PM6 HOMO is reported within tolerance of the curated oligomer/QM value (~-5.45 eV).
  verify: numerical_range
  capability: data_handling
  weight: 0.5
- id: shortlist_correctness
  criterion: Final shortlist identifies D18 as the best-balanced overall donor and places PM6 ahead of PTB7-Th and P3HT 
    for the specified Y6-like acceptor window.
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: required_fields
  criterion: Report includes a ranking table, band-gap extrapolation discussion, conformational-planarity note, final 
    shortlist, and at least one uncertainty note.
  verify: llm_binary_judge
  capability: tool_utilization
  weight: 0.5
- id: grounding_source
  criterion: Conclusions are explicitly tied to the provided HOMO/LUMO, extrapolated gap, and torsional descriptors from
    donor_prescreen_bundle.json rather than literature recall alone.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
