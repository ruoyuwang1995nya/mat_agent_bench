    pattern: '"Zn\(ClO4\)2"\s*:\s*\{[\s\S]*?"n_formula_units"\s*:\s*\d+[\s\S]*?"n_water"\s*:\s*\d+[\s\S]*?"total_atoms"\s*:\s*(?:19\d\d|20\d\d|2100)'
