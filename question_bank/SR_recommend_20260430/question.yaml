id: SR_recommend_20260430
task_type: search_and_interpretation
capabilities:
- tool_utilization
- scientific_reasoning
domain: agnostic
intent: Recommend soluble acrylate NTD photoresist monomers and provide verified SMILES
  from databases.
human_prompt_seed: 'Recommend acrylate-type monomers suitable for NTD photoresist
  formulations with relatively high solubility.

  For each candidate include: `name`, `SMILES`, `CAS` (if available), `source_database`
  (where the SMILES/CAS was obtained).

  DO NOT FABRICATE any SMILES, CAS, or identifiers. All chemistry identifiers must
  be retrieved from authoritative databases accessible via the system (do not invent
  values or guess SMILES).'
tags:
- meta_database
data_files: []
reference_answers:
