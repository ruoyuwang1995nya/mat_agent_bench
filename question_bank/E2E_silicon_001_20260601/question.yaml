  capability: data_handling
- id: results_equilibrium_volume
  verify: answer_json_numeric
  weight: 0.12
  criterion: '[Suggested] Equilibrium volume is in the physically reasonable range for Si (16-24 A3 for 2-atom cell)'
  capability: scientific_reasoning
- id: results_bulk_modulus
