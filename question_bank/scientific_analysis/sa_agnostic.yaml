  intent: From MSST Hugoniot simulation data, fit the P-V Hugoniot curve and determine C-J
    detonation velocity and pressure for RDX.
  human_prompt_seed: '读取 `msst_hugoniot.json`，其中包含 RDX 在不同冲击波速度下的 MSST 模拟数据 （压力、比容、温度、是否反应）。筛选完全反应的数据点，拟合
