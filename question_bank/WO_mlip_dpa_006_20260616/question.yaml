    expected: 2034
    tolerance: 120
- key: znclo4_atom_count
  value:
    filename: znclo4_1m_box.xyz
    expected: 1954
    tolerance: 120
- key: znso4_composition_regex
  value:
    filename: composition_plan.json
    pattern: '"ZnSO4"\s*:\s*\{[\s\S]*?"n_formula_units"\s*:\s*\d+[\s\S]*?"n_water"\s*:\s*\d+[\s\S]*?"total_atoms"\s*:\s*(?:19\d\d|20\d\d|2100)'
    flags: i
- key: zncl2_composition_regex
  value:
    filename: composition_plan.json
    pattern: '"ZnCl2"\s*:\s*\{[\s\S]*?"n_formula_units"\s*:\s*\d+[\s\S]*?"n_water"\s*:\s*\d+[\s\S]*?"total_atoms"\s*:\s*(?:19\d\d|20\d\d|2100)'
    flags: i
- key: znclo4_composition_regex
