id: IG_abacus_003_20260504
task_type: simulation
capabilities:
- tool_utilization
- workflow_orchestration
domain: agnostic
difficulty: easy
intent: Generate ABACUS PW SCF INPUT and KPT files for Al slab electrostatic-potential calculation setup.
human_prompt_seed: '工作区中提供了一个带真空层的 Al slab 结构（STRU）。


  请为该体系准备 ABACUS 平面波单点输入，用于后续静电势分析：

  1) 生成一份可直接运行的 SCF 输入文件，并确保包含静电势输出所需设置。

  2) 生成与 slab 几何相匹配的 K 点设置：面内采样应足够，法向方向使用单点采样。


  将结果写入当前目录：`INPUT_pot`、`KPT_pot`。

  '
tags:
- eng_abacus
- struct_surface
data_files:
- key: base_al_slab
  path: base_al_slab.stru
  oss_url: ''
  description: Al slab geometry used for electrostatic-potential and work-function setup.
reference_answers:
- key: must_input_core
  value:
    filename: INPUT_pot
    tokens:
    - calculation scf
    - basis_type pw
    - out_pot 2
    flags: i
- key: must_kpt_gamma_marker
  value:
    filename: KPT_pot
    tokens:
    - K_POINTS
    - Gamma
    flags: i
- key: must_kpt_vacuum_axis_one
  value:
    filename: KPT_pot
    pattern: ^\s*\d+\s+\d+\s+1(?:\s+\d+){0,3}\s*$
    flags: m
- key: suggested_input_numerics
  value:
    filename: INPUT_pot
    checks:
    - key: ecutwfc
      min: 35
      max: 75
- key: variable_input_smearing
  value:
    filename: INPUT_pot
    checks:
    - key: smearing_method
      allow_missing_key: true
      allowed_values:
      - gauss
      - gaussian
      - fixed
      - mp
      - mp2
      - methfessel-paxton
      - mv
      - cold
      - marzari-vanderbilt
      - fd
      - fermi-dirac
    - key: smearing_sigma
      allow_missing_key: true
      min: 0.001
      max: 0.1
- key: variable_kpt_inplane_density
  value:
    filename: KPT_pot
    pattern: ^\s*(?:1[2-9]|[2-9]\d|[1-9]\d{2,})\s+(?:1[2-9]|[2-9]\d|[1-9]\d{2,})\s+1(?:\s+\d+){0,3}\s*$
    flags: m
- key: input_pot_artifact
  value: INPUT_pot
- key: kpt_pot_artifact
  value: KPT_pot
- key: grounding_source
  value:
    filename: base_al_slab.stru
scoring_checklist:
- id: must_input_core
  criterion: '[Must] INPUT_pot contains core mandatory controls for this task (`calculation scf`, `basis_type pw`, `out_pot
    2`).'
  verify: text_file_contains_all
  weight: 0.5
  capability: data_handling
- id: must_kpt_gamma_marker
  criterion: '[Must] KPT_pot is a Gamma-centered K-point file.'
  verify: text_file_contains_all
  weight: 0.5
  capability: data_handling
- id: must_kpt_vacuum_axis_one
  criterion: '[Must] KPT_pot sets exactly one k-point along the slab vacuum axis.'
  verify: text_file_regex
  weight: 0.5
  capability: tool_utilization
- id: suggested_input_numerics
  criterion: '[Suggested] INPUT_pot uses the benchmark numeric setup (`ecutwfc 60`).'
  verify: text_file_numeric_range
  weight: 0.5
  capability: scientific_reasoning
- id: variable_input_smearing
  criterion: '[Variable] If INPUT_pot includes smearing parameters, they should be reasonable for this benchmark family; omission
    should not be treated as an error.'
  verify: text_file_numeric_range
  weight: 0.5
  capability: scientific_reasoning
- id: variable_kpt_inplane_density
  criterion: '[Variable] KPT_pot uses sufficiently dense in-plane sampling while keeping vacuum-axis single-point.'
  verify: text_file_regex
  weight: 0.5
  capability: data_handling
- id: input_pot_artifact
  criterion: Generated deliverables count even if the final answer does not quote file contents; `INPUT_pot` must be 
    written to the workspace.
  verify: artifact_exists
  weight: 0.5
  capability: tool_utilization
- id: kpt_pot_artifact
  criterion: Generated deliverables count even if the final answer does not quote file contents; `KPT_pot` must be 
    written to the workspace.
  verify: artifact_exists
  weight: 0.5
  capability: tool_utilization
- id: grounding_source
  criterion: The generated setup is grounded in base_al_slab.stru and does not invent unrelated structural changes; 
    changes are limited to INPUT_pot and KPT_pot preparation.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
