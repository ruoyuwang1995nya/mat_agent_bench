id: BP_struct_005_20260615v3
task_type: simulation
capabilities:
- data_handling
- scientific_reasoning
domain: agnostic
difficulty: easy
intent: Repair 5 problematic POSCAR structures by fixing geometry issues only. Focus the evaluation entirely on POSCAR 
  repair correctness and cause-aligned fixes.
human_prompt_seed: 'Read the failure recovery scenarios for 5 structures (TiO2, ZnO, MgO, Al2O3, SiO2) from `failure_recovery.json`.
  Each entry contains the `input_poscar` path that needs to be repaired. The initial calculation for each structure failed
  due to a geometry-related issue (such as atomic overlap, cell distortion, symmetry errors, etc.).

  Please generate a corrected POSCAR for each structure using the following repair strategy:

  1. Only repair geometry-related issues in the structure file (POSCAR), including atomic positions, lattice parameters,
  and symmetry

  3. For each structure, explain what geometry issue was fixed and why the repaired structure is more reasonable, following
  the `repair_acceptance` constraints for each entry in `failure_recovery.json`

  Output requirements:

  1. 5 corrected POSCAR files

  2. The corrected POSCAR filenames must be exactly: - `calc_001_TiO2_fixed.POSCAR` - `calc_002_ZnO_fixed.POSCAR` - `calc_003_MgO_fixed.POSCAR`
  - `calc_004_Al2O3_fixed.POSCAR` - `calc_005_SiO2_fixed.POSCAR`

  There is no need to submit calculations; only generate the correct repaired structures.

  Key evaluation points: 1. Whether the POSCAR structures are repaired correctly 2. Whether the repair content matches
  the failure cause

  '
tags:
- eng_vasp
priority: P0
