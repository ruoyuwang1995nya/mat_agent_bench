id: WO_mlip_dpa_006_20260616
task_type: simulation
capabilities:
- structure_manipulation
domain: agnostic
difficulty: easy
intent: Build and export three 1 mol/L Zn-salt aqueous model boxes near 2000 atoms with valid integer compositions and 
  concrete structure artifacts.
human_prompt_seed: "The workspace already provides `electrolyte_system_spec.json`.\n\nPlease complete an \"electrolyte modeling\" task for three aqueous zinc-salt solutions: ZnSO4, ZnCl2, and Zn(ClO4)2.\n1) Generate `composition_plan.json`, giving the integer compositions for the three systems (number of salt formula units, number of water molecules, total atom count), with concentration close to 1 mol/L and total atom count between 1900 and 2100.\n2) You must actually build the three initial solution boxes and write the structure files to the workspace:\n   - `znso4_1m_box.xyz`\n   - `zncl2_1m_box.xyz`\n   - `znclo4_1m_box.xyz`\n\
  3) Generate `build_workflow.md`, explaining the steps from preparing initial ion/water structures, constructing the solution box, checking charge neutrality, performing the initial relaxation, and preparing the inputs.\n\nAdditional requirements:\n- The focus of this task is modeling; there is no need to submit MD trajectories, energy logs, RDF, or MSD analysis results.\n\
  - In `composition_plan.json`, `n_formula_units`, `n_water`, and `total_atoms` must be JSON integer fields, not strings, comma-separated values, or scientific notation.\n"
tags:
- code_mlip
- chem_electrolyte
- phy_md
data_files:
- key: electrolyte_spec
  path: electrolyte_system_spec.json
  oss_url: ''
  description: Integer-composition hints and constraints for three 1 mol/L Zn-salt aqueous systems near 2000 atoms.
reference_answers:
- key: composition_artifact
  value: composition_plan.json
- key: workflow_artifact
  value: build_workflow.md
- key: znso4_model_artifact
  value: znso4_1m_box.xyz
- key: zncl2_model_artifact
