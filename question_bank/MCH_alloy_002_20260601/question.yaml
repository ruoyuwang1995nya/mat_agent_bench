domain: alloy
difficulty: medium
intent: Calculate the elastic stiffness tensor for hexagonal MgZn2, compute the universal elastic anisotropy index AU 
  and the three shear anisotropy factors A1, A2, A3, and classify the phase as isotropic or anisotropic.
human_prompt_seed: 'Calculate the elastic stiffness tensor Cij for hexagonal H-MgZn2 using VASP PBE, compute the Voigt and
  Reuss bounds for bulk modulus (BV, BR) and shear modulus (GV, GR), then calculate the universal elastic anisotropy index
  AU = 5*GV/GR + BV/BR - 6, and the three shear anisotropy factors A1, A2, A3 using the standard formulas for hexagonal crystals.
  Write Cij tensor values to cij_h_mgzn2.json. Write results to anisotropy_analysis.json with keys: AU, A1, A2, A3, AB, AG, and a classification field indicating whether
  the phase is isotropic (AU≈0) or anisotropic (AU>0).'
tags:
- elastic_constants
- DFT
- mechanical_properties
data_files: 
