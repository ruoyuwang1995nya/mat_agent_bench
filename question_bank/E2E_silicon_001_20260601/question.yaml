  verify: answer_json_numeric
  weight: 0.08
  criterion: '[Must] At least 5 volume points were used for EOS fitting'
  capability: workflow_orchestration
- id: methodology_exists
  verify: artifact_exists
  weight: 0.05
  criterion: '[Must] methodology.txt exists and describes the full workflow'
  capability: data_handling
- id: eos_data_exists
  verify: artifact_exists
  weight: 0.05
  criterion: '[Must] eos_data.csv exists with volume_A3, energy_eV, and scaling_pct columns'
  capability: data_handling
- id: workflow_orchestration_check
  verify: llm_binary_judge
  weight: 0.12
  criterion: '[Must] Agent demonstrates correct multi-stage workflow sequencing: structure generation, relaxation, energy
    extraction, EOS fitting'
  capability: workflow_orchestration
reference_answer_prompt: '1. Start from mp-149 Si structure (diamond cubic, 2 atoms/cell, ~20 A3 cell volume). 2. Generate
  5 volume-scaled structures at -5%, -2.5%, 0%, +2.5%, +5% by scaling lattice vectors by f^(1/3). 3. For each structure, run
  VASP relaxation with ISIF=2 (positions only), PBE functional, precise protocol (ENCUT>=520, EDIFF=1E-8, EDIFFG=-0.001).
  4. Extract total energy from each relaxed OUTCAR (free energy TOTEN). 5. Fit Birch-Murnaghan EOS: E(V) = E0 + (9V0B0/16)*{[(V0/V)^(2/3)-1]^3*B0''
  + [(V0/V)^(2/3)-1]^2*[6-4(V0/V)^(2/3)]}. 6. Extract V0 (equilibrium volume), B0 (bulk modulus in GPa), E0 (minimum energy).
  Expected: V0 ~20 A3 for 2-atom cell (~10 A3/atom), B0 ~98 GPa, E0 ~-10.8 eV/atom. 7. Write results.json, methodology.txt,
  eos_data.csv.'
