  criterion: Agent writes `cu_fcc.cif` to workspace.
  axis: correctness
  verify: artifact_exists
- id: formula
  criterion: Structure formula is Cu.
  axis: correctness
  verify: struct_file_formula
- id: cell_a
  criterion: Lattice constant a is approximately 3.615 Å.
  axis: correctness
  verify: struct_file_cell_param
- id: atom_count
  criterion: Conventional FCC cell contains 4 atoms.
  axis: correctness
  verify: struct_file_atom_count
- id: space_group_number
  criterion: The file `cu_fcc.cif` is identified as space group
  axis: correctness
  verify: struct_file_space_group
- id: space_group_tokens
  criterion: Final answer explicitly reports both space group number 225 and symbol
