id: WO_gpumdnep_001_20260616v2
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: agnostic
difficulty: easy
intent: Build MoSe2 training dataset, generate ABACUS static input, and prepare NEP input.
human_prompt_seed: Build a training dataset for MoSe2 covering prototypes, strain, perturbations, vacancies, and related
  cases, and name the unified training set `train.xyz` (total number of frames > 100). Based on this training set, generate
  the ABACUS static-calculation input file `INPUT_scf`. Also generate `nep.in` for training this system.
tags:
- eng_gpumd
- eng_abacus
- struct_transform
data_files: []
reference_answers:
- key: train_xyz_artifact
  value: train.xyz
- key: abacus_input_artifact
  value: INPUT_scf
- key: nep_artifact
  value: nep.in
- key: abacus_static_tokens
  value:
    filename: INPUT_scf
    tokens:
    - calculation scf
    - basis_type
    flags: i
- key: nep_type_mose
  value:
    filename: nep.in
    pattern: ^\s*type\s+\d+\s+.*\bMo\b.*\bSe\b.*$
    flags: im
- key: nep_core_tokens
  value:
    filename: nep.in
    tokens:
    - cutoff
    - n_max
    - basis_size
    - neuron
    - batch
    - generation
    flags: i
