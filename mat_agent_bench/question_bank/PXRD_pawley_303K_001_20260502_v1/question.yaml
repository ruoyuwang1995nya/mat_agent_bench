  value:
    json_path: a
    target: 10.828
    tolerance: 0.04
  unit: A
- key: cell_b
  value:
    json_path: b
    target: 9.57
    tolerance: 0.08
  unit: A
- key: cell_c
  value:
    json_path: c
    target: 10.14
    tolerance: 0.06
  unit: A
- key: cell_beta
  value:
    json_path: beta
    target: 108.1
    tolerance: 1.2
  unit: deg
- key: cell_V
  value:
    json_path: V
    target: 997.0
    tolerance: 12.0
  unit: A3
- key: wR_factor
  value:
    json_path: wR
    target: 16.0
    tolerance: 4.0
  unit: percent
- key: grounding_source
  value:
    filename: pxrd_303K.xy
- key: turn_budget
  value:
    max: 60
- key: duration_budget
  value:
    max: 3600000
- key: token_budget_total
  value:
    max: 50000
