scoring_checklist:
- id: v0_A3
  criterion: V0 is within tolerance.
  axis: correctness
  verify: numerical_range
- id: b0_GPa
  criterion: B0 is within tolerance.
  axis: correctness
  verify: numerical_range
- id: required_fields
  criterion: Reports V0, B0, and some measure of fit quality (R-squared, residuals,
    or similar).
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: EOS fitting uses the data from ev_curve.json; fit parameters are derived
    from the provided E-V points, not hallucinated. Judge solely from the final answer;
