human_prompt_seed: 'Please build the crystal structure according to the given space group and Wyckoff-position information, and export `srtio3_wyckoff.cif`:

  - Space group: Pm-3m (No. 221) - Lattice constants: a=b=c=3.90 Å, alpha=beta=gamma=90° - Sites: - Sr: 1b (0.5, 0.5, 0.5) - Ti: 1a (0.0, 0.0, 0.0) - O: 3d (0.5, 0.0, 0.0)

  Also generate `wyckoff_build_report.md`, explaining how the above sites are mapped into structure-construction parameters, and giving the main self-check points for the result (chemical formula and lattice parameters).

  In the final answer, briefly state the structure type (for example, cubic perovskite) and potential sources of error.'
