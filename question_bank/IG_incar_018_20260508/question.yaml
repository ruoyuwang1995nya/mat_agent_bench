id: IG_incar_018_20260508
task_type: simulation
capabilities:
- tool_utilization
- workflow_orchestration
domain: agnostic
difficulty: easy
intent: 'Generate VASP INCAR for magnetic SCF calculation of double perovskite Ca4TaOs. 5d transition metals (Ta, Os); spin-polarized
  with MAGMOM.

  '
human_prompt_seed: 为双钙钛矿 Ca4TaOs 生成一个磁性自洽(SCF)计算的 VASP INCAR。体系含 5d 过渡金属(Ta, Os)，需要自旋极化和适当的初始磁矩。将完整的 INCAR 写入当前目录下的 
  `INCAR` 文件。
tags:
- eng_vasp
reference_answers:
- key: incar_artifact
  value: INCAR
- key: incar_critical_tokens
  value:
    filename: INCAR
    tokens:
    - ISPIN
    - LORBIT
    - MAGMOM
    flags: i
- key: optional_IBRION
  value:
    filename: INCAR
    pattern: (?ims)\A(?!.*^\s*IBRION\s*=)(?:.|\n)*\Z|^\s*IBRION\s*=\s*\-1\b
    flags: im
- key: critical_ISPIN
  value:
    filename: INCAR
    pattern: ^\s*ISPIN\s*=\s*2\b
    flags: im
- key: critical_LORBIT
  value:
    filename: INCAR
    pattern: ^\s*LORBIT\s*=\s*11\b
    flags: im
- key: critical_MAGMOM
  value:
    filename: INCAR
    pattern: ^\s*MAGMOM\s*=\s*\S+
    flags: im
- key: optional_NSW
  value:
    filename: INCAR
    pattern: (?ims)\A(?!.*^\s*NSW\s*=)(?:.|\n)*\Z|^\s*NSW\s*=\s*0\b
    flags: im
- key: reasonable_params
  value:
    filename: INCAR
