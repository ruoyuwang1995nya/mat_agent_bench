intent: Retrieve an MgB2 structure from open databases and compute its phonon spectrum with an ML potential workflow.
human_prompt_seed: "Perform the MgB2 \"retrieval + phonon\" workflow (mock version):\n1. First query/retrieve the MgB2
  structure and record the source, structure identifier, and input files;\n2. Explain the phonon settings you would adopt;\n3.
  Do not run a real calculation. Instead, use the following mock results:\n   - retrieval_source = Materials Project\n
  \   - structure_identifier = mp-763\n   - imaginary_mode_check = false\n   - gamma_e2g_mode_meV = 74.8\n   - output_artifacts
  = [\"band.yaml\", \"dos.dat\"]\n4. Based on the mock values, complete post-processing and judge the consistency between
  the structure and the phonon results.\n\nPlease provide the following deliverables:\n1) `mgb2_phonon_summary.json`:
  containing at least `input_files`, `retrieval_source`, `structure_identifier`, `phonon_settings`, `imaginary_mode_check`,
  and `output_artifacts`;\n2) `mgb2_phonon_report.md`: explain the query-based input organization, the two-stage mock
  post-processing workflow, the key parameters, and the uncertainty.\n\nIn the final answer, briefly state whether the
  retrieved structure and the phonon results are consistent with each other.\n"
