id: WO_mlip_dpa_009_20260415
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: agnostic
intent: Retrieve an MgB2 structure from open databases and compute its phonon spectrum
  with an ML potential workflow.
human_prompt_seed: "执行 MgB2 “检索 + 声子”流程（Mock版）：\n1. 先 query/检索 MgB2 结构并记录来源、结构标识与输入文件；\n\
  2. 说明拟采用的声子设置；\n3. 不做真实计算，使用以下 mock 结果：\n   - retrieval_source = Materials Project\n\
  \   - structure_identifier = mp-763\n   - imaginary_mode_check = false\n   - gamma_e2g_mode_meV\
  \ = 74.8\n   - output_artifacts = [\"band.yaml\", \"dos.dat\"]\n4. 基于 mock 值完成后处理并判断“结构与声子结果一致性”。\n\
  \n请完成以下交付：\n1) `mgb2_phonon_summary.json`：至少包含 `input_files`, `retrieval_source`,\
  \ `structure_identifier`, `phonon_settings`, `imaginary_mode_check`, `output_artifacts`；\n\
  2) `mgb2_phonon_report.md`：说明 query 输入梳理、mock 后处理的两阶段流程、关键参数与不确定性。\n\n最终回答中请简要说明：检索到的结构与声子结果是否相互一致。\n"
tags:
- code_mlip
data_files: []
reference_answers:
- key: phonon_json
  value: mgb2_phonon_summary.json
- key: phonon_report
  value: mgb2_phonon_report.md
- key: json_required_tokens
  value:
    filename: mgb2_phonon_summary.json
    must_cover:
    - retrieval_source
    - structure_identifier
    - phonon_settings
    - imaginary_mode_check
    - output_artifacts
    - MgB2
- key: report_required_tokens
  value:
    filename: mgb2_phonon_report.md
    must_cover:
    - 检索
    - MgB2
    - 声子
    - 参数
    - 不确定性
- key: gamma_e2g_mock
  value: 74.8
  tolerance: 10.0
- key: turn_budget
  value:
    max: 18
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 10000
scoring_checklist:
- id: phonon_json
  criterion: Agent writes `mgb2_phonon_summary.json` to workspace.
  axis: correctness
  verify: artifact_exists
- id: phonon_report
  criterion: Agent writes `mgb2_phonon_report.md` to workspace.
  axis: correctness
  verify: artifact_exists
- id: json_required_tokens
  criterion: JSON includes retrieval metadata and phonon-result summary fields.
  axis: correctness
  verify: llm_binary_judge
- id: report_required_tokens
  criterion: Report explains two-stage workflow and uncertainty caveats.
  axis: correctness
  verify: llm_binary_judge
- id: gamma_e2g_mock
  criterion: Final answer includes a mock Gamma E2g mode near 74.8 meV.
  axis: correctness
  verify: numerical_range
- id: grounding_source
  criterion: Final answer is grounded in both retrieval and phonon artifacts and does
    not fabricate unsupported structure/spectrum details.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: No repeated identical calls with the same parameters.
  axis: efficiency
  verify: no_retries
- id: efficiency_judge
  criterion: Workflow proceeds compactly from retrieval to phonon computation and
    summary.
  axis: efficiency
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
