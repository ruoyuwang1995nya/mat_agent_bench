id: SC_elec_004_20260404
capability: structure_construction
domain: catalysis
intent: Build Ag(001) surface slab and place CO molecule at ontop site for adsorption
  calculation.
human_prompt_seed: '构建CO在Ag(001)表面的吸附结构：

  1. 获取Ag FCC体相结构（空间群Fm-3m，a=4.086 Å）；

  2. 切出(001)表面slab：4个原子层（即沿z方向4个不等价原子平面，3×3扩胞共36个Ag原子），真空层15 Å；

  3. 在slab顶层ontop位点放置CO分子（C端朝下，初始距离~2.0 Å）；

  4. 输出三个结构文件：bare_slab.vasp, CO_molecule.vasp, adsorbed_system.vasp。

  '
