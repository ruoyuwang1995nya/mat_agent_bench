human_prompt_seed: 'Please generate a CP2K DFT single-point energy input file for rock-salt MgO (a=4.212 Å) with the
  following requirements:

  1. Use the PBE functional and a DZVP basis set

  2. Plane-wave cutoff energy of 400 Ry

  3. SCF convergence threshold of 1.0E-6

  4. Use Goedecker pseudopotentials (GTH-PBE)

  The output filename must be `cp2k.inp`.'
