id: SC_struct_008_20260507
task_type: simulation
capabilities:
- structure_manipulation
domain: agnostic
intent: Construct a computation-ready gamma-alumina bulk model and validate stoichiometry, geometry, coordination 
  environments, and post-relaxation force.
human_prompt_seed: 'Construct a computation-ready γ-Al2O3 bulk model. Export as `gamma_alumina.cif`. In the final answer,
  explicitly report: (1) whether `gamma_alumina.cif` exists; (2) the Al:O ratio, which should be approximately 2:3 (±5%);
  (3) the three cell angles, each close to 90 degrees (±2 degrees); (4) whether both tetrahedral and octahedral [AlO] environments
  exist; (5) whether all interatomic distances are greater than 1.0 A; (6) the relaxed maximum force, which should be below
  0.1 eV/A. Also include a machine-readable block `<eval_results>{"max_force_ev_per_ang": <number>}</eval_results>` in the
  final answer.

  '
tags:
- struct_build
data_files: []
reference_answers:
- key: file_exists
  value: gamma_alumina.cif
- key: al_o_ratio
  value:
    filename: gamma_alumina.cif
    element_a: Al
    element_b: O
    expected_ratio: 0.6667
    tolerance: 0.0334
- key: alpha_deg
  value:
    filename: gamma_alumina.cif
    param: alpha
    expected: 90.0
    tolerance: 2.0
- key: beta_deg
  value:
    filename: gamma_alumina.cif
    param: beta
    expected: 90.0
    tolerance: 2.0
- key: gamma_deg
  value:
    filename: gamma_alumina.cif
    param: gamma
    expected: 90.0
    tolerance: 2.0
- key: max_force_eV_A
  value:
    json_path: max_force_ev_per_ang
    target: 0.05
    tolerance: 0.05
- key: min_distance_A
  value:
    filename: gamma_alumina.cif
    min_distance_A: 1.0
- key: required_fields
  value:
  - file_exists
  - al_o_ratio
  - cell_angles
  - tetrahedral_alo
  - octahedral_alo
  - min_distance_check
  - max_force
scoring_checklist:
- id: file_exists
  criterion: The output file `gamma_alumina.cif` exists.
  axis: correctness
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: al_o_ratio
  criterion: The Al:O stoichiometry ratio read from gamma_alumina.cif is approximately 2:3 within 5%.
  axis: correctness
  verify: struct_file_stoichiometry_ratio
  capability: structure_manipulation
  weight: 0.5
- id: alpha_deg
  criterion: The alpha cell angle read from gamma_alumina.cif is close to 90 degrees.
  axis: correctness
  verify: struct_file_cell_param
  capability: structure_manipulation
  weight: 0.5
- id: beta_deg
  criterion: The beta cell angle read from gamma_alumina.cif is close to 90 degrees.
  axis: correctness
  verify: struct_file_cell_param
  capability: structure_manipulation
  weight: 0.5
- id: gamma_deg
  criterion: The gamma cell angle read from gamma_alumina.cif is close to 90 degrees.
  axis: correctness
  verify: struct_file_cell_param
  capability: structure_manipulation
  weight: 0.5
- id: max_force_eV_A
  criterion: The reported relaxed maximum force in `<eval_results>` is below 0.1 eV/A.
  axis: correctness
  verify: answer_json_numeric
  capability: tool_utilization
  weight: 0.5
- id: min_distance_A
  criterion: The minimum interatomic distance read from `gamma_alumina.cif` is at least 1.0 A.
  axis: correctness
  verify: struct_file_min_interatomic_distance
  capability: structure_manipulation
  weight: 0.5
- id: required_fields
  criterion: The answer explicitly reports the Al:O ratio, all three cell angles, evidence for both tetrahedral and 
    octahedral AlO environments, a minimum-distance sanity check above 1.0 A, and a relaxed maximum-force check below 
    0.1 eV/A.
  axis: correctness
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: structure_knowledge
  criterion: Agent demonstrates understanding that γ-Al2O3 adopts a defect-spinel structure with aluminum occupying both
    tetrahedral and octahedral coordination sites, reflected in the construction approach, final answer, or tool 
    parameters. This criterion can pass even if the final output file was not successfully delivered, as long as the 
    understanding is evident.
  axis: correctness
  verify: llm_binary_judge
  weight: 0.5
  capability: structure_manipulation
- id: relaxation_attempted
  criterion: Agent initiates structure relaxation or geometry optimization on the constructed γ-Al2O3 bulk model using 
    any available calculator (MLIP, DP, or force-field), even if the relaxation does not converge or the final file is 
    not delivered. Evidence may come from tool calls, scripts, or narrative.
  axis: correctness
  verify: llm_binary_judge
  weight: 0.5
  capability: tool_utilization
- id: grounding_source
  criterion: The answer links Al:O stoichiometry, cell angles, tetrahedral vs octahedral Al sites, minimum contact 
    distances, and post-relax forces to `gamma_alumina.cif` and the stated relaxation, not handbook recall disconnected 
    from that file. Judge solely from the final answer and named deliverables; do not fail because the tool-call log 
    omits MCP, web_search, or any specific tool.
  axis: grounding
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
