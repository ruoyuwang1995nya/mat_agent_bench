human_prompt_seed: 'Evaluate the room-temperature elastic properties of a Ni-Co-Cr alloy. First retrieve structural/elastic
  information for similar compositions, then provide the APEX calculation results and compare them.

  Please provide the following deliverables:
  1) `nico_cr_elastic_compare.json`: containing at least `C11`, `C12`, `C44`, `bulk_modulus_GPa`, `db_reference_summary`,
  and `comparison_note`;
  2) `nico_cr_elastic_report.md`: explain the database reference source, the APEX calculation settings, the result differences,
  and the uncertainty.

  In the final answer, briefly provide C11/C12/C44/B and the judgment of consistency with the reference data.'
