id: DF_scxrd_002_20260408
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: agnostic
intent: Determine the crystal structure of a disordered molecular crystal (1-HTP,
  385 K) from raw single-crystal X-ray diffraction data. The high-temperature phase
  features cation orientational disorder, requiring split-atom or constraint-based
  modeling. Starting from the reduced reflection file (.hkl) and the data-collection
  summary (.p4p), the agent must determine the space group, solve the structure, refine
  it with disorder modeling, and generate a validated CIF with no A-level checkCIF
  alerts.
human_prompt_seed: '文件 `A23050102A0375.hkl` 和 `A23050102A0375.p4p` 是一个有机-无机杂化硝普盐在
  385 K 下采集的单晶 X 射线衍射数据（已经过数据还原）。该高温相中阳离子存在取向无序。请完成以下工作：

  1. 根据 .p4p 文件中的晶胞参数和系统消光规律，确定空间群；

  2. 使用合适的程序解析晶体结构；

  3. 对结构进行精修，需对无序部分进行合理建模（如分裂原子模型或约束/限制）；

  4. 生成 CIF 文件，并通过 IUCr checkCIF 验证（不允许有 A 类警告）；

  5. 报告最终精修结果：R1、wR2、GooF 及晶胞参数。

  '
tags:
- char_diffraction
data_files:
- key: hkl_file
  path: A23050102A0375.hkl
