version: v5
capability: batch_processing
domain: semiconductor
questions:
- id: BP_struct_004_20260406
  capability: batch_processing
  domain: semiconductor
  intent: Perform batch post-processing of band structures for 3 materials (Si, Ge, GaAs)
    with unified analysis parameters. Extract band gaps and band edge positions using identical
    k-paths, energy windows, and plot specifications across all materials.
  human_prompt_seed: '从 `postprocessing_bandstr.json` 读取 3 种材料（Si, Ge, GaAs）的带结构后处理配置。

    对每种材料执行相同的分析流程： 1. k-path 固定为 M-Gamma-K，每段 50 个 k 点 2. 能量窗口统一为 [-5, 5] eV 3. 费米面参考点：VBM（价带最大值）
    4. 所有绘图使用相同样式和范围

    输出要求： 1. 3 个带结构 PNG 图 2. 3 个数据表（CSV 格式） 3. 带隙值和边界位置汇总表

    关键考察点： 1. 分析参数（k-path, 能量窗口）在所有材料中完全一致 2. 虽然材料的绝对带隙不同，但分析流程相同 3. 输出文件和数据格式统一

    '
  tags:
  - wf_batch
  - wf_postprocess
  - phy_electronic
  data_files:
  - key: postprocessing_bandstr
    path: data/BP_struct_004/postprocessing_bandstr.json
    oss_url: ''
    description: Batch band structure analysis configuration with unified parameters.
  reference_answers:
  - key: analysis_count_correct
    value: 3
    tolerance: 0.0
  - key: kpath_unified
    value: M-Gamma-K
  - key: energy_window_unified
    value:
    - -5
    - 5
  - key: fermi_reference_unified
    value: VBM
  - key: output_format_consistent
    value: PNG + CSV for each material
  - key: bandgap_extracted
    value:
      si:
      - 1.02
      - 1.22
      ge:
      - 0.57
      - 0.77
      gaas:
      - 1.32
      - 1.52
  - key: grounding_analysis_correct
    value: Configuration from postprocessing_bandstr.json
  - key: analysis_workflow_streamlined
    value: Unified workflow for all 3 materials
  - key: turn_budget
    value: &id001
      max: 20
  - key: duration_budget
    value: &id002
      max: 7200000
  - key: token_budget_total
    value: &id003
      max: 35000
  scoring_checklist:
  - id: analysis_count_correct
    criterion: Exactly 3 materials are analyzed (Si, Ge, GaAs).
    axis: correctness
    verify: llm_binary_judge
  - id: kpath_unified
    criterion: All 3 analyses use the same k-path (M-Gamma-K) with 50 points per segment.
    axis: correctness
    verify: llm_binary_judge
  - id: energy_window_unified
    criterion: All 3 analyses use energy window [-5, 5] eV as the plotting range.
    axis: correctness
    verify: llm_binary_judge
  - id: fermi_reference_unified
    criterion: All 3 analyses use VBM (valence band maximum) as the Fermi level reference
      point.
    axis: correctness
    verify: llm_binary_judge
  - id: output_format_consistent
    criterion: All 3 analyses produce both PNG plot and CSV data table in consistent format.
    axis: correctness
    verify: llm_binary_judge
  - id: bandgap_extracted
    criterion: 'Band gap values extracted for all 3 materials and fall within expected range
      (Si: 1.0–1.2 eV, Ge: 0.6–0.8 eV, GaAs: 1.3–1.5 eV).'
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_analysis_correct
    criterion: Analysis methodology (k-path, window, reference) matches the provided configuration
      exactly.
    axis: grounding
    verify: llm_binary_judge
  - id: analysis_workflow_streamlined
    criterion: All 3 materials analyzed using a single unified script or workflow template
      (no per-material ad-hoc tweaks).
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling
      (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
