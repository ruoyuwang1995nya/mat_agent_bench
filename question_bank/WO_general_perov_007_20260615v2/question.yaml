id: WO_general_perov_007_20260615v2
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: semiconductor
difficulty: easy
intent: Query high-efficiency perovskite additives and produce recommendation plus a proposal draft based on predicted 
  performance.
human_prompt_seed: 'Please prepare a recommendation and proposal centered on "high-efficiency (>26%) perovskite additive
  design".

  Please output:
  1) `perovskite_additive_candidates.json`: containing at least `smiles`, `predicted_effect`, `selection_reason`, and
  `similar_formulation_hint`;
  2) `perovskite_additive_proposal.md`: based on the best candidate, provide the research objectives, validation plan,
  expected results, and risks.

  In the final answer, briefly explain why this candidate is the most worthwhile to validate first.'
tags: []
priority: P0
data_files: []
reference_answers:
- key: additive_json
  value: perovskite_additive_candidates.json
- key: proposal_md
