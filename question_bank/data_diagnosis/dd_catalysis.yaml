version: v5
capability: data_diagnosis
domain: catalysis
questions:
- id: DD_general_001_20260404
  capability: data_diagnosis
  domain: catalysis
  intent: Diagnose SCF non-convergence caused by missing spin polarization on a magnetic oxide.
  human_prompt_seed: '读取 `case_bundle.json`，其中包含一个 Fe2O3 计算的 INCAR 参数、POSCAR 摘要和 OUTCAR 能量迭代摘录。
    SCF 迭代 60 步仍未收敛，能量振幅约 0.25 eV。请诊断根本原因，并给出修复方案。

    '
  tags:
  - log_diagnosis
  - phy_electronic
  data_files:
  - key: case_bundle
    path: data/DD_general_001/case_bundle.json
    oss_url: ''
    description: 'VASP input/output bundle: Fe2O3 with ISPIN=1, SCF oscillates.'
  reference_answers:
  - key: root_cause
    value: spin_not_enabled
  - key: required_fields
    value:
    - root_cause
    - evidence
    - fix_ISPIN
    - fix_MAGMOM
  - key: turn_budget
    value: &id001
      max: 8
  - key: duration_budget
    value: &id002
      max: 7200000
  - key: token_budget_total
    value: &id003
      max: 8000
  scoring_checklist:
  - id: root_cause
    criterion: Correctly identifies missing spin polarization (ISPIN=1 on magnetic Fe2O3)
      as root cause.
    axis: correctness
    verify: llm_binary_judge
  - id: required_fields
    criterion: Provides root cause, evidence from SCF energy oscillation, and concrete INCAR
      fixes (ISPIN=2 and MAGMOM).
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_evidence
    criterion: Diagnosis is grounded in the provided case_bundle.json data (INCAR parameters,
      OUTCAR energy profile), not generic DFT advice.
    axis: grounding
    verify: llm_binary_judge
  - id: efficiency_judge
    criterion: Agent reads the provided bundle and diagnoses directly without excessive exploratory
      tool calls.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling
      (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
