id: WO_mlip_dpa_008_20260415
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: agnostic
intent: Run a short DPA molecular-dynamics simulation for Li2O at 300 K and summarize
  thermostat/time-step settings with trajectory statistics.
human_prompt_seed: "执行 Li2O 短程 MD 流程评估（Mock版）：\n1. 先 query/检索并整理 MD 所需输入文件（结构、势函数、积分与控温参数）；\n\
  2. 目标条件：300 K、1 ps、1 fs、NVT；\n3. 不做真实 MD，使用以下 mock 结果：\n   - ensemble = NVT\n  \
  \ - temperature_K = 300\n   - runtime_ps = 1.0\n   - timestep_fs = 1.0\n   - n_steps\
  \ = 1000\n   - thermo_stats = {\"T_avg\": 301.2, \"T_std\": 7.8, \"drift\": \"small\"\
  }\n4. 基于 mock 值做后处理并判断是否满足目标条件。\n\n请完成以下交付：\n1) `li2o_md_summary.json`：至少包含 `input_files`,\
  \ `ensemble`, `temperature_K`, `runtime_ps`, `timestep_fs`, `n_steps`, `thermo_stats`；\n\
  2) `li2o_md_report.md`：说明 query 输入梳理、mock 后处理流程、关键观察与误差来源。\n\n最终回答中简要确认是否满足 300\
  \ K / 1 ps / 1 fs 三个条件。\n"
tags:
- code_mlip
data_files: []
reference_answers:
- key: md_summary_artifact
  value: li2o_md_summary.json
- key: md_report_artifact
  value: li2o_md_report.md
- key: summary_required_tokens
  value:
    filename: li2o_md_summary.json
    must_cover:
    - ensemble
    - temperature_K
    - runtime_ps
    - timestep_fs
    - n_steps
    - thermo_stats
    - '300'
    - '1'
- key: report_required_tokens
  value:
    filename: li2o_md_report.md
    must_cover:
    - NVT
    - 300
    - 1 ps
    - 1 fs
    - 温度
    - 不确定性
- key: temperature_avg_mock
  value: 301.2
  tolerance: 15.0
- key: turn_budget
  value:
    max: 16
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 9000
scoring_checklist:
- id: md_summary_artifact
  criterion: Agent writes `li2o_md_summary.json` to workspace.
  axis: correctness
  verify: artifact_exists
- id: md_report_artifact
  criterion: Agent writes `li2o_md_report.md` to workspace.
  axis: correctness
  verify: artifact_exists
- id: summary_required_tokens
  criterion: MD summary JSON includes required simulation-parameter fields and basic
    runtime statistics.
  axis: correctness
  verify: llm_binary_judge
- id: report_required_tokens
  criterion: Report describes MD setup, observed behavior, and uncertainty caveats.
  axis: correctness
  verify: llm_binary_judge
- id: temperature_avg_mock
  criterion: Final answer includes a mock average temperature near 301.2 K.
  axis: correctness
  verify: numerical_range
- id: grounding_source
  criterion: The final answer is grounded in MD output artifacts and does not invent
    trajectory statistics not present in generated results.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: No repeated identical MD submissions with the same parameters.
  axis: efficiency
  verify: no_retries
- id: efficiency_judge
  criterion: Workflow proceeds directly from MD setup to execution and summary without
    redundant exploratory loops.
  axis: efficiency
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
