id: DF_scxrd_002_20260615v2
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: agnostic
difficulty: easy
intent: Determine the crystal structure of a disordered molecular crystal (1-HTP, 385 K) from raw single-crystal X-ray 
  diffraction data. The high-temperature phase features cation orientational disorder, requiring split-atom or 
  constraint-based modeling. Starting from the reduced reflection file (.hkl) and the data-collection summary (.p4p), 
  the agent must determine the space group, solve the structure, refine it with disorder modeling, and generate a 
  validated CIF with no A-level checkCIF alerts.
human_prompt_seed: 'The files `A23050102A0375.hkl` and `A23050102A0375.p4p` are single-crystal X-ray diffraction data
  collected at 385 K for an organic-inorganic hybrid nitroprusside salt (already reduced). In this high-temperature phase,
  the cation has orientational disorder. Please complete the following tasks:

  1. Determine the space group based on the unit-cell parameters and systematic absences in the `.p4p` file;

  2. Solve the crystal structure using an appropriate program;

  3. Refine the structure, with appropriate modeling of the disordered part (such as a split-atom model or suitable constraints/restraints);

  4. Generate a CIF file and validate it with IUCr checkCIF (A-level alerts are not allowed);

  5. Report the final refinement results: R1, wR2, GooF, and the unit-cell parameters.

  '
tags:
- char_diffraction
