id: PXRD_pawley_303K_001_20260616
task_type: material_characterization
capabilities:
- scientific_reasoning
- scientific_grounding
domain: agnostic
difficulty: easy
intent: Perform Pawley refinement on a single PXRD pattern at 303 K to extract all lattice parameters (a, b, c, beta, V)
  and report the weighted profile R-factor (wR).
human_prompt_seed: 'The file `pxrd_303K.xy` is a powder X-ray diffraction (PXRD) dataset collected at 303 K (30 °C) for an organic-inorganic hybrid nitroprusside salt (Cu Kα1, λ = 1.5406 Å, 2θ range 5°–50°, step size about 0.02°, two-column format: 2θ intensity).

  This compound is monoclinic, with space group P 21 (No. 4). Literature reference cell: a ≈ 10.83 Å, b ≈ 9.62 Å, c ≈ 10.13 Å, beta ≈ 108.75°, V ≈ 1000 Å³.

  Suggested refinement strategy: - use the 14°–50° 2θ range to avoid low-angle artifacts - use a low-order baseline/background function (order 0–1) to avoid overfitting - if multiple refinements converge to different basins, choose the result with the lowest wR and the smallest volume deviation from the initial guess.

  Please perform a Pawley refinement on this PXRD pattern, extract the refined lattice parameters, and report the refinement quality.

  [Machine-scoring convention] At the end of the final answer, append a JSON block wrapped in an eval_results tag (values without units; conventions: a/b/c in Å, beta in degrees, V in Å³, wR in %), in the following format:

  <eval_results> {"a": ..., "b": ..., "c": ..., "beta": ..., "V": ..., "wR": ...} </eval_results>

  The values must come from the actual Pawley refinement result, and must not be filled in using the approximate initial guesses from the prompt. '
tags:
- char_diffraction
data_files:
- key: pxrd_data
  path: pxrd_303K.xy
  oss_url: ''
  description: PXRD pattern at 303 K (Cu Kalpha1, 5-50 deg 2theta), two-column format (2theta, intensity). Generated 
    from real laboratory diffractometer scan.
