  axis: correctness
  verify: contains_all
- id: grounding_source
  criterion: Final answer explicitly states the lattice constant, space group number,
    and atom count from the built structure.
  axis: grounding
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn budget.
  axis: efficiency
  verify: turn_budget
- id: token_budget_total
  criterion: Total token usage stays within budget.
  axis: efficiency
