intent: Complete an end-to-end workflow from structure retrieval to surface construction to input generation.
human_prompt_seed: 'Please complete the following end-to-end workflow:

  1. Retrieve the rutile TiO2 structure (space group P4_2/mnm) from a structure database.

  2. Cut a (110) surface slab with 3 layers, a 2×1×1 supercell, and 15 Å vacuum.

  3. Generate a VASP static-calculation INCAR for the slab (ENCUT=520, ISMEAR=0, SIGMA=0.05, NSW=0).

  Output three files: `tio2_bulk.cif` (bulk), `tio2_110_slab.cif` (slab), and `INCAR`.'
