id: PXRD_thermal_expansion_001_20260506
task_type: material_characterization
capabilities:
- scientific_reasoning
- scientific_grounding
domain: agnostic
intent: Perform Pawley refinement on variable-temperature PXRD patterns to extract
  lattice parameters at each temperature, identify two structural phases (low-temperature
  RTP and high-temperature HTP), and fit linear thermal expansion equations for each
  phase.
human_prompt_seed: '文件 `_td-pxrd_test.txt` 包含一个化合物在 8 个温度下的变温粉末 X 射线衍射（PXRD）数据，温度标签对应关系为：30°C→303K、50°C→323K、70°C→343K、90°C→363K、110°C→383K、120°C→393K、130°C→403K、140°C→413K。该化合物为单斜晶系，空间群提示为
  P 21（No. 4），波长为 Cu Kα1，λ = 1.5406 Å。

  数据特征与精修策略： - 数据为实测变温实验数据，扣除背景前的动态范围约 10×–30×；2θ 范围 5°–50°，建议精修使用 14°–50° 区间以避开低角伪影。
  - 推荐将数据按相拆分（RTP 4 点、HTP 4 点）分别精修，并在同一相内启用 chain-cell（前一温度精修结果作为下一温度初猜）。 - 同相内的体积/晶胞参数应单调或近似单调随温度变化；若某温度精修结果
  V 相对邻近温度跳变 >5%，应视为收敛到错误盆地（可能为 √2 或 2× 的伪解），需要从相邻温度结果重新初始化或多起点重精修。

  运行预算（重要）：本题目硬性 wall-clock 上限 1200 s（线上 task timeout）。Pawley 精修请按以下设置以兼顾稳定性与时限： -
  使用 `--multi-start 1`（每相单条 chain 即可；niggli 标准化 + 双向 chain-cell 已能覆盖绝大多数错盆地，不需要 5×/8×
  起点的暴力多起点；脚本默认开启的 `--self-heal-chain` 会在 chain merge 之后对 V 跳变 >2% 的单点自动用 multi-start
  5 重精修，足以兜住偶发塌方）； - 使用 `--chain-cell --chain-cell-direction both`（脚本内部会做正反向 merge
  与体积一致性裁决）； - 使用 `--standardize-cell ref`（基于参考晶胞做轴置换 + niggli 还原，规避单斜/正交等晶系的等效设定切换）；
  - 必须**先并行 submit RTP 与 HTP 两个 Bohrium 任务**（两次 `Bohrium(action=''submit'')` 一次性发出，**不要先
  submit RTP → 等结果 → 再 submit HTP**），随后再循环 `poll` 检查；串行 submit 会因为单作业 8–12 min 直接超时。
  - **拿到 results.json 后不要再发起新的 Bohrium 精修作业**：脚本内置的 `chain-cell` + `standardize-cell`
  + `self-heal-chain` 已经把邻居体积一致性与错盆地单点重精修做完了，agent 端只需要读 `results` / `merge_audit`
  / `self_heal_audit`，做最终的相分组与线性拟合，直接写答案。重新提交 Bohrium 作业 1 次就会吃掉 8–12 min，几乎必然超时。

  文献参考晶胞（每相分别作为 Pawley 精修初猜，并基于此自由精修；c 与 β 是单斜结构敏感参数，如下文献值已对每相核对）： - 低温相 RTP（303K
  – 363K）：a ≈ 10.83 Å, b ≈ 9.62 Å, c ≈ 10.13 Å, β ≈ 108.75°, V ≈ 1000 Å³ - 高温相 HTP（383K
  – 413K）：a ≈ 11.05 Å, b ≈ 9.48 Å, c ≈ 10.48 Å, β ≈ 111.25°, V ≈ 1023 Å³

  请对每个温度的 PXRD 图谱进行 Pawley 精修，提取晶格参数（a、b、c、β、V），并分析结果： 1. 识别两个结构相：低温相（1-RTP，303K–363K）和高温相（1-HTP，383K–413K）。
  2. 分别对两个相的各晶格参数（a、b、c、β、V）随温度的变化进行线性拟合，给出拟合方程（斜率、截距、R²）。两相必须分别独立拟合，不能合并为一条直线，且 RTP
  与 HTP 的斜率应基于各相内的 4 个温度点分别计算（不要让两相共享同一斜率值）。 3. 报告各温度下的精修结果。每个温度必须使用 Pawley 脚本（如 `gsas2_pawley.py`）输出
  JSON 中真实的 volume（由收敛后的 a/b/c/β 计算得到），不要将 prompt 中的近似初猜（V ≈ 1000、1023 Å³）当作精修结果填入答案。

  【机器评分约定】最终答案末尾追加一个 eval_results 标签包裹的 JSON 块（数值无单位，约定单位为 Å / Å³ / Å·K⁻¹ / Å³·K⁻¹），至少需含以下
  dot-path（其余字段如其它温度、b/beta、intercept、r_squared 可按情况补充；fits 为同相内 4 点线性拟合，RTP 与 HTP
  必须独立）：

  - rtp.{303K,363K}.V，rtp.303K.a，rtp.fits.V.slope，rtp.fits.a.slope - htp.{383K,413K}.V，htp.383K.a，htp.fits.V.slope，htp.fits.c.slope

  数值必须来自实际 Pawley 精修与线性拟合，不得填入 prompt 中的初猜近似值。

  最终答案中请额外用 2–4 句简述审计信息： - 精修质量审计：`curation.verdict` / `warnings` 是否提示问题；`merge_audit.warnings`
  或 `self_heal_audit.outliers` 是否为空，如不为空请指出受影响的温度点。 - Bohrium 执行审计：总共发起了几次 `Bohrium(action=''submit'')`（本题应
  ≤3）；提交命令是否使用 `cmd=''bash run.sh > log 2>&1''`；下载后是否确认每个结果目录包含 `log` 与 `results.json`；结果是否来自
  Bohrium 上运行的 `gsas2_pawley.py` 而不是本地 scipy/numpy 近似拟合。 '
