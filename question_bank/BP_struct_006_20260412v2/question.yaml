id: BP_struct_006_20260412v2
task_type: simulation
capabilities:
- data_handling
- scientific_reasoning
domain: battery
intent: Batch retrieve 20 lithium-containing structures and compute the average volume per atom from per-structure 
  metadata.
human_prompt_seed: '批量检索 20 个含锂材料（结构文件可下载），并计算它们的平均单原子体积（average volume per atom）。

  请完成以下交付：

  1) `li20_volume_stats.json`：至少包含 `candidate_count`, `volume_per_atom_list`, `average_volume_per_atom`, `unit`； 2) `li20_retrieval_report.md`：说明检索条件（含锂、数量
  20）、每条数据的体积/原子数来源，以及均值计算过程； 3) 在最终回答中给出平均值并说明该统计可能受哪些样本偏差影响。

  注意：本题强调批量检索 + 统计汇总，不要求后续第一性原理计算。'
tags:
- wf_batch
- meta_userlog
data_files: []
