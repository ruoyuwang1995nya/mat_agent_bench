id: SA_lsv_cd_001_20260616
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: agnostic
difficulty: easy
intent: Quantify cadmium in a wastewater sample from CHI linear-sweep voltammetry calibration traces.
human_prompt_seed: 'Please download and analyze the following CHI660E linear-sweep voltammetry data files provided via OSS URLs:

  - `cd_lsv_blank.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_lsv_cd_001/1778080946_cd_lsv_blank.txt`

  - `cd_lsv_cal_10ugL.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_lsv_cd_001/1778080947_cd_lsv_cal_10ugL.txt`

  - `cd_lsv_cal_30ugL.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_lsv_cd_001/1778080948_cd_lsv_cal_30ugL.txt`

  - `cd_lsv_cal_50ugL.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_lsv_cd_001/1778080949_cd_lsv_cal_50ugL.txt`

  - `cd_lsv_cal_70ugL.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_lsv_cd_001/1778080950_cd_lsv_cal_70ugL.txt`

  - `cd_lsv_cal_100ugL.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_lsv_cd_001/1778080946_cd_lsv_cal_100ugL.txt`

  - `cd_lsv_wastewater_sample.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_lsv_cd_001/1778080950_cd_lsv_wastewater_sample.txt`

  These files come from the same set of Cd standards and a wastewater sample measurement. Please complete the following analysis:

  1. Read each voltammetry file. If the header section already contains instrument-identified peak potential `Ep` and peak current `ip`, prioritize using the header `ip` for subsequent quantification so that the peak-current convention matches the original instrument report; otherwise extract the peak current from the I-V curve yourself. 2. Build a calibration relationship using the standards and evaluate the calibration quality. 3. Estimate the Cd concentration in the wastewater sample. 4. Compare it with the discharge limit of 0.1 mg/L and conclude whether it exceeds the limit. 5. Briefly explain your data-processing choices and principles for handling outliers.

  At the end of the final answer, append an `<eval_results>...</eval_results>` JSON block containing at least: `calibration.slope_A_per_ugL`, `calibration.r_squared`, `sample.cd_mg_L`, and `sample.peak_potential_V`.

  In the JSON, field names like `a.b` indicate nested objects (child key `b` under top-level key `a`); please use a nested structure rather than flat string keys. Example structure (numbers are placeholders):

  ```json {"calibration": {"slope_A_per_ugL": 0, "r_squared": 0}, "sample": {"cd_mg_L": 0, "peak_potential_V": 0}} ```'
