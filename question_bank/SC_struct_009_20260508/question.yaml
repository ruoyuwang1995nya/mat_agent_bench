domain: agnostic
difficulty: easy
intent: Build a stoichiometric and symmetric CeO2(111) surface with three Ce-O-Ce trilayers and oxygen termination; slab
  normal stacking should expose nine distinct atomic planes along z (three trilayers times three planes each).
human_prompt_seed: 'Build a CeO2(111) surface with three Ce-O-Ce tri-layers. Export as `ceo2_111_trilayer.cif`. Here "layer
  count" means **nine atomic planes** along the slab normal (z): each Ce-O-Ce tri-layer contributes three planes (O–Ce–O style
  stacking), not three coarse trilayer blocks. In the final answer, explicitly report: (1) whether `ceo2_111_trilayer.cif`
  exists; (2) the total **atomic** layer count along z, which should be 9; (3) whether the slab is symmetric; here symmetric
  means the top and bottom halves are mirror-equivalent around the slab center with matching O-terminated outermost planes;
  (4) whether the outermost surface layer is O-terminated; (5) the Ce:O stoichiometric ratio, which should match CeO2.

  '
