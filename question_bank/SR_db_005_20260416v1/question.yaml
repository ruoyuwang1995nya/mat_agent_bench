id: SR_db_005_20260416v1
task_type: search_and_interpretation
capabilities:
- tool_utilization
- scientific_reasoning
domain: agnostic
intent: Retrieve three oxide structures with band gap greater than 2 eV and summarize
  filter compliance.
human_prompt_seed: '检索并返回 3 个氧化物结构，要求带隙大于 2 eV。

  请完成以下交付：

  1) `oxide_bg_gt2_candidates.json`：列出 3 个候选，每条至少包含 `rank`, `formula`, `band_gap_eV`,
  `database_source`, `structure_identifier`；

  2) `oxide_bg_gt2_report.md`：说明检索条件（氧化物约束、带隙阈值、候选数量）以及筛选中可能的不确定性；

  3) 在最终回答中简要确认：每个候选是否满足 band gap > 2 eV 的约束。

  注意：本题仅评估检索与结构元数据汇总。'
tags:
- meta_database
data_files: []
reference_answers:
- key: candidates_json
  value: oxide_bg_gt2_candidates.json
- key: retrieval_report
  value: oxide_bg_gt2_report.md
- key: candidates_required_tokens
  value:
    filename: oxide_bg_gt2_candidates.json
    tokens:
    - rank
    - formula
    - band_gap_eV
    - database_source
    - structure_identifier
    flags: i
- key: bandgap_regex
  value:
    filename: oxide_bg_gt2_candidates.json
    pattern: '"band_gap_eV"\s*:\s*(?:2\.(?:0*[1-9]\d*|\d*[1-9]\d*)|[3-9]\d*(?:\.\d+)?|\d{3,}(?:\.\d+)?)'
    flags: i
- key: report_required_tokens
  value:
    filename: oxide_bg_gt2_report.md
    tokens:
    - 氧化物
    - 带隙
    - 2
    - 3
    - 候选
    - 不确定性
    flags: i
- key: turn_budget
  value:
    max: 10
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 8000
scoring_checklist:
- id: candidates_json
  criterion: Agent writes `oxide_bg_gt2_candidates.json` to workspace.
  axis: correctness
  verify: artifact_exists
- id: retrieval_report
  criterion: Agent writes `oxide_bg_gt2_report.md` to workspace.
  axis: correctness
  verify: artifact_exists
- id: candidates_required_tokens
  criterion: Candidate JSON includes required metadata fields for oxide and band-gap
    screening.
  axis: correctness
  verify: text_file_contains_all
- id: bandgap_regex
  criterion: Candidate JSON provides explicit band-gap values greater than 2 eV.
  axis: correctness
  verify: text_file_regex
- id: report_required_tokens
  criterion: Retrieval report states filter constraints, candidate-count handling,
    and uncertainty note.
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: The final answer is grounded in retrieval results and does not fabricate
    band-gap values beyond reported metadata.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: No repeated identical retrieval calls with the same parameters.
  axis: efficiency
  verify: no_retries
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
