id: DF_scxrd_001_20260615v2
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: agnostic
difficulty: easy
intent: Determine the crystal structure of an ordered molecular crystal (1-RTP, 293 K) from raw single-crystal X-ray 
  diffraction data. Starting from the reduced reflection file (.hkl) and the data-collection summary (.p4p), the agent 
  must determine the space group, solve the structure, refine it, and generate a validated CIF with no A-level checkCIF 
  alerts.
human_prompt_seed: 'The files `A23050101A0735.hkl` and `A23050101A0735.p4p` are single-crystal X-ray diffraction data
  collected at 293 K for an organic-inorganic hybrid nitroprusside salt (already reduced). Please complete the following
  tasks:

  1. Determine the space group based on the unit-cell parameters and systematic absences in the `.p4p` file;

  2. Solve the crystal structure using an appropriate program;

  3. Perform full-matrix least-squares refinement until convergence;

  4. Generate a CIF file and validate it with IUCr checkCIF (A-level alerts are not allowed);

  5. Report the final refinement results: R1, wR2, GooF, and the unit-cell parameters.

  '
tags:
- char_diffraction
