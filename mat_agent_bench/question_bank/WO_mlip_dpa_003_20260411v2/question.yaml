human_prompt_seed: '计算金刚石结构 Si 的声子色散关系。

  从数据库获取或构建 Si 金刚石原胞，使用 DPA 机器学习势计算力常数矩阵，

  沿 Γ-X-K-Γ-L 高对称路径绘制声子色散曲线。

  报告 Γ 点最高光学支频率 (cm⁻¹) 以及是否存在虚频（判断动力学稳定性）。

  '
