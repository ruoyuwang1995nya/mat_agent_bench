id: SR_db_009_20260502
capability: structure_retrieval
domain: agnostic
intent: Retrieve five candidate Heusler-alloy structures and summarize downloadable
  structure resources.
human_prompt_seed: '检索并返回 5 个 Heusler 合金候选结构，并提供结构文件或下载链接信息。

  请完成以下交付：

  1) `heusler_candidates.json`：至少包含 `rank`, `formula`, `space_group`, `space_group_number`,
  `database_source`, `structure_identifier`, `cif_link_or_path`； 2) `heusler_retrieval_report.md`：说明检索条件、Heusler
  识别依据与结果不确定性。

  最终回答需简要确认候选数量和可下载资源情况。'
tags:
- meta_database
data_files: []
reference_answers:
- key: candidates_json
  value: heusler_candidates.json
- key: retrieval_report
  value: heusler_retrieval_report.md
- key: candidates_required_tokens
  value:
    filename: heusler_candidates.json
    tokens:
    - rank
    - formula
    - space_group
    - space_group_number
    - database_source
    - structure_identifier
    - cif_link_or_path
    - 225
    flags: i
- key: report_required_tokens
  value:
    filename: heusler_retrieval_report.md
    tokens:
    - Heusler
    - 5
    - 空间群
    - 下载
    - 不确定性
    flags: i
- key: turn_budget
  value:
    max: 10
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 8000
scoring_checklist:
- id: candidates_json
  criterion: Agent writes `heusler_candidates.json` to workspace.
  axis: correctness
  verify: artifact_exists
- id: retrieval_report
  criterion: Agent writes `heusler_retrieval_report.md` to workspace.
  axis: correctness
  verify: artifact_exists
- id: candidates_required_tokens
  criterion: Candidate JSON includes required metadata fields and explicit space-group
    context.
  axis: correctness
  verify: text_file_contains_all
- id: report_required_tokens
  criterion: Report explains retrieval constraints and downloadability notes with
    uncertainty handling.
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: The final answer is grounded in retrieved Heusler candidates and does
    not invent missing links or identifiers.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: No repeated identical retrieval calls with the same parameters.
  axis: efficiency
  verify: no_retries
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
