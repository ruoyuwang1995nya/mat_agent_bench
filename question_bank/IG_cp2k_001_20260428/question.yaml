id: IG_cp2k_001_20260428
capability: input_generation
domain: agnostic
intent: Generate a CP2K DFT single-point energy input file for a simple bulk system.
human_prompt_seed: '请为 MgO 岩盐结构（a=4.212 Å）生成 CP2K DFT 单点能计算输入文件，要求：

  1. 使用 PBE 泛函，DZVP 基组

  2. 平面波截断能 400 Ry

  3. SCF 收敛精度 1.0E-6

  4. 使用 Goedecker 赝势（GTH-PBE）

  输出文件名为 `cp2k.inp`。'
tags:
- eng_cp2k
data_files: []
reference_answers:
- key: input_artifact
  value: cp2k.inp
- key: required_keywords
  value:
    filename: cp2k.inp
    tokens:
    - FORCE_EVAL
    - DFT
    - PBE
    - SCF
    - CUTOFF
    flags: i
- key: turn_budget
  value:
    max: 10
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 8000
