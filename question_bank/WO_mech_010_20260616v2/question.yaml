human_prompt_seed: 'Evaluate the phase-formation tendency of the high-entropy alloy (HEA) AlCr0.8CoFeNi, covering the
  following information:

  1) key descriptors such as valence electron concentration (VEC), mixing enthalpy, and mixing entropy;
  2) binary formation-energy / phase-diagram information (used to assist stability judgment);
  3) whether the system tends to form a solid solution, and the possible crystal structure.

  Please provide the following deliverables:
  - `hea_alcr0.8cofeni_summary.json`: containing at least `vec`, `mixing_enthalpy`, `mixing_entropy`, `binary_formation_energy_summary`,
  `solid_solution_prediction`, and `possible_structure`;
  - `hea_alcr0.8cofeni_report.md`: explain the criteria, the conclusion, and the uncertainty.

  In the final answer, briefly provide the conclusion and basis for "whether a solid solution is likely to form".'
