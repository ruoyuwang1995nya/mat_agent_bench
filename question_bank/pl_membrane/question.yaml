id: pl_membrane
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: polymer
difficulty: easy
intent: Compare PIM-1, Matrimid, and 6FDA-DAM membranes for CO2/N2 separation by integrating solubility, diffusivity, 
  free-volume, and ranking metrics.
human_prompt_seed: 'The file `membrane_screening_bundle.json` summarizes intermediate data for three polymer membranes, PIM-1, Matrimid, and 6FDA-DAM, in CO2/N2 separation.

  Please complete a membrane-material screening report:

  1. Calculate or verify the CO2 permeability and CO2/N2 selectivity of each system.

  2. Distinguish which advantages come from high solubility and which come from high diffusivity.

  3. Explain the material differences by combining free volume and functional-group interactions.

  4. Recommend the candidate that is best suited to balancing throughput and selectivity.

  '
tags:
- phy_md
data_files:
- key: membrane_bundle
  path: membrane_screening_bundle.json
  description: Membrane-screening bundle with solubility, diffusivity, permeability, selectivity, and free-volume 
    descriptors for CO2/N2 separation.
reference_answers:
- key: best_balanced_candidate
  value: 6FDA-DAM
- key: pim1_permeability_barrer
  value: 5400.0
  tolerance: 250.0
- key: dam_selectivity
  value: 28.0
  tolerance: 2.0
- key: required_fields
  value:
  - permeability_table
  - selectivity_table
  - tradeoff_discussion
  - free_volume_note
  - recommendation
scoring_checklist:
- id: pim1_permeability_barrer
  criterion: PIM-1 CO2 permeability is reported within tolerance of the curated value (~5400 Barrer).
  verify: numerical_range
  capability: data_handling
  weight: 0.5
- id: dam_selectivity
  criterion: 6FDA-DAM CO2/N2 selectivity is reported within tolerance of the curated value (~28).
  verify: numerical_range
  capability: data_handling
  weight: 0.5
- id: recommendation_correctness
  criterion: Final recommendation identifies 6FDA-DAM as the best balanced membrane, while recognizing that PIM-1 has 
    the highest throughput.
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: required_fields
  criterion: Report includes permeability and selectivity tables, trade-off discussion, free-volume note, and a clear 
    recommendation.
  verify: llm_binary_judge
  capability: tool_utilization
  weight: 0.5
- id: grounding_source
  criterion: The answer uses the provided solubility, diffusivity, permeability, and free-volume evidence from 
    membrane_screening_bundle.json rather than generic membrane heuristics alone.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
