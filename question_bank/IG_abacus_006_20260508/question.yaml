id: IG_abacus_006_20260508
task_type: simulation
capabilities:
- tool_utilization
- workflow_orchestration
domain: agnostic
intent: Prepare ABACUS PW inputs for Mo surface-vacancy energy using bulk, pristine slab, and surface-vacancy slab 
  structures.
human_prompt_seed: '工作区中提供了 Mo 体相、无缺陷表面和表面空位三套结构。


  请为表面 vacancy benchmark 准备 ABACUS 平面波输入：

  1) 体相输入用于获取每原子参考能，采用 cell-relax。

  2) 无缺陷表面和表面空位两套 slab 输入采用 SCF，并保持可直接用于对比。

  3) 三套计算使用一致的低成本 benchmark 风格参数，并提供共用的 Gamma 点 KPT 文件。


  将结果写入当前目录：`INPUT_bulk_mo`、`INPUT_slab_clean`、`INPUT_slab_vac`、`KPT_gamma`。

  '
tags:
- eng_abacus
- struct_transform
data_files:
- key: mo_bulk
  path: mo_bulk.stru
  oss_url: ''
  description: Bulk Mo reference structure.
- key: mo110_pristine
  path: mo110_pristine.stru
  oss_url: ''
  description: Pristine Mo(110)-like slab for surface-vacancy benchmark.
- key: mo110_surface_vac
  path: mo110_surface_vac.stru
  oss_url: ''
  description: Surface-vacancy slab derived from the pristine Mo slab.
reference_answers:
- key: must_input_bulk_mo_mode
  value:
    filename: INPUT_bulk_mo
    tokens:
    - calculation cell-relax
    - basis_type pw
    flags: i
- key: must_input_slab_clean_mode
  value:
    filename: INPUT_slab_clean
    tokens:
    - calculation scf
    - basis_type pw
    flags: i
- key: must_input_slab_vac_mode
  value:
    filename: INPUT_slab_vac
    tokens:
    - calculation scf
    - basis_type pw
    flags: i
- key: must_input_bulk_mo_cal_force_stress
  value:
    filename: INPUT_bulk_mo
    tokens:
    - cal_force 1
    - cal_stress 1
    flags: i
- key: must_kpt_gamma_markers
  value:
    filename: KPT_gamma
    tokens:
    - K_POINTS
    - Gamma
    flags: i
- key: must_kpt_gamma_single_point
  value:
    filename: KPT_gamma
    pattern: ^\s*1\s+1\s+1(?:\s+\d+){0,3}\s*$
    flags: m
- key: suggested_bulk_low_cost_cutoff
  value:
    filename: INPUT_bulk_mo
    checks:
    - key: ecutwfc
      min: 10
      max: 50
- key: suggested_slab_clean_low_cost_cutoff
  value:
    filename: INPUT_slab_clean
    checks:
    - key: ecutwfc
      min: 10
      max: 50
- key: suggested_slab_vac_low_cost_cutoff
  value:
    filename: INPUT_slab_vac
    checks:
    - key: ecutwfc
      min: 10
      max: 50
- key: variable_bulk_smearing_or_mixing
  value:
    filename: INPUT_bulk_mo
    checks:
    - key: smearing_method
      allow_missing_key: true
      allowed_values:
      - gauss
      - gaussian
      - fixed
      - mp
      - mp2
      - methfessel-paxton
      - mv
      - cold
      - marzari-vanderbilt
      - fd
      - fermi-dirac
    - key: smearing_sigma
      allow_missing_key: true
      min: 0.001
      max: 0.1
    - key: mixing_type
      allow_missing_key: true
      allowed_values:
      - broyden
      - plain
      - pulay
    - key: mixing_beta
      allow_missing_key: true
      min: 0.01
      max: 0.9
      if_component_count_in:
      - 1
    - key: mixing_ndim
      allow_missing_key: true
      min: 1
      max: 1000
      if_component_count_in:
      - 1
    - key: mixing_gg0
      allow_missing_key: true
      min: 0.1
      max: 20
      if_component_count_in:
      - 1
- key: variable_slab_smearing_or_mixing
  value:
    filename: INPUT_slab_clean
    checks:
    - key: smearing_method
      allow_missing_key: true
      allowed_values:
      - gauss
      - gaussian
      - fixed
      - mp
      - mp2
      - methfessel-paxton
      - mv
      - cold
      - marzari-vanderbilt
      - fd
      - fermi-dirac
    - key: smearing_sigma
      allow_missing_key: true
      min: 0.001
      max: 0.1
    - key: mixing_type
      allow_missing_key: true
      allowed_values:
      - broyden
      - plain
      - pulay
    - key: mixing_beta
      allow_missing_key: true
      min: 0.01
      max: 0.9
      if_component_count_in:
      - 1
    - key: mixing_ndim
      allow_missing_key: true
      min: 1
      max: 1000
      if_component_count_in:
      - 1
    - key: mixing_gg0
      allow_missing_key: true
      min: 0.1
      max: 20
      if_component_count_in:
      - 1
- key: variable_slab_vac_smearing_or_mixing
  value:
    filename: INPUT_slab_vac
    checks:
    - key: smearing_method
      allow_missing_key: true
      allowed_values:
      - gauss
      - gaussian
      - fixed
      - mp
      - mp2
      - methfessel-paxton
      - mv
      - cold
      - marzari-vanderbilt
      - fd
      - fermi-dirac
    - key: smearing_sigma
      allow_missing_key: true
      min: 0.001
      max: 0.1
    - key: mixing_type
      allow_missing_key: true
      allowed_values:
      - broyden
      - plain
      - pulay
    - key: mixing_beta
      allow_missing_key: true
      min: 0.01
      max: 0.9
      if_component_count_in:
      - 1
    - key: mixing_ndim
      allow_missing_key: true
      min: 1
      max: 1000
      if_component_count_in:
      - 1
    - key: mixing_gg0
      allow_missing_key: true
      min: 0.1
      max: 20
      if_component_count_in:
      - 1
- key: input_bulk_mo_artifact
  value: INPUT_bulk_mo
- key: input_slab_clean_artifact
  value: INPUT_slab_clean
- key: input_slab_vac_artifact
  value: INPUT_slab_vac
- key: kpt_gamma_artifact
  value: KPT_gamma
- key: grounding_source
  value:
    filenames:
    - mo_bulk.stru
    - mo110_pristine.stru
    - mo110_surface_vac.stru
