- id: gap_value_eV
  criterion: Band-gap value is in tolerance.
  axis: correctness
  verify: numerical_range
  capability: scientific_reasoning
  weight: 0.5
- id: required_fields
  criterion: Reports band gap type, band gap value in eV, VBM k-point location, and CBM k-point location.
  axis: correctness
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: grounding_source
  criterion: Gap type and value are tied to band_edges.json as described in the final answer, not bare LLM recall of Si.
    Judge from the answer and stated file use; do not fail because the tool-call log omits MCP, web_search, or any 
    specific tool.
  axis: grounding
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
