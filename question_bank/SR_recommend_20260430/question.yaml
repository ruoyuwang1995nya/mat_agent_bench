  value: {}
- key: recommendation_hit_rate
  value:
    reference_list_file: reference_list.json
    min_ratio: 0.6
- key: turn_budget
  value:
    max: 5
- key: duration_budget
  value:
    max: 180000
- key: token_budget_total
  value:
    max: 8000
