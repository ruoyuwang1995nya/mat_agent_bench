id: IG_abacus_008_20260508
task_type: simulation
capabilities:
- tool_utilization
- workflow_orchestration
domain: agnostic
intent: Prepare ABACUS Si PW-SCF inputs and Bohrium submission configuration.
human_prompt_seed: 请为 Si 的 ABACUS PW-SCF 试算准备当前目录下的 `INPUT`、`STRU`、`KPT`，并把 Bohrium
  提交配置写入 `submit_job.json`。
tags:
- eng_abacus
reference_answers:
- key: submit_json_artifact
  value: submit_job.json
- key: input_artifact
  value: INPUT
- key: stru_artifact
  value: STRU
- key: kpt_artifact
  value: KPT
- key: must_submit_json_core
  value:
    filename: submit_job.json
    pattern: (?is)"image"\s*:\s*"registry\.dp\.tech/dptech/dp/native/hub/mrdic2/abacusp:1\.0\.1-1778080680".*"machine"\s*:\s*"c32_m128_cpu".*"cmd"\s*:\s*"[^"]*abacus[^"]*"
    flags: im
- key: must_input_pw_core
  value:
    filename: INPUT
    tokens:
    - calculation scf
    - basis_type pw
    flags: i
- key: must_input_pseudo_dir
  value:
    filename: INPUT
    pattern: (?im)^\s*pseudo_dir\s+/root/apns-pseudopotentials-v1/?\s*$
    flags: im
- key: must_input_ntype_matches_species
  value:
    filename: INPUT
    pattern: (?im)^\s*ntype\s+1\s*$
    flags: im
- key: must_stru_si_pseudo
  value:
    filename: STRU
    pattern: (?im)^\s*Si\s+[0-9.]+\s+Si\.upf\s*$
    flags: im
- key: variable_workspace_files_correct
  value: {}
- key: turn_budget
  value:
    max: 10
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 20000
scoring_checklist:
- id: submit_json_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `submit_job.json` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 1.0
- id: input_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `INPUT` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 1.0
- id: stru_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `STRU` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 1.0
- id: kpt_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `KPT` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 1.0
- id: must_submit_json_core
  criterion: '[Must] submit_job.json uses the expected ABACUS Bohrium image, machine,
    and command.'
  axis: correctness
  verify: text_file_regex
  weight: 1.0
- id: must_input_pw_core
  criterion: '[Must] INPUT uses ABACUS PW SCF core controls.'
  axis: correctness
  verify: text_file_contains_all
  weight: 1.0
- id: must_input_pseudo_dir
  criterion: '[Must] INPUT points ABACUS to the APNS pseudopotential directory.'
  axis: correctness
  verify: text_file_regex
  weight: 1.0
- id: must_input_ntype_matches_species
  criterion: '[Must] INPUT sets ntype to 1, matching the single species (Si) defined
    in STRU ATOMIC_SPECIES.'
  axis: correctness
  verify: text_file_regex
  weight: 1.0
- id: must_stru_si_pseudo
  criterion: '[Must] STRU uses the available Si pseudopotential filename.'
  axis: correctness
  verify: text_file_regex
  weight: 1.0
- id: variable_workspace_files_correct
  criterion: '[Variable] Workspace files are mutually consistent for the ABACUS Si
    PW-SCF run.'
  axis: correctness
  verify: llm_binary_judge
  weight: 0.3
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
  axis: efficiency
  verify: token_budget
