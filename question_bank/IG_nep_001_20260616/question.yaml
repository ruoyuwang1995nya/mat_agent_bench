id: IG_nep_001_20260616
task_type: simulation
capabilities:
- tool_utilization
- workflow_orchestration
domain: agnostic
difficulty: easy
intent: Draft a practical nep.in from provided training structures.
human_prompt_seed: 'There is an NEP training dataset `train.xyz` in the directory.


  Please inspect the data first, and then provide a directly trainable `nep.in`.

  Requirements:

  - `type` must match the elements in the data.

  - Do not copy parameters mechanically from a template; they should match the scale of this dataset.

  - Do not use values outside the valid NEP range.


  Also write a short note explaining how you chose the key parameters.


  Output to the current directory: `nep.in` and `nep_input_note.md`.'
tags:
- eng_gpumd
data_files:
- key: train_xyz
  path: train.xyz
  oss_url: ''
  description: Training structures for NEP fitting.
- key: test_xyz
  path: test.xyz
  oss_url: ''
  description: Test structures for NEP validation.
reference_answers:
- key: must_nep_in_artifact
  value: nep.in
- key: must_nep_note_artifact
  value: nep_input_note.md
- key: must_nep_core_tokens
  value:
    filename: nep.in
    tokens:
    - type
    - cutoff
    - n_max
    - basis_size
    - l_max
    - neuron
    - lambda_e
    - lambda_f
    - lambda_v
    - batch
    - population
    - generation
    flags: i
- key: must_type_statement
  value:
    filename: nep.in
    pattern: ^\s*type\s+\d+\s+[A-Z][a-z]?(?:\s+[A-Z][a-z]?)*\s*$
    flags: m
- key: must_cutoff_range
  value:
    filename: nep.in
    pattern: ^\s*cutoff\s+([3-9](?:\.\d+)?|10(?:\.0+)?)\s+([3-9](?:\.\d+)?|10(?:\.0+)?)\s*$
    flags: m
- key: variable_cutoff_consistency
  value: {}
- key: variable_dataset_reading_quality
  value: {}
- key: suggested_hparam_ranges
  value:
    filename: nep.in
    checks:
    - key: neuron
      min: 1
      max: 120
    - key: population
      min: 10
      max: 100
    - key: generation
      min: 10000
      max: 1000000
- key: variable_scale_aware_setup
  value: {}
- key: grounding_source
  value:
    filename: train.xyz
scoring_checklist:
- id: must_nep_in_artifact
  criterion: '[Must] `nep.in` is generated.'
  verify: artifact_exists
  weight: 0.5
  capability: tool_utilization
- id: must_nep_note_artifact
  criterion: '[Must] `nep_input_note.md` is generated.'
  verify: artifact_exists
  weight: 0.5
  capability: tool_utilization
- id: must_nep_core_tokens
  criterion: '[Must] `nep.in` includes core NEP training keywords.'
  verify: text_file_contains_all
  weight: 0.5
  capability: tool_utilization
- id: must_type_statement
  criterion: '[Must] `type` line is syntactically valid and species tokens are well-formed.'
  verify: text_file_regex
  weight: 0.5
  capability: data_handling
- id: must_cutoff_range
  criterion: '[Must] cutoff values stay in documented valid range.'
  verify: text_file_regex
  weight: 0.5
  capability: tool_utilization
- id: variable_cutoff_consistency
  criterion: '[Variable] Angular/radial cutoff relation follows documented constraints (including reasonable angular <= radial
    setup).'
  verify: llm_binary_judge
  weight: 0.5
  capability: scientific_reasoning
- id: variable_dataset_reading_quality
  criterion: '[Variable] `type` and parameter choices reflect actual reading of train.xyz (species/composition/scale), not
    a generic boilerplate file.'
  verify: llm_binary_judge
  weight: 0.5
  capability: data_handling
- id: suggested_hparam_ranges
  criterion: '[Suggested] major hyperparameters are within recommended NEP boundaries.'
  verify: text_file_numeric_range
  weight: 0.5
  capability: scientific_reasoning
- id: variable_scale_aware_setup
  criterion: '[Variable] Hyperparameter choices are adapted to observed data scale/composition (not copied as fixed template).'
  verify: llm_binary_judge
  weight: 0.5
  capability: workflow_orchestration
- id: grounding_source
  criterion: Type ordering and setup must be grounded in provided train/test inputs, without fabricating unseen species.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
