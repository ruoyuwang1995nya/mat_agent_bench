reference_answer_prompt: |-
  1. Download LiFePO4 (mp-19017) and LiFeSO4F favorite (mp-504769) structures from Materials Project and convert to POSCAR format.
  2. Assign formal charges: O=-2, F=-1, P=+5, S=+6, Fe=+2, Li=+1 as per Methods section.
  3. For each structure, implement Ewald summation to compute:
     a. Madelung field at the Fe site: M_Fe = sum_i (q_i / |r_Fe - r_i|) with proper Ewald convergence parameters.
     b. Madelung field at the Li site: M_Li = sum_i (q_i / |r_Li - r_i|).
  4. Compute V_pred = |M_Fe + M_Li| in arbitrary units for each material.
  5. Write all values to results.json with the specified keys.
  6. In analysis.txt, explain that LiFeSO4F has a higher voltage because (SO4)2- is more electronegative/inductive than (PO4)3-, leading to a larger Madelung field at the Fe site, and reference the Discussion section's explanation of the inductive effect.
  7. Expected experimental values: LiFePO4 ~3.4 V, LiFeSO4F ~3.6 V; the arbitrary-unit predictions should preserve this ordering.
