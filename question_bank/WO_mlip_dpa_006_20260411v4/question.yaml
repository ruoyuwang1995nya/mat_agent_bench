id: WO_mlip_dpa_006_20260411v4
task_type: simulation
capabilities:
- structure_manipulation
domain: agnostic
difficulty: easy
intent: Build and export three 1 mol/L Zn-salt aqueous model boxes near 2000 atoms with valid integer compositions and 
  concrete structure artifacts.
human_prompt_seed: "工作区已提供 `electrolyte_system_spec.json`。\n\n请围绕 ZnSO4、ZnCl2、Zn(ClO4)2 三种锌盐水溶液，完成“电解液建模”任务：\n1) 生成 `composition_plan.json`：给出三种体系的整数配比（盐对数、水分子数、总原子数），要求浓度接近
  1 mol/L，且总原子数在 1900~2100。\n2) 必须实际完成三套初始溶液盒子建模，并在工作区落盘结构文件：\n   - `znso4_1m_box.xyz`\n   - `zncl2_1m_box.xyz`\n   - `znclo4_1m_box.xyz`\n\
  3) 生成 `build_workflow.md`：说明从离子/水分子初始结构准备、溶液盒子构建、电中性检查、初始弛豫到输入准备的步骤。\n\n额外要求：\n- 本题重心是建模，不要求提交 MD 轨迹、能量日志、RDF 或 MSD 分析结果。\n\
  - `composition_plan.json` 中 `n_formula_units` / `n_water` / `total_atoms` 必须是 JSON 整数字段，不得使用字符串、逗号分隔或科学计数法。\n"
tags:
- code_mlip
- chem_electrolyte
- phy_md
data_files:
- key: electrolyte_spec
  path: electrolyte_system_spec.json
  oss_url: ''
  description: Integer-composition hints and constraints for three 1 mol/L Zn-salt aqueous systems near 2000 atoms.
