intent: Construct and compare close-packed layer cross sections for fcc and hcp crystals, then expand both slabs to 
  5x5x1 supercells.
human_prompt_seed: 'Please demonstrate the difference between fcc and hcp close-packed structures by completing the following modeling task and exporting the structures:

  1) First build bulk template structures for fcc and hcp, respectively. 2) Cut a close-packed layer cross section from each one, using 5 atomic layers and about 1 layer of vacuum. 3) Expand both cross-section structures to 5×5×1 supercells. 4) Output files: `fcc_close_packed_5x5x1.cif`, `hcp_close_packed_5x5x1.cif`, and `packing_comparison.md` (explaining the fcc/hcp stacking difference and the cross-section construction settings).

  In the final answer, briefly explain how you ensured that the two structures were compared under equivalent conditions.'
