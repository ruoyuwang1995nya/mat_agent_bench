id: IG_abacus_008_20260412
capability: input_generation
domain: agnostic
intent: Generate ABACUS PW SCF input combining dipole correction with compensating
  charge for a charged H2O slab, including gate-plane and barrier parameters.
human_prompt_seed: '工作区中提供了带真空区的 H2O 结构。


  请准备“偶极修正 + 补偿电荷 + 势垒”场景下的 ABACUS 输入：

  1) 生成 PW-SCF 的 INPUT，并启用偶极修正与补偿电荷控制。

  2) 在 INPUT 中加入避免电子溢出的势垒相关设置。

  3) 生成与大真空超胞匹配的 Gamma 点 KPT。


  将结果写入当前目录：`INPUT_gate`、`KPT_gate`。

  '
tags:
- abacus
- electrostatics
- phy_surface
data_files:
- key: base_h2o_gate
  path: base_h2o_gate.stru
  oss_url: ''
  description: H2O in a vacuum cell for compensating-charge setup.
reference_answers:
- key: must_input_gate_core
  value:
    filename: INPUT_gate
    pattern: (?ims)(?=.*^\s*calculation\s+scf\s*(?:#.*)?$)(?=.*^\s*basis_type\s+pw\s*(?:#.*)?$)(?=.*^\s*efield_flag\s+1\s*(?:#.*)?$)(?=.*^\s*dip_cor_flag\s+1\s*(?:#.*)?$)(?=.*^\s*gate_flag\s+(?:1|true)\s*(?:#.*)?$)(?=.*^\s*block\s+(?:1|true)\s*(?:#.*)?$)(?=.*^\s*efield_amp\s+0(?:\.0+)?\s*(?:#.*)?$)
    flags: is
- key: must_kpt_gate_gamma
  value:
    filename: KPT_gate
    tokens:
    - K_POINTS
    - Gamma
    flags: i
- key: must_kpt_gate_single_point
  value:
    filename: KPT_gate
    pattern: ^\s*1\s+1\s+1(?:\s+\d+){0,3}\s*$
    flags: m
- key: suggested_input_gate_numerics
  value:
    filename: INPUT_gate
    checks:
    - key: ecutwfc
      min: 90
      max: 120
    - key: scf_thr
      min: 1.0e-07
      max: 5.0e-06
    - key: out_pot
      expected: 2
      tolerance: 0
- key: suggested_gate_plane_and_barrier_fields
  value:
    filename: INPUT_gate
    tokens:
    - zgate
    - nelec
    - block_down
    - block_up
    - block_height
    flags: i
- key: variable_input_gate_smearing_mixing
  value:
    filename: INPUT_gate
    checks:
    - key: smearing_method
      allowed_values:
      - gauss
      - gaussian
      - fixed
      - mp
      - mp2
      - methfessel-paxton
      - mv
      - cold
      - marzari-vanderbilt
      - fd
      - fermi-dirac
    - key: mixing_type
      allowed_values:
      - broyden
- key: variable_input_gate_window
  value:
    filename: INPUT_gate
    tokens:
    - efield_pos_max
    - efield_pos_dec
    flags: i
- key: input_gate_artifact
  value: INPUT_gate
- key: kpt_gate_artifact
  value: KPT_gate
- key: turn_budget
  value:
    max: 8
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 18000
scoring_checklist:
- id: must_input_gate_core
  criterion: '[Must] INPUT_gate contains core dipole-correction + gate + barrier controls.'
  axis: correctness
  verify: text_file_regex
  weight: 1.0
- id: must_kpt_gate_gamma
  criterion: '[Must] KPT_gate is Gamma-centered.'
  axis: correctness
  verify: text_file_contains_all
  weight: 1.0
- id: must_kpt_gate_single_point
  criterion: '[Must] KPT_gate uses a single Gamma point (1x1x1).'
  axis: correctness
  verify: text_file_regex
  weight: 1.0
- id: suggested_input_gate_numerics
  criterion: '[Suggested] INPUT_gate follows benchmark numeric settings (`ecutwfc/scf_thr/out_pot`).'
  axis: correctness
  verify: text_file_numeric_range
  weight: 0.6
- id: suggested_gate_plane_and_barrier_fields
  criterion: '[Suggested] INPUT_gate includes gate-plane and barrier field parameters
    (`zgate`, `nelec`, `block_down/up/height`).'
  axis: correctness
  verify: text_file_contains_all
  weight: 0.6
- id: variable_input_gate_smearing_mixing
  criterion: '[Variable] INPUT_gate uses an acceptable smearing/mixing style for this
    benchmark family.'
  axis: correctness
  verify: text_file_numeric_range
  weight: 0.3
- id: variable_input_gate_window
  criterion: '[Variable] INPUT_gate includes dipole-window position controls (`efield_pos_max`,
    `efield_pos_dec`).'
  axis: correctness
  verify: text_file_contains_all
  weight: 0.3
- id: input_gate_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `INPUT_gate` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 0.5
- id: kpt_gate_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `KPT_gate` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 0.5
- id: grounding_source
  criterion: The generated setup is grounded in base_h2o_gate.stru and does not modify
    the provided structure beyond preparing INPUT/KPT.
  axis: grounding
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: no_retries
  criterion: No repeated identical tool calls with the same parameter set.
  axis: efficiency
  verify: no_retries
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
  axis: efficiency
  verify: token_budget
