id: WO_end_to_end_001_20260428
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: agnostic
intent: Complete an end-to-end workflow from structure retrieval to surface construction
  to input generation.
human_prompt_seed: '请完成以下端到端工作流：

  1. 从结构数据库中检索 TiO2 金红石结构（rutile，空间群 P4_2/mnm）

  2. 切出 (110) 表面 slab，3 层，2×1×1 扩胞，真空层 15 Å

  3. 为该 slab 生成 VASP 静态计算 INCAR（ENCUT=520, ISMEAR=0, SIGMA=0.05, NSW=0）

  输出三个文件：`tio2_bulk.cif`（体相）、`tio2_110_slab.cif`（slab）、`INCAR`。'
tags:
- eng_vasp
- struct_surface
- meta_database
data_files: []
reference_answers:
- key: bulk_artifact
  value: tio2_bulk.cif
- key: slab_artifact
  value: tio2_110_slab.cif
- key: incar_artifact
  value: INCAR
- key: turn_budget
  value:
    max: 20
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 16000
scoring_checklist:
- id: bulk_artifact
  criterion: Agent writes `tio2_bulk.cif` to workspace.
  axis: correctness
  verify: artifact_exists
- id: slab_artifact
  criterion: Agent writes `tio2_110_slab.cif` to workspace.
  axis: correctness
  verify: artifact_exists
- id: incar_artifact
  criterion: Agent writes `INCAR` to workspace.
  axis: correctness
  verify: artifact_exists
- id: pipeline_correctness
  criterion: The workflow is logically connected — bulk structure is TiO2 rutile,
    slab is cut from it along (110), and INCAR parameters match the static calculation
    request.
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: Each step is grounded in the previous step output (slab from bulk, INCAR
    for slab), not independently generated.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: No repeated identical tool calls with the same parameter set.
  axis: efficiency
  verify: no_retries
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration does not exceed ceiling.
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
