capability: structure_construction
domain: agnostic
intent: Construct and compare close-packed layer cross sections for fcc and hcp crystals,
  then expand both slabs to 5x5x1 supercells.
human_prompt_seed: '请演示 fcc 与 hcp 近密堆积结构的差异，完成以下建模任务并导出结构：

  1) 先分别构建 fcc 与 hcp 体相模板结构； 2) 对两者各自切出近密堆积层截面，要求 5 个原子层，并设置约 1 层真空； 3) 将两个截面结构都扩展为
  5×5×1 超胞； 4) 输出文件： - `fcc_close_packed_5x5x1.cif` - `hcp_close_packed_5x5x1.cif`
  - `packing_comparison.md`（说明 fcc/hcp 堆垛差异与截面构建设置）。

  最终回答需简要说明：你如何保证两种结构在可比条件下进行截面对比。'
