    formula: C21H23NO5
- key: hch_angle_deg
  value:
    filename: dacmor_hydrogenated.cif
    triplet:
    - H
    - C
    - H
    expected_deg: 109.48
    tolerance_deg: 8.0
    cutoff_A: 1.5
- key: molcrys_local_env
  value:
