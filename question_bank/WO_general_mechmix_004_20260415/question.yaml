domain: alloy
intent: Compare database-retrieved alloy references with APEX elastic predictions for a Ni-Co-Cr composition at room 
  temperature.
human_prompt_seed: '面向 Ni-Co-Cr 合金的室温弹性性质评估，请先检索相近成分的结构/弹性参考信息，再结合 APEX 计算结果给出对比结论。

  请输出： 1) `nico_cr_roomtemp_elastic.json`（至少包含 `C11`, `C12`, `C44`, `bulk_modulus_GPa`, `db_reference`, `comparison_summary`）；
  2) `nico_cr_roomtemp_report.md`（说明检索条件、APEX 参数、结果差异与不确定性）。

  最终回答需简要判断该结果在室温机械性能评估上的可信度。'
