human_prompt_seed: "Compute the adsorption energy of CO on the Ag(001) surface:\n1. Retrieve the Ag FCC bulk structure (a=4.085 Å) and cut an (001) surface slab (4 layers, 15 Å vacuum, 3×3 supercell).\n2. Build a gas-phase CO molecule (bond length about 1.128 Å).\n3. Place the CO molecule at an ontop site on the top layer of the slab (C end down, initial distance about 2.0 Å) to construct the adsorbed structure.\n4. Use the following mock energies (simulating DPA-relaxed results):\n   - E_slab = -108.45 eV\n   - E_CO = -12.85 eV\n   - E_adsorbed = -121.50 eV\n5. Compute the adsorption energy using E_ads = E(adsorbed) - E(slab) - E(CO).\n6. Report the adsorption energy (eV) and the energy values of the three structures.\n"
