domain: battery
intent: Summarize sulfur-containing solid-electrolyte candidates for Li-metal interfaces
  by balancing interface stability and ionic conductivity from recent literature.
human_prompt_seed: '请基于近年文献，推荐可用于锂金属负极界面的含硫固态电解质候选，并强调“界面稳定性 + 高离子电导”两方面的平衡。

  请输出： 1) `sulfur_sse_candidates.json`：至少包含 `material`, `key_property`, `interface_stability_note`,
  `ionic_conductivity_note`, `reference_hint`； 2) `sulfur_sse_review.md`：说明筛选逻辑、代表性体系与适用边界。

  最终回答中简要给出你最推荐的 2-3 个候选及理由。'
