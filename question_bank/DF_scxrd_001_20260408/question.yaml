scoring_checklist:
- id: r1_factor
  criterion: Final R1 factor (on F, I>2sigma) is within tolerance of 0.0418 (human
    baseline). A value ≤ 0.05 is acceptable for a well-refined ordered structure.
  axis: correctness
  verify: numerical_range
  weight: 2.0
- id: wr2_factor
  criterion: Final wR2 factor (on F², all data) is within tolerance of 0.0981 (human
    baseline). A value ≤ 0.12 is acceptable.
  axis: correctness
  verify: numerical_range
  weight: 1.5
- id: goof
  criterion: Goodness-of-fit (GooF, S) is within tolerance of 1.048. A value between
    0.9 and 1.2 indicates a well-refined structure.
  axis: correctness
  verify: numerical_range
  weight: 1.0
- id: space_group_number
  criterion: The agent correctly identifies the space group number as 4 (P2₁, monoclinic).
