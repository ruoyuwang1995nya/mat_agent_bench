id: SA_lfp_cycling_001_20260616
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: battery
difficulty: easy
intent: Analyze LiFePO4 half-cell cycling data from a Neware workbook.
human_prompt_seed: 'Please download and analyze the following Neware workbook provided via OSS URL:

  - `lfp_cycling.xlsx` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_lfp_cycling_001/1778083319_002_6(--).xlsx`

  This workbook comes from galvanostatic charge-discharge testing of a LiFePO4 half-cell.

  Please complete the following analysis:

  1. Read the cycle-summary data and organize the charge capacity, discharge capacity, specific capacity, and coulombic efficiency for the first several cycles. 2. Report the first-cycle discharge specific capacity and first-cycle coulombic efficiency. 3. Report the cycle-10 discharge specific capacity, and use cycle 2 as a relatively stable early reference to calculate capacity retention. 4. Judge whether the data show obvious first-cycle irreversible loss or early activation/fading behavior. 5. Briefly explain how you handled the multiple sheets in the workbook.

  At the end of the final answer, append an `<eval_results>...</eval_results>` JSON block containing at least: `cycle1.discharge_capacity_mAh_g`, `cycle1.coulombic_efficiency_pct`, `cycle10.discharge_capacity_mAh_g`, and `cycle10.retention_vs_cycle2_pct`.

  In the JSON, field names like `a.b` indicate nested objects (child key `b` under top-level key `a`); please use a nested structure rather than flat string keys. Example structure (numbers are placeholders):

  ```json {"cycle1": {"discharge_capacity_mAh_g": 0, "coulombic_efficiency_pct": 0}, "cycle10": {"discharge_capacity_mAh_g":
  0, "retention_vs_cycle2_pct": 0}} ```'
tags:
