id: DFT_pxrd_001_20260408
capability: scientific_analysis
domain: agnostic
intent: Perform Pawley refinement on variable-temperature PXRD patterns to extract
  lattice parameters at each temperature, identify two structural phases (low-temperature
  RTP and high-temperature HTP), and fit linear thermal expansion equations for each
  phase.
human_prompt_seed: '文件 `_td-pxrd_test.txt` 包含一个化合物在 8 个温度下的变温粉末 X 射线衍射（PXRD）数据，温度标签对应关系为：25°C→303K、40°C→323K、60°C→343K、80°C→363K、100°C→383K、115°C→393K、130°C→403K、140°C→413K。该化合物为单斜晶系。

  请对每个温度的 PXRD 图谱进行 Pawley 精修，提取晶格参数（a、b、c、β、V），并分析结果： 1. 识别两个结构相：低温相（1-RTP，303K–363K）和高温相（1-HTP，383K–413K）；
  2. 分别对两个相的各晶格参数（a、b、c、β、V）随温度的变化进行线性拟合，给出拟合方程（斜率、截距、R²）； 3. 报告各温度下的精修结果（晶格参数与 Rp/Rwp
  指标）。

  '
