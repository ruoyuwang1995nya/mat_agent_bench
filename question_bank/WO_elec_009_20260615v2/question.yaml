domain: semiconductor
difficulty: easy
intent: Compute Si phonon dispersion with ABACUS (including relaxation step) and summarize key spectrum outcomes.
human_prompt_seed: "Compute the phonon characteristics of Si (mock version):\n1. First query/retrieve and organize the
  input files required for this task (structure files, parameter files, and phonon-related inputs);\n2. Provide the phonon
  settings you would use (k-path/sampling, supercell or minimum length, displacement step);\n3. Do not run a real ABACUS
  calculation. Instead, use the following mock results for post-processing:\n   - supercell_or_min_length = \"3x3x3\"\n
  \   - displacement_step = 0.01\n   - gamma_optical_frequency_THz = 15.6\n   - imaginary_mode_check = false\n4. Summarize
  whether any imaginary modes are present, and explain the result confidence and uncertainty.\n\nPlease provide the following
  deliverables:\n1) `si_phonon_abacus.json`: containing at least `input_files`, `kpath_or_sampling`, `supercell_or_min_length`,
  `displacement_step`, `imaginary_mode_check`, and `key_frequency_summary`;\n2) `si_phonon_abacus_report.md`: explain
  the query-based input organization, the mock post-processing workflow, the key conclusions, and the uncertainty.\n\nIn
  the final answer, briefly state whether any imaginary modes appear, and label the conclusion as based on mock post-processing.\n"
tags:
- eng_abacus
data_files: []
