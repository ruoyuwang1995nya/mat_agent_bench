id: WO_elec_006_20260411v2
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: catalysis
intent: Mock surface energy for Fe BCC(110) with BSSE-aware workflow; compare sigma to VASP reference using provided 
  energies and area.
human_prompt_seed: '计算 Fe BCC(110) 表面能（ABACUS LCAO 场景，含 BSSE 校正思路）：从结构数据库或模板获取 Fe BCC 体相（a≈2.87 Å），切出 (110) slab（建议至少 6 层原子、约
  15 Å 真空）。说明在 LCAO 基组下需要在两侧真空添加 empty Fe 层以降低 BSSE。使用以下 mock 单点能量（单位 eV，已对应 BSSE 校正后的 slab SCF）：E_bulk = -230929.72（体相参考），E_slab
  = -230919.46，单侧截面积 A = 34.09 Å²。按 σ = (E_slab − E_bulk) / (2A) 计算表面能，换算为 J/m²（1 eV/Å² = 16.021766 J/m²），并与 VASP 参考值约 2.412
  J/m² 对比。全程不要提交真实 DFT 计算。

  '
tags:
- eng_abacus
- struct_surface
data_files: []
