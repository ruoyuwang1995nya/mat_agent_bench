intent: Run two-stage MD (NVT equilibration + NPT production) on Al FCC supercell with DPA; report average temperature 
  and pressure.
human_prompt_seed: 'Perform a molecular dynamics simulation for FCC Al.

  Retrieve or build the Al FCC primitive cell from a database and expand it to at least a 2×2×2 supercell,

  then run the following workflow using the DPA machine-learning potential:

  1) NVT equilibration: 300 K, 2 ps

  2) NPT sampling: 300 K, 0 GPa, 5 ps

  Report the average temperature (K) and average pressure (GPa) during the NPT stage.

  '
