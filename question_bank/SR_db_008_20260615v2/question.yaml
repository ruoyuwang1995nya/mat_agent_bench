domain: agnostic
difficulty: easy
intent: Retrieve up to five ternary rare-earth transition-metal oxides excluding Fe and Ni.
human_prompt_seed: 'Retrieve and return no more than 5 ternary oxide structures under the following constraints:

  - Must simultaneously contain: 1 rare-earth element + 1 transition-metal element + O;
  - Total number of elements is 3 (ternary);
  - Exclude Fe and Ni.

  Please provide the following deliverables:

  1) `re_tm_oxide_candidates.json`: containing at least `rank`, `formula`, `elements`, `database_source`, `structure_identifier`,
  and `selection_basis`;
  2) `re_tm_oxide_report.md`: explain the screening logic (rare earth, transition metal, ternary, excluding Fe/Ni) and
  the uncertainty of the results.

  In the final answer, confirm how each candidate satisfies the above combination constraints.'
