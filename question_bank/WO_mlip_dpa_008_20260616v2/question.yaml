id: WO_mlip_dpa_008_20260616v2
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: agnostic
difficulty: easy
intent: Run a short DPA molecular-dynamics simulation for Li2O at 300 K and summarize thermostat/time-step settings with
  trajectory statistics.
human_prompt_seed: "Perform a short MD workflow evaluation for Li2O (mock version):\n1. First query/retrieve and organize
  the input files required for MD (structure, potential, integration, and thermostat parameters);\n2. Target conditions:
  300 K, 1 ps, 1 fs, NVT;\n3. Do not run real MD. Instead, use the following mock results:\n   - ensemble = NVT\n   -
  temperature_K = 300\n   - runtime_ps = 1.0\n   - timestep_fs = 1.0\n   - n_steps = 1000\n   - thermo_stats = {\"T_avg\":
  301.2, \"T_std\": 7.8, \"drift\": \"small\"}\n4. Based on the mock values, perform post-processing and judge whether
  the target conditions are satisfied.\n\nPlease provide the following deliverables:\n1) `li2o_md_summary.json`: containing
  at least `input_files`, `ensemble`, `temperature_K`, `runtime_ps`, `timestep_fs`, `n_steps`, and `thermo_stats`;\n2)
  `li2o_md_report.md`: explain the query-based input organization, the mock post-processing workflow, the key observations,
  and the sources of error.\n\nIn the final answer, briefly confirm whether the three conditions 300 K / 1 ps / 1 fs
  are satisfied.\n"
tags:
- code_mlip
data_files: []
reference_answers:
- key: md_summary_artifact
  value: li2o_md_summary.json
- key: md_report_artifact
  value: li2o_md_report.md
- key: summary_required_tokens
  value:
    filename: li2o_md_summary.json
    must_cover:
    - ensemble
    - temperature_K
    - runtime_ps
    - timestep_fs
    - n_steps
    - thermo_stats
    - '300'
    - '1'
- key: report_required_tokens
  value:
    filename: li2o_md_report.md
    must_cover:
    - NVT
    - 300
    - 1 ps
    - 1 fs
    - temperature
    - uncertainty
- key: temperature_avg_mock
  value: 301.2
  tolerance: 15.0
scoring_checklist:
- id: md_summary_artifact
  criterion: Agent writes `li2o_md_summary.json` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: md_report_artifact
  criterion: Agent writes `li2o_md_report.md` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: summary_required_tokens
  criterion: MD summary JSON includes required simulation-parameter fields and basic runtime statistics.
  verify: llm_binary_judge
  capability: data_handling
  weight: 0.5
- id: report_required_tokens
  criterion: Report describes MD setup, observed behavior, and uncertainty caveats.
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: temperature_avg_mock
  criterion: Final answer includes a mock average temperature near 301.2 K.
  verify: numerical_range
  capability: tool_utilization
  weight: 0.5
- id: grounding_source
  criterion: The final answer is grounded in MD output artifacts and does not invent trajectory statistics not present 
    in generated results.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
