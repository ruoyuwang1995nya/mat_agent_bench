id: SC_struct_014_20260411v1
task_type: simulation
capabilities:
- structure_manipulation
domain: agnostic
intent: Build a perovskite crystal from explicit space group and Wyckoff position
  inputs and verify formula/lattice consistency.
human_prompt_seed: '请按给定空间群和 Wyckoff 位点信息构建晶体结构，并导出 `srtio3_wyckoff.cif`：

  - 空间群：Pm-3m（No. 221） - 晶格常数：a=b=c=3.90 Å，alpha=beta=gamma=90° - 位点： - Sr: 1b (0.5,
  0.5, 0.5) - Ti: 1a (0.0, 0.0, 0.0) - O:  3d (0.5, 0.0, 0.0)

  同时生成 `wyckoff_build_report.md`，说明如何把上述位点映射到结构构建参数，并给出结果自检要点（化学式、晶格参数）。

  最终回答需简要给出该结构类型（如立方钙钛矿）及潜在误差来源。'
tags:
- phy_surface
- mat_perovskite
- meta_userlog
