- id: reasonable_params
  criterion: The INCAR uses physically reasonable general settings for a VASP band structure calculation. ENCUT is 
    present (unless not relevant), EDIFF is present with a reasonable value, PREC is set. Machine-specific params (KPAR,
    NCORE, NPAR) are optional and should not be penalized if absent or different from reference.
  verify: llm_binary_judge
  capability: data_handling
  weight: 0.5
- id: grounding_source
  criterion: The generated INCAR is grounded in the provided prompt data (material system, calculation type, critical 
    parameters) rather than hallucinated. Judge solely from the final answer and stated file content; do not fail 
    because the tool-call log omits MCP, web_search, or any specific tool.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
- id: soc_consideration
  criterion: Agent acknowledges or considers spin-orbit coupling (SOC) for Lu (Z=71, heavy lanthanide) in the band 
    structure calculation. The agent should either enable LSORBIT=.TRUE. or explicitly discuss whether SOC is needed for
    this system.
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
