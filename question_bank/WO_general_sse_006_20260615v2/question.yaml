intent: Summarize sulfur-containing solid-electrolyte candidates for Li-metal interfaces by balancing interface 
  stability and ionic conductivity from recent literature.
human_prompt_seed: 'Based on recent literature, please recommend sulfur-containing solid-electrolyte candidates that can
  be used at lithium-metal anode interfaces, with emphasis on balancing "interface stability + high ionic conductivity".

  Please output:
  1) `sulfur_sse_candidates.json`: containing at least `material`, `key_property`, `interface_stability_note`, `ionic_conductivity_note`,
  and `reference_hint`;
  2) `sulfur_sse_review.md`: explain the sulfur-containing solid-electrolyte screening logic, representative systems, and applicability boundaries.

  In the final answer, briefly provide the 2-3 candidates you recommend most and the reasons why.'
