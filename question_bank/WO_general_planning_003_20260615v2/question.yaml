id: WO_general_planning_003_20260615v2
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: agnostic
difficulty: easy
intent: Produce phased execution and resource-control artifacts with explicit branch conditions and stop-loss policy.
human_prompt_seed: 'The workspace already provides `mission_constraints.json`.


  Please read this file first, then generate:

  1) `execution_plan.json`: a phased plan (inputs/outputs/parallelism/decision points);

  2) `resource_budget.json`: high-cost steps, estimated durations, and simplification strategies;

  3) `stage_gate.md`: clearly define the gate rule of "screen first, then perform deeper calculations" and the final report structure.

  4) `stop_loss.md`: define the stop-trigger conditions (time/resource/quality) and the contingency downgrade plan.

  '
tags: []
data_files:
- key: mission_constraints
  path: mission_constraints.json
  oss_url: ''
  description: Scope, budgets, and priorities for staged workflow planning.
reference_answers:
- key: execution_plan_artifact
