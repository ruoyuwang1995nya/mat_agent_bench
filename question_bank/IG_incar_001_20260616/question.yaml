- workflow_orchestration
domain: agnostic
difficulty: easy
intent: 'Generate VASP INCAR for a band structure calculation of Lu4N4. Non-self-consistent run reading existing charge density
  (ICHARG=11), with projected band output (LORBIT=11).

  '
human_prompt_seed: 'Generate a VASP INCAR file for a band-structure calculation of Lu4N4. Requirements: perform a non-self-consistent calculation, read from an existing charge density, and output projected band structure. Write the complete INCAR to the `INCAR` file in the current directory.'
tags:
- eng_vasp
reference_answers:
- key: incar_artifact
  value: INCAR
- key: incar_critical_tokens
  value:
    filename: INCAR
    tokens:
    - ICHARG
    - LORBIT
    flags: i
- key: critical_ICHARG
  value:
    filename: INCAR
    pattern: ^\s*ICHARG\s*=\s*11\b
    flags: im
- key: critical_LORBIT
  value:
    filename: INCAR
    pattern: ^\s*LORBIT\s*=\s*11\b
    flags: im
- key: optional_IBRION
  value:
    filename: INCAR
    pattern: (?ims)\A(?!.*^\s*IBRION\s*=)(?:.|\n)*\Z|^\s*IBRION\s*=\s*\-1\b
    flags: im
- key: optional_NSW
  value:
    filename: INCAR
    pattern: (?ims)\A(?!.*^\s*NSW\s*=)(?:.|\n)*\Z|^\s*NSW\s*=\s*0\b
    flags: im
- key: reasonable_params
  value:
    filename: INCAR
