id: WO_general_perov_007_20260417
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: semiconductor
intent: Query high-efficiency perovskite additives and produce recommendation plus a proposal draft based on predicted 
  performance.
human_prompt_seed: '请围绕“高效率（>26%）钙钛矿添加剂设计”完成一份推荐与提案。

  请输出： 1) `perovskite_additive_candidates.json`：至少包含 `smiles`, `predicted_effect`, `selection_reason`, `similar_formulation_hint`；
  2) `perovskite_additive_proposal.md`：基于最佳候选，给出研究目标、验证方案、预期结果与风险。

  最终回答中简要说明：为什么该候选最值得优先验证。'
tags: []
priority: P0
data_files: []
reference_answers:
- key: additive_json
  value: perovskite_additive_candidates.json
- key: proposal_md
  value: perovskite_additive_proposal.md
- key: additive_tokens
  value:
    filename: perovskite_additive_candidates.json
    must_cover:
    - smiles
    - predicted_effect
    - selection_reason
    - similar_formulation_hint
- key: proposal_tokens
  value:
    filename: perovskite_additive_proposal.md
    must_cover:
