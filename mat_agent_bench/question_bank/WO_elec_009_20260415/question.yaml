  criterion: Agent writes `si_phonon_abacus.json` to workspace.
  axis: correctness
  verify: artifact_exists
- id: phonon_report
  criterion: Agent writes `si_phonon_abacus_report.md` to workspace.
  axis: correctness
  verify: artifact_exists
- id: json_required_tokens
  criterion: JSON contains key phonon workflow and imaginary-mode-check fields.
  axis: correctness
  verify: llm_binary_judge
- id: report_required_tokens
  criterion: Report explains relax→phonon workflow and uncertainty caveats.
  axis: correctness
  verify: llm_binary_judge
- id: gamma_freq_mock
  criterion: Final answer includes a mock gamma optical frequency value near 15.6
    THz.
  axis: correctness
  verify: numerical_range
- id: grounding_source
  criterion: Final answer is grounded in generated phonon artifacts and does not fabricate
    unsupported dispersion conclusions.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: No repeated identical tool calls with the same parameter set.
  axis: efficiency
  verify: no_retries
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
