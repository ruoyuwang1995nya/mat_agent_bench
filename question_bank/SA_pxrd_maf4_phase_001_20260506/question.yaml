domain: agnostic
difficulty: easy
intent: Compare paired PXRD traces to determine whether enzyme encapsulation preserves the MAF-4 crystalline phase.
human_prompt_seed: '请下载并分析以下通过 OSS URL 提供的粉末 XRD 数据文件：

  - `maf4_enzyme_vs_pristine_pxrd.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_pxrd_maf4_phase_001/1778080965_maf4_enzyme_vs_pristine_pxrd.txt`

  该文件含有两个图谱：enzyme@MAF-4 与 pristine MAF-4。

  请完成以下分析：

  1. 对两个图谱进行必要的清理、归一化或对齐； 2. 找出主要衍射峰，并比较两者峰位是否保持一致； 3. 给出一个定量相似性指标； 4. 判断酶封装后 MAF-4 的晶相是否基本保持； 5. 简要指出强度变化和峰位变化分别说明什么。

  最终回答末尾请追加 `<eval_results>...</eval_results>` JSON，至少包含： `pristine.peak1_2theta`, `pristine.peak2_2theta`, `pristine.peak3_2theta`,
  `comparison.mean_peak_shift_deg`, `comparison.max_peak_shift_deg`, `comparison.pattern_correlation`。

  JSON 中字段名形如 `a.b` 表示嵌套对象（顶层 `a` 下的子键 `b`），请使用嵌套结构而不要写成扁平字符串键。结构示例（数值仅占位）：

  ```json {"pristine": {"peak1_2theta": 0, "peak2_2theta": 0, "peak3_2theta": 0}, "comparison": {"mean_peak_shift_deg": 0,
  "max_peak_shift_deg": 0, "pattern_correlation": 0}} ```'
