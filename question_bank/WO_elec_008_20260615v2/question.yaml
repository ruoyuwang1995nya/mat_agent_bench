intent: Perform ABACUS Bader charge analysis for Al2O3 and summarize per-atom charge transfer evidence.
human_prompt_seed: "Perform Bader charge analysis for Al2O3 (mock version):\n1. First query/retrieve and organize the
  input files required for Bader analysis (structure, charge density, and partition-related inputs);\n2. Clearly state
  the analysis objective: compare the direction and magnitude of charge transfer between Al and O;\n3. Do not run a real
  calculation. Instead, use the following mock statistics:\n   - average Bader charge of Al = +2.31 e\n   - average Bader
  charge of O = -1.54 e\n   - net charge conservation error < 0.01 e\n4. Based on the mock values, produce a post-processing
  summary and conclusions.\n\nPlease provide the following deliverables:\n1) `al2o3_bader_summary.json`: containing at
  least `input_files`, `atom_index`, `element`, `bader_charge`, and `charge_transfer`;\n2) `al2o3_bader_report.md`:
  explain the query-based input organization, the mock post-processing workflow, the main charge-transfer trends, and
  the uncertainty.\n\nIn the final answer, briefly summarize the direction of charge transfer between Al and O, and label
  it as a mock post-processing result.\n"
