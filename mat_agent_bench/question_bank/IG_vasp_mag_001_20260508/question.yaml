id: IG_vasp_mag_001_20260508
capability: input_generation
domain: agnostic
intent: Generate VASP INCAR for a magnetic Fe BCC system with correct spin-polarization
  settings.
human_prompt_seed: '工作区中有 Fe_bcc.vasp（体心立方铁，2个原子）。

  请生成适合该体系的 SCF 计算 INCAR 文件 `INCAR_mag`。

  注意：Fe 是典型的铁磁性金属，请确保计算设置正确反映其磁性。

  ENCUT = 520 eV，电子步收敛精度 1E-6 eV，PBE 泛函。'
tags:
- eng_vasp
data_files: []
reference_answers:
- key: incar_mag_artifact
  value: INCAR_mag
- key: must_ispin
  value:
    filename: INCAR_mag
    tokens:
    - ISPIN = 2
    - ISPIN=2
    flags: i
- key: must_magmom
  value:
    filename: INCAR_mag
    pattern: MAGMOM\s*=\s*2\*5
    flags: i
- key: must_encut
  value:
    filename: INCAR_mag
    checks:
    - key: ENCUT
      min: 520
      max: 520
- key: turn_budget
  value:
    max: 12
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 10000
scoring_checklist:
- id: incar_mag_artifact
  criterion: INCAR_mag file exists in workspace.
  axis: correctness
  verify: artifact_exists
- id: must_ispin
  criterion: INCAR_mag contains ISPIN = 2 for spin-polarized calculation.
  axis: correctness
  verify: text_file_contains_all
- id: must_magmom
  criterion: INCAR_mag sets MAGMOM with 2*5 (or equivalent per-atom magnetic moment
    for 2 Fe atoms).
  axis: correctness
  verify: text_file_regex
- id: must_encut
  criterion: ENCUT is set to 520 eV.
  axis: correctness
  verify: text_file_numeric_range
- id: grounding_mag
  criterion: Agent explains why ISPIN=2 and MAGMOM are needed for Fe (magnetic material),
    not just blindly setting parameters.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  axis: efficiency
  verify: no_retries
  criterion: No repeated identical tool calls.
- id: turn_budget
  axis: efficiency
  verify: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
- id: token_budget_total
  axis: efficiency
  verify: token_budget
  criterion: Total token usage stays within benchmark ceiling.
