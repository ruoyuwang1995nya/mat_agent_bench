id: SC_struct_011_20260411v1
task_type: simulation
capabilities:
- structure_manipulation
domain: agnostic
difficulty: easy
intent: Build a multi-component Fe-Ni-Co-Cr-V alloy structure from an fcc-Ni 5x5x5 supercell template and report 
  composition constraints.
human_prompt_seed: '请构建一个 Fe-Ni-Co-Cr-V 合金结构并导出为 `alloy_5x5x5_feni_cocrv.cif`。

  目标组成比例（原子分数）： Fe:Ni:Co:Cr:V = 0.635:0.165:0.10:0.05:0.05。

  要求： 1) 先以 fcc-Ni 为模板，构建 5×5×5 超胞后再进行掺杂替换； 2) 生成 `alloy_composition_report.json`，至少包含： `template`, `supercell`, `target_ratio`,
  `element_counts`, `notes`； 3) 在最终回答中说明比例如何映射到整数原子数，并给出可能的取整偏差说明。

  '
tags:
- mat_alloy
- phy_surface
- mat_hea
- meta_userlog
data_files: []
reference_answers:
- key: structure_artifact
  value: alloy_5x5x5_feni_cocrv.cif
- key: report_artifact
  value: alloy_composition_report.json
- key: report_required_tokens
  value:
    filename: alloy_composition_report.json
    tokens:
    - template
    - supercell
    - target_ratio
    - element_counts
    - Fe
    - Ni
    - Co
    - Cr
    - V
    flags: i
