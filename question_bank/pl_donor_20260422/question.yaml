id: pl_donor_20260422
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: polymer
intent: Pre-screen PM6, PTB7-Th, D18, and P3HT donor polymers for a Y6-like acceptor
  window using curated oligomer, conformational, and ranking data.
human_prompt_seed: '文件 `donor_prescreen_bundle.json` 提供了 PM6、PTB7-Th、D18 和 P3HT 四类给体聚合物的低聚体建模、量化、构象采样和简化
  ranking 结果。

  请完成一个给体预筛选报告：

  1. 比较 HOMO/LUMO、带隙、主链扭转角和平面性；

  2. 结合 1/n 外推结果，判断哪些体系更适合与 Y6 类受体匹配；

  3. 输出最终 shortlist，并分别说明“综合最优”和“高 Voc 候选”；

  4. 写出至少一个不确定性来源。

  '
tags: []
data_files:
- key: donor_bundle
  path: donor_prescreen_bundle.json
  description: Curated donor-polymer bundle with oligomer-level electronic structure,
    torsional descriptors, extrapolated gaps, and ranking metrics.
reference_answers:
- key: best_candidate
  value: D18
- key: d18_gap_extrapolated_eV
  value: 1.84
  tolerance: 0.08
- key: pm6_homo_eV
