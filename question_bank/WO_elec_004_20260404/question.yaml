id: WO_elec_004_20260404
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: battery
intent: Compute average Na intercalation voltage of NFPP using mock energies.
human_prompt_seed: "计算NFPP的平均嵌钠电压：\n1. 获取NFPP（Na₄Fe₃(PO₄)₂P₂O₇）结构（空间群Pna2₁，Z=4），使用单胞（104原子）；\n2. 含钠态：Na₁₆Fe₁₂P₁₆O₆₀（单胞满Na，104原子）；\n\
  \   脱钠态：Na₄Fe₁₂P₁₆O₆₀（按Na3→Na1→Na4顺序脱出12个Na，92原子）；\n3. 使用以下mock能量值（模拟DPA弛豫结果）：\n   - E_sodiated = -689.60 eV\n   - E_desodiated
  = -633.08 eV\n   - μ_Na（BCC Na金属）= -1.31 eV/atom\n   - n = 12（脱出的Na离子数：每个formula unit脱3个 × Z=4）\n4. 按公式 V = -[E(sodiated)
  - E(desodiated) - n·μ_Na] / n 计算平均电压；\n5. 输出平均电压(V vs Na/Na⁺)、n值、各能量值。\n"
tags:
- code_mlip
data_files: []
reference_answers:
- key: avg_voltage_V
  value: 3.4
  tolerance: 0.5
- key: required_fields
  value:
  - E_sodiated
  - E_desodiated
  - mu_Na
  - voltage
  - voltage_formula
scoring_checklist:
- id: avg_voltage_V
  criterion: Average voltage is computed correctly from mock energies (~3.4 V).
  axis: correctness
  verify: numerical_range
  capability: tool_utilization
  weight: 0.5
- id: sodiated_state
  criterion: Sodiated state is the full unit cell Na₁₆Fe₁₂P₁₆O₆₀ with 104 atoms and all 16 Na sites occupied.
  axis: correctness
  verify: llm_binary_judge
  capability: structure_manipulation
  weight: 0.5
- id: desodiated_state
  criterion: Desodiated state Na₄Fe₁₂P₁₆O₆₀ has 92 atoms with exactly 12 Na removed following Na3→Na1→Na4 site order.
  axis: correctness
  verify: llm_binary_judge
  capability: structure_manipulation
  weight: 0.5
- id: required_fields
  criterion: Report includes sodiated/desodiated energies, Na chemical potential, voltage formula, and computed voltage.
  axis: correctness
  verify: llm_binary_judge
  capability: tool_utilization
  weight: 0.5
- id: grounding_source
  criterion: NFPP structure uses correct Pna2₁ lattice parameters; mock energies and μ_Na used exactly as specified; 
    voltage formula applied correctly. Judge solely from the final answer; do not fail because the tool-call log omits 
    MCP, web_search, or any specific tool.
  axis: grounding
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
