intent: Batch-compute H adsorption energy on 3 different metal (001) surfaces using mock energies to test batch workflow
  efficiency.
human_prompt_seed: "Batch-calculate the adsorption energies of an H atom on Cu(001), Ag(001), and Au(001) metal surfaces
  for HER activity comparison:\n\nUse the same workflow for each metal:\n1. Obtain the FCC bulk structure (Cu: Fm-3m, a=3.615
  Å; Ag: Fm-3m, a=4.085 Å; Au: Fm-3m, a=4.078 Å).\n2. Build a (001) slab (4 layers, 15 Å vacuum, 2×2 supercell).\n3. Place
  an H atom at the ontop site (1.5 Å above the surface).\n4. Use the following mock energy values (simulating DPA relaxation
  results):\n\n   | Metal | E_slab (eV) | E_slab+H (eV) |\n   |------|-------------|---------------|\n   | Cu   | -57.12
  | -61.08        |\n   | Ag   | -43.56      | -47.63        |\n   | Au   | -50.84      | -54.83        |\n\n   H₂ reference
  energy: E_H₂ = -6.68 eV (Final Energy/Atom ≈ -3.34 eV; calculate it only once and share it across all three metals)\n\n5.
  Compute E_ads = E(slab+H) - E(slab) - 0.5×E(H₂).\n\nKey requirements:\n- The slab parameters must be exactly the same for
  all three metals (same number of layers, vacuum thickness, and supercell size)\n- Use the H₂ reference energy only once
  and share it across all three metals\n- Output a comparison table of the adsorption energies for the three metals, and
  evaluate HER activity by ranking them according to |ΔG_H|\n\nExpected results:\n- Cu: E_ads ≈ -0.62 eV\n- Ag: E_ads ≈
  -0.73 eV\n- Au: E_ads ≈ -0.65 eV\n"
