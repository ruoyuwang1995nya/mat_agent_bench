id: WO_struct_003_20260505
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: agnostic
difficulty: easy
intent: Generate and summarize 10 candidate crystal structures constrained by superconducting critical temperature and 
  space group.
human_prompt_seed: '基于结构生成流程，生成 10 个候选晶体结构，并满足以下约束：

  1) 候选结构目标条件：超导临界温度 Tc > 40 K；

  2) 空间群编号固定为 225；

  3) 给出机器可校验的候选列表文件 `candidate_structures.json`，每条至少包含： `rank`, `structure_file`, `predicted_tc_k`, `space_group`, `selection_basis`。其中
  `structure_file` 为工作目录中对应的结构文件名（如 POSCAR_2）；

  4) 生成 `generation_report.md`，说明生成参数（如 sample 数量、约束条件）、 候选筛选逻辑，以及不确定性声明。

  在最终回答中简要总结：是否满足”10 个候选 + Tc 阈值 + 空间群约束”三项要求。'
tags:
- struct_build
data_files: []
reference_answers:
- key: candidate_json
  value: candidate_structures.json
- key: generation_report
  value: generation_report.md
- key: candidate_required_tokens
  value:
    filename: candidate_structures.json
    tokens:
    - rank
    - structure_file
    - predicted_tc_k
    - space_group
    - selection_basis
    - '225'
    flags: i
- key: structure_artifacts
  value:
    filename: candidate_structures.json
    path_key: structure_file
    expected_count: 10
    count_tolerance: 0
- key: report_required_tokens
  value:
    filename: generation_report.md
    must_cover:
    - sample_num
    - 10
    - Tc
    - 40
    - 225
    - 不确定性
scoring_checklist:
- id: candidate_json
  criterion: Agent writes `candidate_structures.json` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: generation_report
  criterion: Agent writes `generation_report.md` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: candidate_required_tokens
  criterion: Candidate JSON includes required fields and explicitly reflects the space-group 225 constraint.
  verify: text_file_contains_all
  capability: data_handling
  weight: 0.5
- id: structure_artifacts
  criterion: Structure files referenced in candidate JSON actually exist in workspace.
  verify: json_file_artifacts
  capability: data_handling
  weight: 0.5
- id: report_required_tokens
  criterion: Report explains generation parameters, Tc/space-group constraints, and uncertainty handling.
  verify: llm_binary_judge
  capability: tool_utilization
  weight: 0.5
- id: grounding_source
  criterion: The final answer is grounded in generated candidate artifacts and explicitly checks the three constraints 
    (count, Tc threshold, and space group), rather than generic superconductivity statements.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
