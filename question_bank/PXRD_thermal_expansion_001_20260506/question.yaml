  criterion: Pass if the final answer, workspace files, or tool-call observations
    show that refinement results came from gsas2_pawley.py executed on Bohrium, and
    there is no positive evidence that the agent bypassed GSAS-II by writing a local
    scipy/numpy least-squares Pawley replacement.
  axis: correctness
