    json_path: calibration.slope_abs_per_uM
    target: 0.009225157232704404
    tolerance: 0.0015
  unit: absorbance/uM
- key: calibration_intercept
  value:
    json_path: calibration.intercept_abs
    target: 0.2232964959568735
    tolerance: 0.05
- key: calibration_r2
  value:
    json_path: calibration.r_squared
    target: 0.9974191041794597
    tolerance: 0.02
- key: diluted_glucose
  value:
    json_path: sample1.diluted_glucose_uM
    target: 53.80614749308501
    tolerance: 8.0
  unit: uM
- key: serum_glucose
  value:
    json_path: sample1.serum_glucose_mM
    target: 5.380614749308501
    tolerance: 0.8
  unit: mM
