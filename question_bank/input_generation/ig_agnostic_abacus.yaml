    axis: correctness
    verify: text_file_kpt_path
    weight: 1.0
  - id: suggested_input_spin_numerics
    criterion: '[Suggested] SCF input follows benchmark numeric setup with tolerance (`ecutwfc/scf_thr/smearing`).'
    axis: correctness
    verify: text_file_numeric_range
    weight: 0.6
  - id: suggested_input_spin_mixing
