intent: Retrieve an MgB2 structure from open databases and compute its phonon spectrum with an ML potential workflow.
human_prompt_seed: "执行 MgB2 “检索 + 声子”流程（Mock版）：\n1. 先 query/检索 MgB2 结构并记录来源、结构标识与输入文件；\n2. 说明拟采用的声子设置；\n3. 不做真实计算，使用以下 mock
  结果：\n   - retrieval_source = Materials Project\n   - structure_identifier = mp-763\n   - imaginary_mode_check = false\n\
  \   - gamma_e2g_mode_meV = 74.8\n   - output_artifacts = [\"band.yaml\", \"dos.dat\"]\n4. 基于 mock 值完成后处理并判断“结构与声子结果一致性”。\n\
  \n请完成以下交付：\n1) `mgb2_phonon_summary.json`：至少包含 `input_files`, `retrieval_source`, `structure_identifier`, `phonon_settings`,
  `imaginary_mode_check`, `output_artifacts`；\n2) `mgb2_phonon_report.md`：说明 query 输入梳理、mock 后处理的两阶段流程、关键参数与不确定性。\n\n最终回答中请简要说明：检索到的结构与声子结果是否相互一致。\n"
