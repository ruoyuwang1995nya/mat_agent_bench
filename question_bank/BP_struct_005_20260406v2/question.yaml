id: BP_struct_005_20260406v2
task_type: simulation
capabilities:
- data_handling
- scientific_reasoning
domain: agnostic
difficulty: easy
intent: Repair 5 problematic POSCAR structures by fixing geometry issues only. Focus the evaluation entirely on POSCAR 
  repair correctness and cause-aligned fixes.
human_prompt_seed: '从 `failure_recovery.json` 读取 5 个结构（TiO2, ZnO, MgO, Al2O3, SiO2）的失败恢复场景。每个条目里都有待修复的 `input_poscar` 路径。每个结构的初始计算因几何问题失败（如原子重叠、晶胞畸变、对称性错误等）。

  请为每个结构生成修正后的 POSCAR，修复策略：

  1. 仅修复结构文件（POSCAR）中的几何问题（原子位置、晶胞参数、对称性）

  3. 对每个结构说明修复了什么几何问题，以及修复后为何更合理（按 `failure_recovery.json` 中每个条目的 `repair_acceptance` 约束来做）

  输出要求：

  1. 5 个修正后的 POSCAR 文件

  2. 修复后 POSCAR 文件名固定为： - `calc_001_TiO2_fixed.POSCAR` - `calc_002_ZnO_fixed.POSCAR` - `calc_003_MgO_fixed.POSCAR` - `calc_004_Al2O3_fixed.POSCAR`
  - `calc_005_SiO2_fixed.POSCAR`

  不需要提交计算，只需生成正确的修正结构。

  关键考察点： 1. POSCAR 结构是否修对 2. 修复内容是否与失败原因对应

  '
tags:
- eng_vasp
priority: P0
