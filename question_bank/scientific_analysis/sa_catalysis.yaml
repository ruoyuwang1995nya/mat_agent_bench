version: v5
capability: scientific_analysis
domain: catalysis
questions:
- id: CR_WO_limiting_potential_20260412
  capability: scientific_analysis
  domain: catalysis
  intent: From free-energy steps on CO2RR-to-CO, HER, and CO2-to-HCOOH pathways, compute limiting
    potentials U_L = -ΔG_max/e per doc 3.2.2.
  human_prompt_seed: '给定（或由你说明来源的）各中间态与气相参考的吉布斯自由能或等价能量数据，对以下三条路径计算极限电势 U_L = -ΔG_max/e： （1）CO2(g)→CO*
    路径含 CO2*、COOH*、CO* 等步骤；（2）HER：H* 形成；（3）CO2→HCOOH 路径含 HCOO*、HCOOH*。 使用文档中的 ΔG 表达式形式（含 E(slab)、E(ads)、0.5
    E(H2)、eU 项），标出每条路径的决速步与 U_L（V），并汇总对比。

    '
  tags:
  - catalysis_lab
  - chem_co2rr
  - chem_her
  data_files: []
  reference_answers:
  - key: turn_budget
    value:
      max: 25
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 45000
  scoring_checklist:
  - id: three_pathways_ul
    criterion: 'In the FINAL delivered answer, all three reaction pathways are reported with
      their PDS (potential-determining step), ΔG_max (eV), and U_L (V): (1) CO₂→CO, (2) HER,
      (3) CO₂→HCOOH. NOTE: The answer may be in Chinese with markdown tables; lines like ''|------|-------------|-----''
      are standard table header separators, NOT truncation indicators. Judge ONLY on whether
      the final answer text contains the three complete sets of (PDS, ΔG_max, U_L) values,
      regardless of intermediate computation steps.'
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_energies
    criterion: 使用的能量/自由能数据来源清楚（计算值、表格或明确假设），且代入与决速步判定一致。
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within a generous benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: CR_WO_feature_extract_43d_20260412
  capability: scientific_analysis
  domain: catalysis
  intent: Implement 43-dimensional feature extraction (40 continuous + 3 categorical) from
    adslab POSCAR paths per doc 4.3.1.
  human_prompt_seed: '编写脚本：输入为含多个子目录的数据集根路径，每个体系子目录内有 POSCAR（或等价结构文件）。用 pymatgen 或 ASE 读取结构，
    识别吸附物与基底，吸附位点取吸附物几何中心；构造四类近邻环境（第一近邻同层、第二近邻同层、第二近邻下层、6 Å 内全体近邻）， 对每类用距离倒数加权，汇总元素属性得到 40
    维连续特征；另输出 3 个类别特征：吸附物种类、吸附类型（物理/化学吸附标签规则需在注释中说明）、基底类型。 输出 CSV 列名与维度说明。若工作区无完整数据集，可对单示例
    POSCAR 演示流水线并说明如何批处理。

    '
  tags:
  - catalysis_lab
  - chem_her
  - code_pymatgen
  - code_ase
  data_files: []
  reference_answers:
  - key: turn_budget
    value:
      max: 26
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 45000
  scoring_checklist:
  - id: script_and_schema
    criterion: 脚本可执行或逻辑完整；明确 40+3 维定义、四类近邻、6 Å cutoff、加权方式与输出列说明。
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_impl
    criterion: 实现与文档 4.3.1 描述一致（库函数选择、吸附质/基底识别规则、类别标签规则可读）。
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within a generous benchmark ceiling.
    axis: efficiency
    verify: token_budget
