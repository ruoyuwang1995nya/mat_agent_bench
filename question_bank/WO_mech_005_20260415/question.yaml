id: WO_mech_005_20260415
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: agnostic
intent: Compute an equation-of-state workflow for an alloy and summarize volume-scan settings and fitted EOS outputs.
human_prompt_seed: "对给定合金结构执行 EOS 分析（Mock版）：\n1. 先 query/检索并整理 EOS 所需输入文件与结构信息；\n2. 明确体积扫描设置（0.8~1.2）与拟合模型；\n3. 不做真实计算，使用以下
  mock 数据：\n   - vol_start = 0.8\n   - vol_end = 1.2\n   - vol_step = 0.05\n   - fit_model = Birch-Murnaghan\n   - equilibrium_volume
  = 11.42 (Å^3/atom)\n   - bulk_modulus = 178.6 (GPa)\n4. 基于 mock 值完成 EOS 后处理与结论解释。\n\n请完成以下交付：\n1) `alloy_eos_summary.json`：至少包含
  `input_files`, `vol_start`, `vol_end`, `vol_step`, `fit_model`, `equilibrium_volume`, `bulk_modulus`；\n2) `alloy_eos_report.md`：说明
  query 输入梳理、mock 后处理流程、体积扫描策略与不确定性。\n\n最终回答中简要说明该 EOS 结果能支持哪些定性判断。\n"
tags:
- code_mlip
data_files: []
reference_answers:
- key: eos_summary_json
  value: alloy_eos_summary.json
- key: eos_report_md
  value: alloy_eos_report.md
- key: eos_required_tokens
  value:
    filename: alloy_eos_summary.json
    must_cover:
    - vol_start
    - vol_end
    - vol_step
    - fit_model
    - equilibrium_volume
    - bulk_modulus
    - '0.8'
    - '1.2'
- key: report_required_tokens
  value:
    filename: alloy_eos_report.md
    must_cover:
    - EOS
    - 体积
    - 扫描
    - bulk modulus
    - 不确定性
- key: eos_bulk_modulus_mock
  value: 178.6
  tolerance: 20.0
