intent: Generate 5 VASP INCAR input files for Al ENCUT convergence test (280, 300, 320, 340, 360 eV). All other 
  parameters (k-mesh, ISMEAR, SIGMA, NSW) must remain strictly constant across the 5 files. Focus is on correct input 
  preparation and variable control, not on submitting or running calculations.
human_prompt_seed: 'Read the convergence test configuration from `convergence_encut.json`. Generate 5 VASP INCAR input
  files for an ENCUT convergence test of aluminum (Al), with ENCUT values of 280, 300, 320, 340, and 360 eV.

  Strict requirements: 1. The k-point mesh must be fixed at 8x8x8 for all 5 calculations (either via a KPOINTS file
  or in INCAR) 2. ISMEAR=1 and SIGMA=0.1 must be exactly the same in all INCAR files 3. NSW=0 (single-point calculation
  setting) 4. Except for ENCUT, all other VASP parameters must remain identical across the 5 files

  Output 5 INCAR files, with filenames containing the ENCUT value (for example, INCAR_ENCUT280). There is no need to
  submit the calculations; only generate the correct input files.

  Key evaluation points: 1. ENCUT changes sequentially across the 5 files and is the only varying parameter 2. All
  non-scan parameters are exactly identical across the 5 files 3. The INCAR format is correct and no parameters are missing

  '
