id: SR_db_004_20260615v2
task_type: search_and_interpretation
capabilities:
- tool_utilization
- scientific_reasoning
domain: battery
difficulty: easy
intent: Retrieve five Li-Mn-O materials from Alexandria and summarize machine-checkable provenance metadata.
human_prompt_seed: 'Retrieve materials containing the three elements Li, Mn, and O from the Alexandria data source, and
  return 5 candidates.

  Please provide the following deliverables:

  1) `lmo_candidates.json`: list 5 candidates, with each candidate containing at least `rank`, `formula`, `database_source`,
  `structure_identifier`, `elements`, and `format_available`;

  2) `lmo_retrieval_report.md`: explain the retrieval conditions (element constraints, result count), candidate filtering,
  and result uncertainty;

  3) In the final answer, briefly confirm whether the two constraints are satisfied: "Li+Mn+O all present simultaneously"
  and "exactly 5 entries".

  Note: this task is about structure retrieval and summarization, and does not require downstream calculations.'
tags:
- meta_database
data_files: []
reference_answers:
- key: candidates_json
  value: lmo_candidates.json
- key: retrieval_report
  value: lmo_retrieval_report.md
- key: candidates_required_tokens
  value:
    filename: lmo_candidates.json
    tokens:
    - rank
    - formula
    - database_source
    - structure_identifier
    - elements
    - format_available
    - Li
    - Mn
    - O
    flags: i
- key: report_required_tokens
  value:
    filename: lmo_retrieval_report.md
    tokens:
    - Alexandria
    - Li
    - Mn
    - O
    - 5
    - query condition
    - uncertainty
    flags: i
scoring_checklist:
- id: candidates_json
  criterion: Agent writes `lmo_candidates.json` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: retrieval_report
  criterion: Agent writes `lmo_retrieval_report.md` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: candidates_required_tokens
  criterion: Candidate JSON includes required provenance fields and explicitly contains Li/Mn/O element information.
  verify: text_file_contains_all
  capability: data_handling
  weight: 0.5
- id: report_required_tokens
  criterion: Retrieval report states Alexandria source, filter constraints, candidate count, and uncertainty note.
  verify: llm_binary_judge
  capability: data_handling
  weight: 0.5
- id: grounding_source
  criterion: The final answer is grounded in retrieval outputs and accurately reflects whether all constraints (elements
    + count) are met.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
