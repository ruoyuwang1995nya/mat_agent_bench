id: CR_WO_limiting_potential_20260412
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: catalysis
intent: From free-energy steps on CO2RR-to-CO, HER, and CO2-to-HCOOH pathways, compute
  limiting potentials U_L = -ΔG_max/e per doc 3.2.2.
human_prompt_seed: '给定（或由你说明来源的）各中间态与气相参考的吉布斯自由能或等价能量数据，对以下三条路径计算极限电势 U_L = -ΔG_max/e：
  （1）CO2(g)→CO* 路径含 CO2*、COOH*、CO* 等步骤；（2）HER：H* 形成；（3）CO2→HCOOH 路径含 HCOO*、HCOOH*。
  使用文档中的 ΔG 表达式形式（含 E(slab)、E(ads)、0.5 E(H2)、eU 项），标出每条路径的决速步与 U_L（V），并汇总对比。

  '
tags:
- catalysis_lab
- chem_co2rr
- chem_her
data_files: []
reference_answers:
- key: turn_budget
  value:
    max: 25
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 45000
scoring_checklist:
- id: three_pathways_ul
  criterion: 'In the FINAL delivered answer, all three reaction pathways are reported
    with their PDS (potential-determining step), ΔG_max (eV), and U_L (V): (1) CO₂→CO,
    (2) HER, (3) CO₂→HCOOH. NOTE: The answer may be in Chinese with markdown tables;
    lines like ''|------|-------------|-----'' are standard table header separators,
    NOT truncation indicators. Judge ONLY on whether the final answer text contains
    the three complete sets of (PDS, ΔG_max, U_L) values, regardless of intermediate
    computation steps.'
  axis: correctness
  verify: llm_binary_judge
- id: grounding_energies
  criterion: 使用的能量/自由能数据来源清楚（计算值、表格或明确假设），且代入与决速步判定一致。
  axis: grounding
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling.
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
