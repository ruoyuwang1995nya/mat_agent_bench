human_prompt_seed: "计算NFPP的Al掺杂形成能：\n1. 获取NFPP（Na₄Fe₃(PO₄)₂P₂O₇）结构（空间群Pna2₁），构建2×1×1超胞作为pristine结构；\n2. 在P位（PO₄磷酸根位点）用Al替换一个P原子，构建掺杂超胞；\n\
  3. 使用以下mock能量值（模拟DPA弛豫结果）：\n   - E_pristine = -689.605 eV\n   - E_doped = -687.057 eV\n   - μ_P（红磷参考态）= -5.41 eV/atom\n\
  \   - μ_Al（金属Al参考态）= -3.75 eV/atom\n4. 按公式 E_f = E(doped) - E(pristine) + μ_P - μ_Al 计算形成能；\n5. 计算体积变化率（掺杂后体积约1313.17 Å³，原始约1316.68
  Å³）；\n6. 输出掺杂形成能(eV)、体积变化率(%)。\n"
