id: SIM_mno2_002_20260601
task_type: simulation
capabilities:
- structure_manipulation
- scientific_reasoning
- tool_utilization
domain: semiconductor
difficulty: medium
intent: Analyze the interstitial sites in a β-MnO₂ (pyrolusite, rutile-type) structure and determine which sites are 
  geometrically compatible with Li⁺ intercalation based on ionic radius and coordination environment. Generate a 
  structure with Li inserted at the identified sites.
human_prompt_seed: Given the β-MnO₂ (pyrolusite) structure in beta_mno2.cif, analyze the available interstitial sites 
  for Li⁺ intercalation. Li⁺ has an ionic radius of 0.76 Å (6-coordinate). Identify the Wyckoff positions of the 
  interstitial sites in the [1×1] tunnel structure, determine which sites provide reasonable octahedral or tetrahedral 
  coordination for Li⁺, and generate a new structure file beta_mno2_li.cif with Li inserted at the identified sites at a
  concentration of Li₀.₂₅MnO₂. Write a brief analysis of the site choices to site_analysis.txt.
tags:
- intercalation
- site_analysis
- ionic_radius
- pymatgen
data_files:
- key: beta_mno2
  path: beta_mno2.poscar
  description: CIF file for β-MnO₂ (pyrolusite, rutile-type structure, space group P4₂/mnm).
reference_answers:
- key: artifact_structure
  value: beta_mno2_li.cif
- key: artifact_analysis
  value: site_analysis.txt
- key: contains_li
  value:
    flags: ''
    tokens:
    - Li
    filename: beta_mno2_li.cif
- key: formula_check
  value:
    flags: ''
    tokens:
