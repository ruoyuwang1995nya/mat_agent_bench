id: IG_incar_004_20260508
capability: input_generation
domain: agnostic
intent: 'Generate VASP INCAR for HSE06 hybrid functional calculation of MOF C30H22N4O10Zn2.
  Accurate electronic structure and band gap.

  '
human_prompt_seed: 为金属有机框架(MOF) C30H22N4O10Zn2 生成一个 HSE06 杂化泛函静态计算的 VASP INCAR。需要精确的电子结构和带隙。
  将完整的 INCAR 写入当前目录下的 `INCAR` 文件。
tags:
- eng_vasp
reference_answers:
- key: incar_artifact
  value: INCAR
- key: incar_critical_tokens
  value:
    filename: INCAR
    tokens:
    - HFSCREEN
    - LHFCALC
    - IVDW
    flags: i
- key: critical_HFSCREEN
  value:
    filename: INCAR
    pattern: ^\s*HFSCREEN\s*=\s*\S+
    flags: im
- key: critical_LHFCALC
  value:
    filename: INCAR
    pattern: ^\s*LHFCALC\s*=\s*\.?(?:TRUE|T)\.?
    flags: im
- key: optional_NSW
  value:
    filename: INCAR
    pattern: (?ims)\A(?!.*^\s*NSW\s*=)(?:.|\n)*\Z|^\s*NSW\s*=\s*0\b
    flags: im
- key: turn_budget
  value:
    max: 8
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 15000
- key: reasonable_params
  value:
    filename: INCAR
- key: critical_IVDW
  value:
    filename: INCAR
    pattern: ^\s*IVDW\s*=\s*(?:11|12)\b
    flags: im
- key: correct_ISMEAR_semiconductor
  value:
    filename: INCAR
    pattern: ^\s*ISMEAR\s*=\s*(0|-5)\b
    flags: im
scoring_checklist:
- id: incar_artifact
  criterion: INCAR file is generated.
  axis: correctness
  verify: artifact_exists
- id: incar_critical_tokens
  criterion: INCAR contains all critical parameter keywords.
  axis: correctness
  verify: text_file_contains_all
- id: critical_HFSCREEN
  criterion: INCAR sets HFSCREEN = 0.2 (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_LHFCALC
  criterion: INCAR sets LHFCALC = .TRUE. (critical param).
  axis: correctness
  verify: text_file_regex
- id: optional_NSW
  criterion: INCAR may omit NSW; if provided, it must be NSW = 0.
  axis: correctness
  verify: text_file_regex
- id: reasonable_params
  criterion: The INCAR uses physically reasonable general settings for a VASP hybrid
    DFT (HSE06) calculation. ENCUT is present (unless not relevant), EDIFF is present
    with a reasonable value, PREC is set. Machine-specific params (KPAR, NCORE, NPAR)
    are optional and should not be penalized if absent or different from reference.
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: The generated INCAR is grounded in the provided prompt data (material
    system, calculation type, critical parameters) rather than hallucinated. Judge
    solely from the final answer and stated file content; do not fail because the
    tool-call log omits MCP, web_search, or any specific tool.
  axis: grounding
  verify: llm_binary_judge
- id: correct_ISMEAR_semiconductor
  criterion: INCAR sets ISMEAR = 0 (Gaussian) or ISMEAR = -5 (tetrahedron) which are
    appropriate for semiconductors/insulators with a band gap. Positive ISMEAR values
    (Methfessel-Paxton, for metals) must not be used.
  axis: correctness
  verify: text_file_regex
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: efficiency_judge
  criterion: The agent produced the INCAR efficiently without unnecessary tool calls,
    redundant queries, or irrelevant exploration.
  axis: efficiency
  verify: llm_binary_judge
- id: duration_budget
  criterion: Wall-clock run duration does not exceed benchmark ceiling.
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
- id: critical_IVDW
  criterion: INCAR sets IVDW = 11 or 12 (critical param).
  axis: correctness
  verify: text_file_regex
