id: IG_incar_010_20260508
capability: input_generation
domain: agnostic
intent: 'Generate VASP INCAR for spin-orbit coupling calculation of heavy-element
  halide Br6H6Pb2S2. Pb SOC is significant.

  '
human_prompt_seed: 为含重元素 Pb 的卤化物 Br6H6Pb2S2 生成一个 自旋轨道耦合(SOC)计算的 VASP INCAR。Pb 的 SOC
  效应显著，需要高精度设置。 将完整的 INCAR 写入当前目录下的 `INCAR` 文件。
tags:
- eng_vasp
reference_answers:
- key: incar_artifact
  value: INCAR
- key: incar_critical_tokens
  value:
    filename: INCAR
    tokens:
    - ENCUT
    - ISPIN
    - ISYM
    - LMAXMIX
    - LSORBIT
    - PREC
    flags: i
- key: critical_ENCUT
  value:
    filename: INCAR
    pattern: ^\s*ENCUT\s*=\s*(?:[3-6]\d{2}|700)(?:\.\d+)?\b
    flags: im
- key: critical_ISPIN
  value:
    filename: INCAR
    pattern: ^\s*ISPIN\s*=\s*2\b
    flags: im
- key: critical_ISYM
  value:
    filename: INCAR
    pattern: ^\s*ISYM\s*=\s*0\b
    flags: im
- key: critical_LMAXMIX
  value:
    filename: INCAR
    pattern: ^\s*LMAXMIX\s*=\s*4\b
    flags: im
- key: critical_LSORBIT
  value:
    filename: INCAR
    pattern: ^\s*LSORBIT\s*=\s*\.?(?:TRUE|T)\.?
    flags: im
- key: critical_PREC
  value:
    filename: INCAR
    pattern: ^\s*PREC\s*=\s*Accurate\b
    flags: im
- key: critical_LNONCOLLINEAR
  value:
    filename: INCAR
    pattern: ^\s*LNONCOLLINEAR\s*=\s*\.?(?:TRUE|T)\.?
    flags: im
- key: turn_budget
  value:
    max: 8
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 15000
- key: reasonable_params
  value:
    filename: INCAR
scoring_checklist:
- id: incar_artifact
  criterion: INCAR file is generated.
  axis: correctness
  verify: artifact_exists
- id: incar_critical_tokens
  criterion: INCAR contains all critical parameter keywords.
  axis: correctness
  verify: text_file_contains_all
- id: critical_ENCUT
  criterion: INCAR sets ENCUT in the 300-700 eV range (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_ISPIN
  criterion: INCAR sets ISPIN = 2 (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_ISYM
  criterion: INCAR sets ISYM = 0 (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_LMAXMIX
  criterion: INCAR sets LMAXMIX = 4 (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_LSORBIT
  criterion: INCAR sets LSORBIT = .TRUE. (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_PREC
  criterion: INCAR sets PREC = Accurate (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_LNONCOLLINEAR
  criterion: INCAR sets LNONCOLLINEAR = .TRUE. as required for SOC calculations (LSORBIT
    implies non-collinear magnetism).
  axis: correctness
  verify: text_file_regex
- id: reasonable_params
  criterion: The INCAR uses physically reasonable general settings for a VASP SOC
    calculation. ENCUT is present (unless not relevant), EDIFF is present with a reasonable
    value, PREC is set. Machine-specific params (KPAR, NCORE, NPAR) are optional and
    should not be penalized if absent or different from reference.
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: The generated INCAR is grounded in the provided prompt data (material
    system, calculation type, critical parameters) rather than hallucinated. Judge
    solely from the final answer and stated file content; do not fail because the
    tool-call log omits MCP, web_search, or any specific tool.
  axis: grounding
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: efficiency_judge
  criterion: The agent produced the INCAR efficiently without unnecessary tool calls,
    redundant queries, or irrelevant exploration.
  axis: efficiency
  verify: llm_binary_judge
- id: duration_budget
  criterion: Wall-clock run duration does not exceed benchmark ceiling.
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
