  criterion: Agent writes `fig_spec.json` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: qc_metrics_artifact
  criterion: Agent writes `qc_metrics.json` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: qc_report_artifact
  criterion: Agent writes `data_qc_report.md` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: chart_priority_artifact
  criterion: Agent writes `chart_priority.md` to workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: fig_spec_required_tokens
  criterion: '`fig_spec.json` contains three chart types and is grounded in provided CSV column names.'
  verify: text_file_contains_all
  capability: data_handling
  weight: 0.5
- id: fig_spec_required_keys_regex
  criterion: '`fig_spec.json` includes complete chart-spec keys (`chart_type/x/y/group_by/title/reason`) in chart objects.'
  verify: text_file_regex
