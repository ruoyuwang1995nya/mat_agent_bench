id: PXRD_thermal_expansion_001_20260616
task_type: material_characterization
capabilities:
- scientific_reasoning
- scientific_grounding
domain: agnostic
difficulty: easy
intent: Perform Pawley refinement on variable-temperature PXRD patterns to extract lattice parameters at each 
  temperature, identify two structural phases (low-temperature RTP and high-temperature HTP), and fit linear thermal 
  expansion equations for each phase.
human_prompt_seed: 'The file `_td-pxrd_test.txt` contains variable-temperature powder X-ray diffraction (PXRD) data for a compound at 8 temperatures, with the temperature-label mapping: 30°C→303K, 50°C→323K, 70°C→343K, 90°C→363K, 110°C→383K, 120°C→393K, 130°C→403K, and 140°C→413K. The compound is monoclinic, with an indicated space group of P 21 (No. 4), and the wavelength is Cu Kα1, λ = 1.5406 Å.

  Data characteristics and refinement strategy: - the data are real variable-temperature experimental data, with a pre-background-subtraction dynamic range of about 10×–30×; the 2θ range is 5°–50°, and it is recommended to use the 14°–50° range in refinement to avoid low-angle artifacts. - It is recommended to split the data by phase (4 RTP points and 4 HTP points) and refine them separately, enabling chain-cell within each phase (using the refined result from the previous temperature as the initial guess for the next one). - Within the same phase, the volume/cell parameters should vary monotonically or approximately monotonically with temperature; if the refined V at some temperature jumps by more than 5% relative to neighboring temperatures, it should be treated as convergence to a wrong basin (possibly a √2 or 2× false solution), and reinitialized from neighboring-temperature results or re-refined with multiple starts.

  Runtime budget (important): this task has a hard wall-clock limit of 1200 s (online task timeout). Please use the following Pawley refinement settings to balance stability and time limit: - use `--multi-start 1` (one chain per phase is enough; niggli standardization + bidirectional chain-cell already covers the vast majority of wrong basins, so brute-force 5×/8× multi-start is unnecessary; the scripts default `--self-heal-chain` will automatically re-refine single points with V jumps >2% using 5-start multi-start after chain merge, which is sufficient to catch occasional failures); - use `--chain-cell --chain-cell-direction both` (the script internally performs forward/backward merge and volume-consistency arbitration); - use `--standardize-cell ref` (perform axis permutation + niggli reduction based on the reference cell, to avoid equivalent-setting switching in monoclinic/orthorhombic and similar systems); - you must **submit the RTP and HTP Bohrium jobs in parallel first** (issue two `Bohrium(action=''submit'')` calls at once; **do not submit RTP → wait for results → then submit HTP**), and then loop with `poll`; serial submission will almost certainly time out because each single job takes 8–12 min. - **Do not launch any new Bohrium refinement job after obtaining `results.json`**: the scripts built-in `chain-cell` + `standardize-cell` + `self-heal-chain` has already handled neighbor-volume consistency and wrong-basin single-point re-refinement; on the agent side you only need to read `results` / `merge_audit` / `self_heal_audit`, perform the final phase grouping and linear fitting, and write the answer directly. Resubmitting Bohrium even once will consume another 8–12 min and will almost certainly time out.

  Literature reference cells (used as the initial guesses for Pawley refinement for each phase, followed by free refinement; c and β are sensitive parameters for the monoclinic structure, and the following literature values have been checked for each phase): - low-temperature phase RTP (303K–363K): a ≈ 10.83 Å, b ≈ 9.62 Å, c ≈ 10.13 Å, β ≈ 108.75°, V ≈ 1000 Å³ - high-temperature phase HTP (383K–413K): a ≈ 11.05 Å, b ≈ 9.48 Å, c ≈ 10.48 Å, β ≈ 111.25°, V ≈ 1023 Å³

  Please perform Pawley refinement on the PXRD pattern at each temperature, extract the lattice parameters (a, b, c, β, V), and analyze the results: 1. Identify the two structural phases: low-temperature phase (1-RTP, 303K–363K) and high-temperature phase (1-HTP, 383K–413K). 2. Fit the temperature dependence of each lattice parameter (a, b, c, β, V) linearly for the two phases separately, and provide the fitting equations (slope, intercept, R²). The two phases must be fitted independently rather than merged into a single line, and the RTP and HTP slopes must each be calculated from the four temperature points within that phase (do not let the two phases share the same slope). 3. Report the refinement result at each temperature. For every temperature, you must use the Pawley script (such as `gsas2_pawley.py`) and use the true volume from the output JSON (computed from the converged a/b/c/β), rather than filling in the answer with the approximate initial guesses from the prompt (V ≈ 1000, 1023 Å³).

  [Machine-scoring convention] At the end of the final answer, append a JSON block wrapped in an eval_results tag (values without units; conventional units are Å / Å³ / Å·K⁻¹ / Å³·K⁻¹), which must include at least the following dot-paths (other fields such as additional temperatures, b/beta, intercept, and r_squared may be added as needed; fits are 4-point linear fits within the same phase, and RTP and HTP must be independent):

  - rtp.{303K,363K}.V，rtp.303K.a，rtp.fits.V.slope，rtp.fits.a.slope - htp.{383K,413K}.V，htp.383K.a，htp.fits.V.slope，htp.fits.c.slope

  The values must come from actual Pawley refinement and linear fitting, and must not be filled in using the approximate initial guesses from the prompt.

  In the final answer, also use 2–4 sentences to briefly summarize the audit information: - refinement-quality audit: whether `curation.verdict` / `warnings` indicate any issues; whether `merge_audit.warnings` or `self_heal_audit.outliers` are empty, and if not, which temperature points are affected. - Bohrium execution audit: how many `Bohrium(action=''submit'')` calls were made in total (should be ≤3 for this task); whether the submission command used `cmd=''bash run.sh > log 2>&1''`; whether each result directory was confirmed to contain both `log` and `results.json` after download; and whether the results came from `gsas2_pawley.py` run on Bohrium rather than a local scipy/numpy approximate fit. '
