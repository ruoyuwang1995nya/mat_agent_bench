intent: Compute Pd(111) work function with ABACUS under a z-direction vacuum setup and summarize key computational 
  settings and output.
human_prompt_seed: "Compute the work function of the Pd(111) surface (mock version):\n1. First query/retrieve the input
  files needed for Pd bulk and Pd(111) slab modeling, and confirm the vacuum-direction constraint;\n2. List the key
  settings (exchange-correlation functional, calculation mode, vacuum direction, and whether relaxation is performed);\n3.
  Do not run a real ABACUS calculation. Instead, use the following mock results:\n   - work_function_eV = 5.43\n   -
  vacuum_direction = z\n   - functional = PBE\n   - calculation_mode = SCF\n4. Based on the above values, complete the
  post-processing and interpret the conclusions.\n\nPlease provide the following deliverables:\n1) `pd111_work_function.json`:
  containing at least `input_files`, `work_function_eV`, `vacuum_direction`, `functional`, `calculation_mode`, and
  `notes`;\n2) `pd111_work_function_report.md`: explain the query-based input organization, the mock post-processing workflow,
  and the interpretation of the results.\n\nIn the final answer, explicitly provide the work-function value (eV) and
  confirm that `vacuum_direction = z`.\n"
