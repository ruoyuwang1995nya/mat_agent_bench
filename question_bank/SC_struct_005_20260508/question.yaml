id: SC_struct_005_20260508
task_type: simulation
capabilities:
- structure_manipulation
domain: agnostic
intent: Infer SG-derived chemical formulas for 5 disordered crystal structures and construct ordered replicas to assess 
  3D structure perception.
human_prompt_seed: '对以下 5 个含无序占位的晶体结构逐一处理，所有输入都通过 OSS URL 提供：

  - `disorder_DAN-2.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_DAN-2.cif`

  - `disorder_DAP-4.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_DAP-4.cif`

  - `disorder_PAP-H4.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_PAP-H4.cif`

  - `disorder_PAP-M5.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_PAP-M5.cif`

  - `disorder_TILPEN.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_TILPEN.cif`


  对每个结构，使用结构生成工具构造 ordered replica，并汇总：

  (1) `chemical_formula`（尽量保持工具/结构解析返回的原始字符串）；

  (2) `is_disordered`；

  (3) `ordered_replica_count`；

  (4) `ordered_output_archive`。


  对 `disorder_DAN-2.cif` 的 ordered replica：`chemical_formula` 必须为**整数化学计量**（不得再出现类似 `H13.98` 这类分数占位形式的计数）。

  每个结构的 ordered replica 输出文件命名为 `ordered_<原始文件名>.cif`（例如 `ordered_disorder_DAN-2.cif`）。

  所有 ordered replica 必须是完全有序结构：输出 CIF 中所有 `_atom_site_occupancy` 均为 1，不得保留 partial/split occupancy。

  最终答案按文件名逐项列出上述信息，并显式写出每个原始文件名与对应 `ordered_<原始文件名>.cif` 的配对。

  '
tags:
- struct_molcrys
reference_answers:
- key: structures_processed
  value:
    pattern: ordered_*.cif
    expected: 5
    tolerance: 0
- key: ordered_files_parsable
  value:
    filename: ordered_*.cif
- key: ordered_files_occupancy_one
  value:
    filename: ordered_*.cif
    tolerance: 1.0e-06
- key: ordered_file_name_mapping
  value:
  - disorder_DAN-2.cif
  - disorder_DAP-4.cif
  - disorder_PAP-H4.cif
  - disorder_PAP-M5.cif
  - disorder_TILPEN.cif
  - ordered_disorder_DAN-2.cif
  - ordered_disorder_DAP-4.cif
  - ordered_disorder_PAP-H4.cif
  - ordered_disorder_PAP-M5.cif
  - ordered_disorder_TILPEN.cif
- key: sc005_disorder_formulas
  value: {}
- key: required_fields
  value:
  - chemical_formula
  - is_disordered
  - ordered_replica_count
  - ordered_output_archive
- key: ordered_integer_stoichiometry
  value:
    filename: ordered_*.cif
- key: ordered_replicas_distinct
  value:
    filename: ordered_*.cif
scoring_checklist:
- id: structures_processed
  criterion: All 5 disordered structures are processed (verified by counting ordered-replica output files in workspace).
  axis: correctness
  verify: struct_file_count
  capability: structure_manipulation
  weight: 0.5
- id: ordered_files_parsable
  criterion: All `ordered_*.cif` deliverables can be parsed as structure files.
  axis: correctness
  verify: struct_file_parsable
  capability: structure_manipulation
  weight: 0.5
- id: ordered_files_occupancy_one
  criterion: Every ordered-replica CIF has only occupancy-1 sites; no partial or split occupancies remain in 
    `_atom_site_occupancy`.
  axis: correctness
  verify: struct_file_all_occupancy_one
  capability: structure_manipulation
  weight: 0.5
- id: sc005_disorder_formulas
  criterion: The answer includes the four reference formula strings for DAP-4, PAP-H4, PAP-M5, and TILPEN; for DAN-2 the
    reported ordered-replica chemical_formula uses integer stoichiometry only (no fractional occupancies like 13.98 in 
    counts).
  axis: correctness
  verify: sc005_disorder_formulas
  weight: 0.5
  capability: structure_manipulation
- id: partial_formulas_ok
  criterion: The answer reports chemically plausible ordered-replica formulas for at least 3 of the 5 structures. 
    Reference formulas — DAP-4 H144C48N24Cl24O96, PAP-H4 H288C80N48Cl48O192, PAP-M5 Ag8H112C40N16Cl24O96, TILPEN 
    Fe2H40C24N16O2, DAN-2 integer-only stoichiometry. Pass if ≥3 formulas are present and correct (element ordering may 
    differ).
  axis: correctness
  verify: llm_binary_judge
  weight: 0.5
  capability: scientific_reasoning
- id: required_fields
  criterion: Each filename is paired with chemical_formula, is_disordered, ordered_replica_count, and 
    ordered_output_archive.
  axis: correctness
  verify: llm_binary_judge
  capability: data_handling
  weight: 0.5
- id: ordered_file_name_mapping
  criterion: Final answer explicitly names all five input CIF basenames and the five corresponding 
    `ordered_<basename>.cif` output files.
  axis: correctness
  verify: contains_all
  capability: data_handling
  weight: 0.5
- id: ordered_integer_stoichiometry
  criterion: The chemical formula of each ordered replica has integer atom counts (no fractional like H13.98 or Li0.5).
  axis: correctness
  verify: struct_file_integer_stoichiometry
  weight: 0.5
  capability: structure_manipulation
- id: ordered_replicas_distinct
  criterion: When multiple ordered replicas are generated for the same structure, they are structurally distinct 
    (different atom arrangements, not identical copies).
  axis: correctness
  verify: struct_file_replicas_distinct
  weight: 0.5
  capability: structure_manipulation
- id: grounding_source
  criterion: The answer explains the physical/chemical basis for each structure (disorder/occupancy, connectivity, 
    valence or charge balance, and what changes when building an ordered replica), tied to the named CIFs and delivered 
    outputs, not only restating task text without structural basis. Judge solely from the final answer and named 
    deliverables; do not fail because the tool-call log omits MCP, web_search, or any specific tool.
  axis: grounding
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
