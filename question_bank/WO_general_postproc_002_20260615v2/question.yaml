id: WO_general_postproc_002_20260615v2
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: agnostic
difficulty: easy
intent: Produce structured post-processing pipeline artifacts with per-stage validation gates and rerun policy.
human_prompt_seed: 'The workspace already provides `result_manifest.json`.


  Please read this file first, then generate:

  1) `postproc_pipeline.json`: provide a step-by-step post-processing workflow (including inputs, outputs, checkpoints,
  and failure points).

  2) `report_outline.md`: list the structure of the final report in terms of figures/tables/explanatory text.

  3) `rerun_policy.md`: define under which failure modes reruns should occur and how the deliverable should be downgraded.


  Requirement: the workflow must cover the three post-processing targets of band structure, MSD, and probability density.

  '
tags: []
data_files:
- key: result_manifest
  path: result_manifest.json
  oss_url: ''
  description: Post-processing target manifest.
reference_answers:
- key: pipeline_artifact
  value: postproc_pipeline.json
- key: outline_artifact
  value: report_outline.md
- key: rerun_artifact
  value: rerun_policy.md
- key: pipeline_required_tokens
  value:
    filename: postproc_pipeline.json
    tokens:
    - band
    - msd
    - density
    - input
    - output
    - checkpoint
    - failure_mode
    flags: i
- key: outline_required_tokens
  value:
    filename: report_outline.md
    must_cover:
