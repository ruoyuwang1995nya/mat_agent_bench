intent: Build a multi-component Fe-Ni-Co-Cr-V alloy structure from an fcc-Ni 5x5x5 supercell template and report 
  composition constraints.
human_prompt_seed: 'Please build an Fe-Ni-Co-Cr-V alloy structure and export it as `alloy_5x5x5_feni_cocrv.cif`.

  Target composition ratio (atomic fraction): Fe:Ni:Co:Cr:V = 0.635:0.165:0.10:0.05:0.05.

  Requirements: 1) use fcc-Ni as the template and build a 5×5×5 supercell before performing substitutional doping; 2) generate `alloy_composition_report.json`, containing at least `template`, `supercell`, `target_ratio`, `element_counts`, and `notes`; 3) explain in the final answer how the target ratios are mapped to integer atom counts, and note any possible rounding deviations.

  '
