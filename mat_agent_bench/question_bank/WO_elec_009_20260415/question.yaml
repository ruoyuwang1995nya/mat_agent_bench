id: WO_elec_009_20260415
capability: workflow_orchestration
domain: semiconductor
intent: Compute Si phonon dispersion with ABACUS (including relaxation step) and summarize
  key spectrum outcomes.
human_prompt_seed: "计算 Si 的声子特征（Mock版）：\n1. 先 query/检索并梳理本任务所需输入文件（结构文件、参数文件、声子相关输入）；\n\
  2. 给出你会采用的声子设置（k 路径/采样、超胞或最小长度、位移步长）；\n3. 不做真实 ABACUS 计算，使用以下 mock 结果进行后处理：\n  \
  \ - supercell_or_min_length = \"3x3x3\"\n   - displacement_step = 0.01\n   - gamma_optical_frequency_THz\
  \ = 15.6\n   - imaginary_mode_check = false\n4. 汇总是否存在虚频，并给出结果可信度与不确定性说明。\n\n请完成以下交付：\n\
  1) `si_phonon_abacus.json`：至少包含 `input_files`, `kpath_or_sampling`, `supercell_or_min_length`,\
  \ `displacement_step`, `imaginary_mode_check`, `key_frequency_summary`；\n2) `si_phonon_abacus_report.md`：说明\
  \ query 输入梳理 + mock 后处理流程、关键结论与不确定性。\n\n最终回答请简要说明是否出现虚频，并标注为 mock 后处理结论。\n"
tags:
- eng_abacus
data_files: []
reference_answers:
- key: phonon_json
  value: si_phonon_abacus.json
- key: phonon_report
  value: si_phonon_abacus_report.md
- key: json_required_tokens
  value:
    filename: si_phonon_abacus.json
    must_cover:
    - displacement_step
    - imaginary_mode_check
    - key_frequency_summary
    - supercell_or_min_length
- key: report_required_tokens
  value:
    filename: si_phonon_abacus_report.md
    must_cover:
    - Si
    - ABACUS
    - phonon
    - 优化
    - 虚频
    - 不确定性
- key: gamma_freq_mock
  value: 15.6
  tolerance: 1.0
- key: turn_budget
  value:
    max: 18
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 9000
scoring_checklist:
