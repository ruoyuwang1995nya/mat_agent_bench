id: SR_db_006_20260416v1
task_type: search_and_interpretation
capabilities:
- tool_utilization
- scientific_reasoning
domain: agnostic
intent: Retrieve up to two Ti-Al-O compounds with space group 63 and export CIF-oriented retrieval metadata.
human_prompt_seed: '从 Materials Project 检索并返回不超过 2 个化合物，约束如下：

  - 仅包含元素 Ti、Al、O（不含其他元素）； - 空间群编号为 63； - 输出支持 CIF 文件导出信息。

  请完成以下交付：

  1) `tao_spg63_candidates.json`：至少包含 `rank`, `formula`, `space_group`, `elements`, `structure_identifier`, `cif_link_or_path`；
  2) `tao_spg63_report.md`：说明检索条件、结果数量上限约束（<=2）以及筛选不确定性。

  最终回答中简要确认是否满足“元素集合 + 空间群 + 数量上限”三项约束。'
tags:
- meta_database
data_files: []
reference_answers:
- key: candidates_json
  value: tao_spg63_candidates.json
- key: retrieval_report
  value: tao_spg63_report.md
- key: candidates_required_tokens
  value:
    filename: tao_spg63_candidates.json
    tokens:
    - rank
    - formula
    - space_group
    - elements
    - structure_identifier
    - cif_link_or_path
    - Ti
    - Al
    - O
    - '63'
    flags: i
- key: report_required_tokens
  value:
    filename: tao_spg63_report.md
    tokens:
    - Materials Project
    - Ti
    - Al
    - O
    - 63
    - <=2
    - 不确定性
    flags: i
