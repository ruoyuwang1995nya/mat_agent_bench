  capability: workflow_orchestration
  domain: agnostic
  intent: Perform ABACUS Bader charge analysis for Al2O3 and summarize per-atom charge transfer
    evidence.
  human_prompt_seed: "对 Al2O3 执行 Bader 电荷分析（Mock版）：\n1. 先 query/检索并整理 Bader 分析所需输入文件（结构、电子密度、分割相关输入）；\n\
    2. 明确分析目标：比较 Al 与 O 的电荷转移方向与幅度；\n3. 不做真实计算，使用以下 mock 统计值：\n   - Al 平均 Bader 电荷 = +2.31\
    \ e\n   - O 平均 Bader 电荷 = -1.54 e\n   - 净电荷守恒误差 < 0.01 e\n4. 基于 mock 值产出后处理摘要与结论。\n\n\
    请完成以下交付：\n1) `al2o3_bader_summary.json`：至少包含 `input_files`, `atom_index`, `element`, `bader_charge`,\
    \ `charge_transfer`；\n2) `al2o3_bader_report.md`：说明 query 输入梳理、mock 后处理流程、主要电荷转移趋势与不确定性。\n\
    \n最终回答中请简要总结 Al 与 O 的电荷转移方向，并标注为 mock 后处理结果。\n"
