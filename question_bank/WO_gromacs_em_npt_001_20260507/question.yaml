id: WO_gromacs_em_npt_001_20260507
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: agnostic
intent: Submit GROMACS energy minimization and NPT equilibration on Bohrium, verify
  convergence and output structure.
human_prompt_seed: '对提供的 SPC 水盒子体系执行 GROMACS 能量最小化 + NPT 平衡模拟。

  已提供文件： - `conf.gro`: 216 个 SPC 水分子的初始坐标 - `topol.top`: 拓扑文件 - `em.mdp`: 能量最小化参数
  - `npt.mdp`: NPT 平衡参数（2 ns, 298.15 K, 1 bar）

  请完成以下步骤： 1) 在 Bohrium GROMACS 镜像上提交能量最小化（EM），确认 Fmax < 1000 kJ/mol/nm 2) 用 EM 输出作为
  NPT 输入，提交 NPT 平衡 3) 输出最终结构 `npt_final.gro` 到工作目录

  在最终回答中报告：EM 收敛步数、NPT 最终密度 (g/cm³)。'
tags:
- eng_gromacs
data_files:
- key: conf_gro
  path: conf.gro
  description: Initial SPC water box coordinates (216 waters)
- key: topol_top
  path: topol.top
  description: GROMACS topology file
- key: em_mdp
  path: em.mdp
  description: Energy minimization parameters
- key: npt_mdp
  path: npt.mdp
  description: NPT equilibration parameters
reference_answers:
- key: npt_output
  value: npt_final.gro
- key: turn_budget
  value:
    max: 25
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 30000
scoring_checklist:
- id: npt_output
  criterion: Agent produces `npt_final.gro` in the workspace.
  axis: correctness
  verify: artifact_exists
- id: em_convergence
  criterion: Final answer reports EM convergence (steps and Fmax < 1000).
  axis: correctness
  verify: llm_binary_judge
- id: npt_density
  criterion: Final answer reports NPT equilibrium density close to 1.0 g/cm³ (within
    ±0.1 for SPC water at 298K).
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: The reported density and convergence values come from actual GROMACS
    output logs, not textbook recall.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: No repeated identical Bohrium submissions.
  axis: efficiency
  verify: no_retries
- id: turn_budget
  criterion: Agent completes within turn budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock duration within budget.
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage within budget.
  axis: efficiency
  verify: token_budget
