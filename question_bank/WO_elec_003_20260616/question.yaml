human_prompt_seed: "Compute the Al-doping formation energy of NFPP:\n1. Retrieve the NFPP (Na₄Fe₃(PO₄)₂P₂O₇) structure (space group Pna2₁) and build a 2×1×1 supercell as the pristine structure.\n2. Replace one P atom at a P site (the PO₄ phosphate site) with Al to construct the doped supercell.\n\
  3. Use the following mock energies (simulating DPA-relaxed results):\n   - E_pristine = -689.605 eV\n   - E_doped = -687.057 eV\n   - μ_P (red phosphorus reference state) = -5.41 eV/atom\n\
  \   - μ_Al (metallic Al reference state) = -3.75 eV/atom\n4. Compute the formation energy using E_f = E(doped) - E(pristine) + μ_P - μ_Al.\n5. Compute the volume change ratio (doped volume about 1313.17 Å³, pristine volume about 1316.68 Å³).\n6. Report the doping formation energy (eV) and the volume change ratio (%).\n"
