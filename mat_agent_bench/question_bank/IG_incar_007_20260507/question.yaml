id: IG_incar_007_20260507
capability: input_generation
domain: agnostic
intent: 'Generate VASP INCAR for Born-Oppenheimer molecular dynamics of Heusler alloy
  MnNaPm2. Mn is magnetic; timestep 0.5 fs.

  '
human_prompt_seed: 为 Heusler 合金 MnNaPm2 生成一个分子动力学(MD) 计算的 VASP INCAR。Mn 含磁性，需要自旋极化。MD
  时间步长设为 0.5 fs。 将完整的 INCAR 写入当前目录下的 `INCAR` 文件。
tags:
- eng_vasp
reference_answers:
- key: incar_artifact
  value: INCAR
- key: incar_critical_tokens
  value:
    filename: INCAR
    tokens:
    - IBRION
    - ISPIN
    - ISYM
    - NSW
    - POTIM
    - SIGMA
    flags: i
- key: critical_IBRION
  value:
    filename: INCAR
    pattern: ^\s*IBRION\s*=\s*0\b
    flags: im
- key: critical_ISPIN
  value:
    filename: INCAR
    pattern: ^\s*ISPIN\s*=\s*2\b
    flags: im
- key: critical_ISYM
  value:
    filename: INCAR
    pattern: ^\s*ISYM\s*=\s*0\b
    flags: im
- key: critical_NSW
  value:
    filename: INCAR
    pattern: ^\s*NSW\s*=
    flags: im
- key: critical_POTIM
  value:
    filename: INCAR
    pattern: ^\s*POTIM\s*=\s*\S+
    flags: im
- key: critical_SIGMA
  value:
    filename: INCAR
    pattern: ^\s*SIGMA\s*=\s*\S+
    flags: im
- key: turn_budget
  value:
    max: 8
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 15000
- key: reasonable_params
  value:
    filename: INCAR
scoring_checklist:
