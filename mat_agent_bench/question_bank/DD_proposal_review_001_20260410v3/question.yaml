id: DD_proposal_review_001_20260410v3
capability: data_diagnosis
domain: agnostic
intent: Evaluate a proposal excerpt and produce structured scorecard, rationale, and
  risk-mitigation artifacts.
human_prompt_seed: '工作区已提供 `proposal_excerpt.md`。


  请先读取该文件，再生成：

  1) `review_scorecard.json`：包含 `innovation_score`, `importance_score`, `feasibility_score`,
  `total_score`, `funding_recommendation`。

  2) `review_rationale.md`：每个维度至少两条依据，并给出风险点与改进建议。

  3) `risk_mitigation.json`：至少包含 `top_risks`, `mitigation_actions`, `owner`, `priority`。


  约束：

  - 三个分项每项范围 0~30；

  - 总分范围 0~90；

  - 不要脱离给定文本做无依据结论。

  '
tags:
- meta_userlog
- meta_literature
- wf_postprocess
data_files:
- key: proposal_excerpt
  path: proposal_excerpt.md
  oss_url: ''
  description: Proposal excerpt for structured review scoring.
reference_answers:
- key: scorecard_artifact
  value: review_scorecard.json
- key: rationale_artifact
  value: review_rationale.md
- key: risk_artifact
  value: risk_mitigation.json
- key: scorecard_required_tokens
  value:
    filename: review_scorecard.json
    tokens:
    - innovation_score
    - importance_score
    - feasibility_score
    - total_score
    - funding_recommendation
    flags: i
- key: score_bounds_regex
  value:
    filename: review_scorecard.json
    pattern: (?is)"innovation_score"\s*:\s*(?:[12]?\d|30)\b.*"importance_score"\s*:\s*(?:[12]?\d|30)\b.*"feasibility_score"\s*:\s*(?:[12]?\d|30)\b.*"total_score"\s*:\s*(?:[1-8]?\d|90)\b
    flags: is
- key: rationale_required_tokens
  value:
    filename: review_rationale.md
    tokens:
    - 创新性
    - 重要性
    - 可执行性
    - 风险
    - 建议
    - 立项
    flags: i
- key: turn_budget
  value:
    max: 8
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 7000
scoring_checklist:
- id: scorecard_artifact
  criterion: Agent writes `review_scorecard.json` to workspace.
  axis: correctness
  verify: artifact_exists
- id: rationale_artifact
  criterion: Agent writes `review_rationale.md` to workspace.
  axis: correctness
  verify: artifact_exists
- id: risk_artifact
  criterion: Agent writes `risk_mitigation.json` to workspace.
  axis: correctness
  verify: artifact_exists
- id: scorecard_required_tokens
  criterion: Scorecard JSON includes required score and recommendation keys.
  axis: correctness
  verify: text_file_contains_all
- id: score_bounds_regex
  criterion: Score fields stay within required numeric ranges.
  axis: correctness
  verify: text_file_regex
- id: rationale_required_tokens
  criterion: Rationale includes all required dimensions, risks, suggestions, and recommendation
    statement.
  axis: correctness
  verify: text_file_contains_all
- id: grounding_source
  criterion: Judgments are grounded in `proposal_excerpt.md` rather than generic boilerplate.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: No repeated identical tool calls with the same parameter set.
  axis: efficiency
  verify: no_retries
- id: efficiency_judge
  criterion: Proposal assessment is concise and complete without unnecessary tangential
    exploration.
  axis: efficiency
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
  axis: efficiency
  verify: token_budget
