id: IG_incar_009_20260506
capability: input_generation
domain: agnostic
intent: 'Generate VASP INCAR for DFPT dielectric constant calculation of C8H12HfO4.
  Compute dielectric tensor and Born effective charges.

  '
human_prompt_seed: 为有机金属氧化物 C8H12HfO4 生成一个 DFPT(密度泛函微扰理论) 介电常数计算的 VASP INCAR。需要计算介电张量和
  Born 有效电荷。 将完整的 INCAR 写入当前目录下的 `INCAR` 文件。
tags:
- eng_vasp
reference_answers:
- key: incar_artifact
  value: INCAR
- key: incar_critical_tokens
  value:
    filename: INCAR
    tokens:
    - EDIFF
    - IBRION
    - LEPSILON
    flags: i
- key: critical_EDIFF
  value:
    filename: INCAR
    pattern: ^\s*EDIFF\s*=\s*\S+
    flags: im
- key: critical_IBRION
  value:
    filename: INCAR
    pattern: ^\s*IBRION\s*=\s*8\b
    flags: im
- key: critical_LEPSILON
  value:
    filename: INCAR
    pattern: ^\s*LEPSILON\s*=\s*\.?(?:TRUE|T)\.?
    flags: im
- key: turn_budget
  value:
    max: 8
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 15000
- key: reasonable_params
  value:
    filename: INCAR
scoring_checklist:
- id: incar_artifact
  criterion: INCAR file is generated.
  axis: correctness
  verify: artifact_exists
- id: incar_critical_tokens
  criterion: INCAR contains all critical parameter keywords.
  axis: correctness
  verify: text_file_contains_all
- id: critical_EDIFF
  criterion: INCAR sets EDIFF = 0.0001 (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_IBRION
  criterion: INCAR sets IBRION = 8 (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_LEPSILON
  criterion: INCAR sets LEPSILON = .TRUE. (critical param).
  axis: correctness
  verify: text_file_regex
- id: reasonable_params
  criterion: The INCAR uses physically reasonable general settings for a VASP DFPT/phonon
    calculation. ENCUT is present (unless not relevant), EDIFF is present with a reasonable
    value, PREC is set. Machine-specific params (KPAR, NCORE, NPAR) are optional and
    should not be penalized if absent or different from reference.
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: The generated INCAR is grounded in the provided prompt data (material
    system, calculation type, critical parameters) rather than hallucinated. Judge
    solely from the final answer and stated file content; do not fail because the
    tool-call log omits MCP, web_search, or any specific tool.
  axis: grounding
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: efficiency_judge
  criterion: The agent produced the INCAR efficiently without unnecessary tool calls,
    redundant queries, or irrelevant exploration.
  axis: efficiency
  verify: llm_binary_judge
- id: duration_budget
  criterion: Wall-clock run duration does not exceed benchmark ceiling.
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
