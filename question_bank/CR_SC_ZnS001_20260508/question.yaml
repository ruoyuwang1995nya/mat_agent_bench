scoring_checklist:
- id: file_exists
  criterion: The output file `ZnS_001_slab.cif` exists in the workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: slab_layer_count
  criterion: The number of distinct atomic z-planes in ZnS_001_slab.cif is approximately 5-9 (expected 7 ± 2), 
    consistent with 3 Zn-S bilayers of zinc-blende (001). Atoms within 0.5 Å along z are merged into one plane.
  verify: struct_file_layer_count
  capability: structure_manipulation
  weight: 0.5
- id: zn_s_ratio
  criterion: The output slab preserves Zn:S = 1:1 stoichiometry.
  verify: struct_file_stoichiometry_ratio
  capability: structure_manipulation
  weight: 0.5
- id: slab_atom_count
  criterion: The 3-bilayer 2x2x1 ZnS(001) slab contains exactly 24 atoms.
  verify: struct_file_atom_count
  capability: structure_manipulation
  weight: 0.5
- id: supercell_vacuum_ok
  criterion: 交付的 ZnS(001) slab 采用 2×2×1 扩胞，真空层 ≥15 Å；若只在答案中声明，必须与 `ZnS_001_slab.cif` 的晶胞尺寸和层厚说明一致。
  verify: llm_binary_judge
  weight: 0.5
  capability: structure_manipulation
- id: polar_handling
  criterion: 答案说明了 ZnS(001) 表面的极性问题，并至少提出一种合理的处理策略（如构建对称 slab、施加偶极修正等），所述策略与交付的结构文件一致。
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: tasker_type_identification
  criterion: The agent identifies ZnS(001) as a Tasker Type-3 polar surface (alternating Zn-only and S-only planes along
    [001] producing a net dipole moment), or equivalently states that the surface is polar due to its stacking of 
    mono-element charged layers.
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: polar_surface_remedy
  criterion: The agent explicitly discusses at least one physically motivated remedy for the Type-3 polarity — such as 
    constructing a symmetric slab with matching top/bottom terminations, applying a dipole correction in the vacuum, or 
    reconstructing/passivating the surface to quench the macroscopic dipole.
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
