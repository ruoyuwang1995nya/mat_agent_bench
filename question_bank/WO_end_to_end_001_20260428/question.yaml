intent: Complete an end-to-end workflow from structure retrieval to surface construction to input generation.
human_prompt_seed: '请完成以下端到端工作流：

  1. 从结构数据库中检索 TiO2 金红石结构（rutile，空间群 P4_2/mnm）

  2. 切出 (110) 表面 slab，3 层，2×1×1 扩胞，真空层 15 Å

  3. 为该 slab 生成 VASP 静态计算 INCAR（ENCUT=520, ISMEAR=0, SIGMA=0.05, NSW=0）

  输出三个文件：`tio2_bulk.cif`（体相）、`tio2_110_slab.cif`（slab）、`INCAR`。'
