intent: Compute Cu FCC single-vacancy migration barrier with DPA via NEB; report forward barrier energy.
human_prompt_seed: 'Compute the migration barrier of a single vacancy in FCC Cu.

  Retrieve or build the Cu FCC primitive cell from a database and expand it to a 3×3×3 supercell,

  remove one atom to form the vacancy structure as the initial state, and move a neighboring atom into the vacancy site to form the final state.

  Optimize the initial and final structures separately, then perform an NEB calculation using the DPA machine-learning potential (5 intermediate images).

  Report the forward migration barrier (eV) and the trend of the energy profile.

  '
