id: CR_SC_ZnS001_20260615v2
task_type: simulation
capabilities:
- structure_manipulation
domain: catalysis
difficulty: easy
intent: Build ZnS(001) polar surface slab with 3 layers and 2x2x1 supercell per doc 3.1.2.
human_prompt_seed: 'Build a ZnS compound (001) slab with 3 layers, a 2×2×1 supercell, and vacuum >=15 Å. If the surface
  is polar, explain whether a symmetric slab or a dipole-correction strategy is used. Output the slab structure file as
  `ZnS_001_slab.cif`, and briefly describe the surface termination and stoichiometry handling.

  '
tags:
- struct_surface
data_files: []
reference_answers:
- key: file_exists
  value: ZnS_001_slab.cif
- key: slab_layer_count
  value:
    filename: ZnS_001_slab.cif
    expected: 7
    tolerance: 2
    axis: z
    layer_tol_A: 0.5
- key: zn_s_ratio
  value:
    filename: ZnS_001_slab.cif
    element_a: Zn
    element_b: S
    expected_ratio: 1.0
    tolerance: 0.01
- key: slab_atom_count
  value:
    filename: ZnS_001_slab.cif
    expected: 24
    tolerance: 0
scoring_checklist:
- id: file_exists
  criterion: The output file `ZnS_001_slab.cif` exists in the workspace.
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: slab_layer_count
  criterion: The number of distinct atomic z-planes in ZnS_001_slab.cif is approximately 5-9 (expected 7 ± 2), 
    consistent with 3 Zn-S bilayers of zinc-blende (001). Atoms within 0.5 Å along z are merged into one plane.
  verify: struct_file_layer_count
  capability: structure_manipulation
  weight: 0.5
- id: zn_s_ratio
  criterion: The output slab preserves Zn:S = 1:1 stoichiometry.
  verify: struct_file_stoichiometry_ratio
  capability: structure_manipulation
  weight: 0.5
- id: slab_atom_count
  criterion: The 3-bilayer 2x2x1 ZnS(001) slab contains exactly 24 atoms.
  verify: struct_file_atom_count
  capability: structure_manipulation
  weight: 0.5
- id: supercell_vacuum_ok
  criterion: The delivered ZnS(001) slab uses a 2×2×1 supercell and a vacuum layer >=15 Å; if this is stated only in
    the answer, it must still be consistent with the cell dimensions and slab-thickness description of `ZnS_001_slab.cif`.
  verify: llm_binary_judge
  weight: 0.5
  capability: structure_manipulation
- id: polar_handling
  criterion: The answer explains the polarity issue of the ZnS(001) surface and proposes at least one reasonable treatment
    strategy (such as constructing a symmetric slab or applying a dipole correction), and the stated strategy is consistent
    with the delivered structure file.
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: tasker_type_identification
  criterion: The agent identifies ZnS(001) as a Tasker Type-3 polar surface (alternating Zn-only and S-only planes along
    [001] producing a net dipole moment), or equivalently states that the surface is polar due to its stacking of 
    mono-element charged layers.
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: polar_surface_remedy
  criterion: The agent explicitly discusses at least one physically motivated remedy for the Type-3 polarity — such as 
    constructing a symmetric slab with matching top/bottom terminations, applying a dipole correction in the vacuum, or 
    reconstructing/passivating the surface to quench the macroscopic dipole.
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
