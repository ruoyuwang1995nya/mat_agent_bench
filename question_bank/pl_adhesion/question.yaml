id: pl_adhesion
task_type: simulation
capabilities:
- scientific_reasoning
- scientific_grounding
domain: polymer
difficulty: easy
intent: Compare polyimide adhesion on hydroxyl-rich, epoxy-rich, and carboxyl-rich graphene-oxide surfaces using curated
  adsorption, MD, and adhesion-work evidence.
human_prompt_seed: 'The file `interface_adhesion_bundle.json` summarizes interface-project data for polyimide short chains on three types of graphene-oxide surfaces.

  Please complete an interfacial adhesion analysis report:

  1. Compare the adsorption energy, interfacial contact area, chain orientation, and work of adhesion under different surface-chemistry conditions.

  2. Explain which type of functional group is more beneficial for strengthening the interface.

  3. Provide the optimal surface-modification recommendation.

  4. State at least one possible scale-up risk.

  '
tags:
- phy_surface
data_files:
- key: interface_bundle
  path: interface_adhesion_bundle.json
  description: Interface bundle with adsorption energies, MD-derived contact descriptors, adhesion work, and 
    surface-chemistry ranking.
reference_answers:
- key: best_surface
  value: GO-COOH-rich
- key: cooh_adhesion_work_J_m2
  value: 0.81
  tolerance: 0.08
- key: cooh_adsorption_eV
  value: -1.48
  tolerance: 0.15
- key: required_fields
  value:
  - adhesion_table
  - orientation_discussion
  - surface_chemistry_mechanism
  - recommendation
  - scaleup_risk
scoring_checklist:
- id: cooh_adhesion_work_J_m2
  criterion: GO-COOH-rich adhesion work is reported within tolerance of the curated value (~0.81 J/m^2).
  verify: numerical_range
  capability: data_handling
  weight: 0.5
- id: cooh_adsorption_eV
  criterion: GO-COOH-rich adsorption energy is reported within tolerance of the curated value (~-1.48 eV).
  verify: numerical_range
  capability: data_handling
  weight: 0.5
- id: recommendation_correctness
  criterion: Final recommendation identifies GO-COOH-rich as the strongest adhesion surface and ranks GO-OH-rich ahead 
    of GO-epoxy-rich overall.
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: required_fields
  criterion: Report includes an adhesion table, orientation discussion, surface-chemistry mechanism, recommendation, and
    at least one scale-up risk.
  verify: llm_binary_judge
  capability: tool_utilization
  weight: 0.5
- id: grounding_source
  criterion: The answer grounds interface conclusions in the provided adsorption, contact-area, orientation, and 
    adhesion-work evidence from interface_adhesion_bundle.json.
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
