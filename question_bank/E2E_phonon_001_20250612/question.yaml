- data_handling
- structure_manipulation
domain: semiconductor
difficulty: hard
intent: 'Execute a complete phonon property benchmarking workflow starting from a crystal structure: geometry relaxation,
  phonon calculation, thermodynamic property extraction, and dynamical stability assessment.'
human_prompt_seed: Starting from the provided GaAs semiconductor crystal structure in poscar_initial.txt, perform a complete 
  phonon property characterization workflow using a universal machine learning interatomic potential. Determine the 
  equilibrium geometry, compute the phonon density of states, assess dynamical stability, and extract thermodynamic 
  properties (vibrational entropy, Helmholtz free energy, heat capacity) at 300 K. Report all results in 
  benchmark_results.json and document your workflow decisions in workflow_log.txt.
tags:
- phonon
- mlip
- workflow
- thermodynamics
- stability
data_files:
- key: structure
  path: poscar_initial.txt
  description: GaAs zincblende structure POSCAR file (initial, potentially slightly distorted)
reference_answers:
- key: results_exists
  value: benchmark_results.json
- key: results_structure
  value:
    checks:
    - key: relaxed_volume_A3
      max: 200
      min: 10
    - key: max_phonon_freq_K
      max: 2000
      min: 100
    - key: is_dynamically_stable
      allowed_values:
      - true
      - false
    - key: entropy_J_K_mol
      max: 100
      min: 0
    - key: free_energy_kJ_mol
      max: 100
      min: -100
    - key: heat_capacity_J_K_mol
      max: 50
      min: 0
    filename: benchmark_results.json
- key: workflow_exists
  value: workflow_log.txt
- key: workflow_content
  value:
    flags:
    - case_insensitive
    tokens:
