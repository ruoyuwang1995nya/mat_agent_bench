id: WO_mlip_dpa_004_20260411v2
task_type: simulation
capabilities:
- workflow_orchestration
- tool_utilization
domain: agnostic
intent: Run two-stage MD (NVT equilibration + NPT production) on Al FCC supercell
  with DPA; report average temperature and pressure.
human_prompt_seed: '对 FCC Al 进行分子动力学模拟。

  从数据库获取或构建 Al FCC 原胞，扩展为至少 2×2×2 超胞，

  使用 DPA 机器学习势按以下流程运行：

  1) NVT 平衡：300 K，2 ps

  2) NPT 采样：300 K，0 GPa，5 ps

  报告 NPT 阶段的平均温度 (K) 和平均压力 (GPa)。

  '
tags:
- code_mlip
- struct_transform
data_files: []
reference_answers:
- key: avg_temperature_K
  value: 300.0
  tolerance: 30.0
- key: required_fields
  value:
  - supercell_size
  - md_stages
  - avg_temperature
  - avg_pressure
- key: turn_budget
  value:
    max: 20
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 8000
scoring_checklist:
- id: avg_temperature_K
  criterion: NPT average temperature is within tolerance of target 300 K.
  axis: correctness
  verify: numerical_range
- id: required_fields
  criterion: Report includes supercell dimensions, MD stage definitions (NVT + NPT
    with parameters), average temperature, and average pressure from the NPT stage.
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: Temperature and pressure values are extracted from MD simulation outputs,
    not guessed. Judge solely from the final answer.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: No repeated identical MD submissions with the same parameters.
  axis: efficiency
  verify: no_retries
- id: efficiency_judge
  criterion: MD workflow (build supercell → configure stages → submit → parse thermo)
    completes without unnecessary exploration.
  axis: efficiency
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration does not exceed benchmark ceiling.
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
