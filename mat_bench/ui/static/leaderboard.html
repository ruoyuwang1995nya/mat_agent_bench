<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — mat-bench</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">MAT-BENCH</div>
    <div class="nav-links">
      <a href="/static/index.html">Home</a>
      <a href="/static/questions.html">Questions</a>
      <a href="/static/leaderboard.html" class="active">Leaderboard</a>
      <a href="/static/tokens.html">Agents</a>
    </div>
  </nav>

  <div class="page">
    <div class="page-header">
      <h1 class="page-title">Leaderboard</h1>
      <div style="display:flex;gap:.75rem;align-items:center">
        <select id="filter-cap" class="filter-select">
          <option value="">All capabilities</option>
          <option value="scientific_reasoning">scientific_reasoning</option>
          <option value="tool_utilization">tool_utilization</option>
          <option value="workflow_orchestration">workflow_orchestration</option>
          <option value="data_handling">data_handling</option>
          <option value="structure_manipulation">structure_manipulation</option>
          <option value="scientific_grounding">scientific_grounding</option>
        </select>
        <button class="btn" onclick="loadLeaderboard()">↻ Refresh</button>
      </div>
    </div>

    <!-- Summary stats -->
    <div class="stats-grid" style="max-width:100%;margin-bottom:1.5rem">
      <div class="stat-card">
        <div class="stat-value" id="stat-total-eval">—</div>
        <div class="stat-label">Total Evaluations</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-run-count">—</div>
        <div class="stat-label">Run Files</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-model-count">—</div>
        <div class="stat-label">Agents</div>
      </div>
    </div>

    <!-- Bar chart -->
    <div class="chart-wrap">
      <div class="chart-title" id="chart-title">Questions Passed by Agent</div>
      <canvas id="score-chart" height="100"></canvas>
    </div>

    <!-- Rankings table -->
    <div class="table-wrap">
      <table id="lb-table">
        <thead>
          <tr>
            <th style="width:50px;text-align:center">Rank</th>
            <th>Agent</th>
            <th style="width:140px">Questions Passed</th>
            <th style="width:90px;text-align:center">Evaluations</th>
            <th>Top Capabilities</th>
            <th style="width:130px;text-align:center">Actions</th>
          </tr>
        </thead>
        <tbody id="lb-body">
          <tr><td colspan="6" style="text-align:center;padding:3rem"><div class="spinner" style="margin:auto"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <!-- Per-agent question detail modal -->
  <div id="detail-modal" class="modal-overlay" style="display:none" onclick="closeModalOnBg(event)">
    <div class="modal-box">
      <div class="modal-header">
        <span id="modal-title" style="font-family:var(--font-data);font-size:.95rem"></span>
        <div style="display:flex;gap:.5rem">
          <button class="btn" id="modal-download" onclick="downloadCSV()">&#8659; CSV</button>
          <button class="btn" onclick="closeModal()">&#x2715;</button>
        </div>
      </div>
      <div id="modal-body" style="overflow:auto;max-height:60vh"></div>
    </div>
  </div>

  <!-- Per-agent radar chart modal -->
  <div id="radar-modal" class="modal-overlay" style="display:none" onclick="closeRadarOnBg(event)">
    <div class="modal-box" style="max-width:500px">
      <div class="modal-header">
        <span id="radar-modal-title" style="font-family:var(--font-data);font-size:.95rem"></span>
        <button class="btn" onclick="closeRadarModal()">&#x2715;</button>
      </div>
      <div style="padding:1.25rem 1rem">
        <canvas id="radar-chart"></canvas>
      </div>
    </div>
  </div>

  <script src="/static/js/leaderboard.js"></script>
</body>
</html>
