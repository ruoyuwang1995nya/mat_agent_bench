domain: alloy
intent: Optimize an alloy structure with APEX and summarize geometry-change evidence with machine-checkable artifacts.
human_prompt_seed: '使用 APEX 对给定合金结构执行几何优化，并输出优化结果。

  请完成以下交付：

  1) `alloy_optimized.cif`：优化后的结构文件； 2) `alloy_opt_summary.json`：至少包含 `method`, `input_structure`, `output_structure`, `optimization_status`,
  `notes`； 3) `alloy_opt_report.md`：说明优化目标、关键设置与结果可信度/不确定性。

  最终回答中简要说明：优化后结构相对输入结构的主要变化（可定性描述）。'
tags:
- code_mlip
data_files: []
reference_answers:
- key: optimized_structure
  value: alloy_optimized.cif
- key: summary_json
