    max: 14000
scoring_checklist:
- id: d18_gap_extrapolated_eV
  criterion: D18 extrapolated polymer-limit gap is reported within tolerance of the
    curated value (~1.84 eV).
  axis: correctness
  verify: numerical_range
- id: pm6_homo_eV
  criterion: PM6 HOMO is reported within tolerance of the curated oligomer/QM value
    (~-5.45 eV).
  axis: correctness
  verify: numerical_range
- id: shortlist_correctness
  criterion: Final shortlist identifies D18 as the best-balanced overall donor and
    places PM6 ahead of PTB7-Th and P3HT for the specified Y6-like acceptor window.
  axis: correctness
  verify: llm_binary_judge
- id: required_fields
  criterion: Report includes a ranking table, band-gap extrapolation discussion, conformational-planarity
    note, final shortlist, and at least one uncertainty note.
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: Conclusions are explicitly tied to the provided HOMO/LUMO, extrapolated
    gap, and torsional descriptors from donor_prescreen_bundle.json rather than literature
    recall alone.
  axis: grounding
  verify: llm_binary_judge
- id: efficiency_judge
  criterion: Completes donor pre-screening in a linear evidence-synthesis workflow
    without redundant analysis loops.
  axis: efficiency
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration does not exceed benchmark ceiling.
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
