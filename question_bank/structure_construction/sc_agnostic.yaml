version: v5
capability: structure_construction
domain: agnostic
questions:
- id: SR_db_003_20260411v3
  capability: structure_construction
  domain: agnostic
  intent: Generate and summarize candidate crystal structures under explicit superconducting constraints.
  human_prompt_seed: '按“超导临界温度大于 40 K、空间群编号为 225”使用工具生成 10 个候选晶体结构。


    请完成以下交付：

    1) `candidate_structures.json`：列出 10 个候选，每个候选至少包含 `rank`, `formula`, `space_group`, `selection_basis`,
    `structure_identifier`；

    2) `screening_report.md`：说明你使用了哪些筛选条件、是否真的找到了 10 个候选、如果不足 10 个是如何如实报告的；

    3) 在最终回答中总结：候选数是否满足要求，筛选中最可能出现的不确定性是什么。


    注意：
    - 本题是结构生成题，不是数据库检索题；
    - 不要把重点放在后续计算，重点是候选生成结果与汇总。

    '
  tags:
  - wf_batch
  - meta_userlog
  data_files: []
  reference_answers:
  - key: candidate_json
    value: candidate_structures.json
  - key: screening_report
    value: screening_report.md
  - key: candidate_required_tokens
    value:
      filename: candidate_structures.json
      tokens:
      - rank
      - formula
      - space_group
      - selection_basis
      - structure_identifier
      flags: i
  - key: screening_required_tokens
    value:
      filename: screening_report.md
      tokens:
      - Tc
      - 40
      - 225
      - 候选
      - 不确定性
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 9000
  scoring_checklist:
  - id: candidate_json
    criterion: Agent writes `candidate_structures.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: screening_report
    criterion: Agent writes `screening_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: candidate_required_tokens
    criterion: Candidate JSON includes ranking and required metadata fields for screened structures.
    axis: correctness
    verify: text_file_contains_all
  - id: screening_required_tokens
    criterion: Screening report explicitly states the Tc and space-group criteria, candidate-count
      handling, and uncertainty note.
    axis: correctness
    verify: text_file_contains_all
  - id: grounding_source
    criterion: The answer honestly reflects whether the generation step yields enough candidates and does not fabricate missing entries.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical screening calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: SC_struct_002_20260409
  capability: structure_construction
  domain: agnostic
  intent: Build a 4-layer (110) surface slab from the uploaded PUBMUU03 molecular crystal
    CIF and verify molecule integrity plus atom-count scaling.
  human_prompt_seed: '对以下通过 OSS URL 提供的 CIF 结构进行处理：

    - `surface_PUBMUU03.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/1774583701_surface_PUBMUU03.cif`


    任务：基于该结构切出 `(1, 1, 0)` 表面 slab，要求为 4 层。

    真空层不是重点，可以不特别说明或自行设定合理值。


    重点检查并在最终答案中明确报告：

    (1) 切面后分子是否被切断，并给出判断依据；

    (2) 输入单胞的原子数；

    (3) 最终 slab 的原子总数；

    (4) 是否满足"最终原子数 = 单胞原子数的 4 倍"。


    输出 slab 结构文件为 `slab_PUBMUU03_110.cif`，并给出上述核查结论。

    '
  tags:
  - phy_surface
  data_files: []
  reference_answers:
  - key: unit_cell_atoms
    value:
      filename: surface_PUBMUU03*
      expected: 144
      tolerance: 0
  - key: total_atoms
    value:
      filename: slab_PUBMUU03_110.cif
      expected: 576
      tolerance: 0
  - key: required_fields
    value:
    - structure_file
    - unit_cell_atoms
    - total_atoms
    - atom_count_ratio_check
    - molecule_integrity_check
  - key: molcrys_slab_molecular_integrity
    value:
      unit_cell_atoms: 144
      slab_atoms: 576
      layers: 4
  - key: turn_budget
    value: &id001
      max: 20
  - key: duration_budget
    value: &id002
      max: 7200000
  - key: token_budget_total
    value: &id003
      max: 24000
  scoring_checklist:
  - id: unit_cell_atoms
    criterion: The input unit cell atom count read from the downloaded CIF is 144 atoms.
    axis: correctness
    verify: struct_file_atom_count
  - id: total_atoms
    criterion: Total atom count read from the output slab CIF is 576 atoms (4 × 144).
    axis: correctness
    verify: struct_file_atom_count
  - id: molcrys_slab_molecular_integrity
    criterion: No molecules are cut by the slab cut (verified via MolCrysKit graph-based molecular
      integrity check on workspace CIF files).
    axis: correctness
    verify: molcrys_slab_molecular_integrity
  - id: required_fields
    criterion: Output includes structure file, unit-cell atom count, final atom count, an
      explicit 4x ratio check, and a molecule-integrity narrative consistent with MolCrysKit
      / connectivity reasoning.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The answer states what physical picture is used (molecular connectivity, periodic
      boundaries, (110) plane vs bulk, and how that supports or contradicts cutting molecules),
      citing the structures, not generic recall disconnected from those files. Judge solely
      from the final answer and named deliverables; do not fail because the tool-call log
      omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical slab or cut operations with wrong parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: The (110) slab construction and integrity check complete without excessive
      exploratory calls.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling
      (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
