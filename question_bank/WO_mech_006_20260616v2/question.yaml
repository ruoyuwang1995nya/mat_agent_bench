intent: Build the convex hull for a CuCrZr alloy and summarize stability interpretation artifacts.
human_prompt_seed: "Perform convex-hull stability analysis for CuCrZr (mock version):\n1. First query/retrieve and organize
  the input files and reference-phase information needed for convex-hull analysis;\n2. Explain the stability criterion
  (the relationship between hull distance and stability label);\n3. Do not run a real calculation. Instead, use the
  following mock results:\n   - hull_distance = 0.024 eV/atom\n   - stability_label = metastable\n   - reference_phases
  = [\"Cu\", \"Cr2Zr\", \"CuZr2\"]\n4. Based on the mock values, perform stability post-processing and interpret the conclusions.\n\nPlease
  provide the following deliverables:\n1) `cucrzr_convex_hull_summary.json`: containing at least `input_files`, `hull_distance`,
  `stability_label`, `reference_phases`, and `notes`;\n2) `cucrzr_convex_hull_report.md`: explain the query-based input
  organization, the mock post-processing workflow, the stability criterion, and the uncertainty.\n\nIn the final answer,
  explicitly state the qualitative thermodynamic-stability conclusion for this structure (stable / metastable / unstable).\n"
