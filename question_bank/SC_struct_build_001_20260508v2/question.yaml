id: SC_struct_build_001_20260508v2
capability: structure_construction
domain: agnostic
intent: Build FCC copper conventional cell using ASE bulk prototype and verify lattice
  constant, atom count, and space group.
human_prompt_seed: '构建 FCC 铜 (Cu) 的惯用晶胞结构，使用实验晶格常数 a = 3.615 Å。 导出为 `cu_fcc.cif`。在最终回答中明确报告：(1)
  晶格常数；(2) 空间群编号 #225 / Fm-3m；(3) 惯用晶胞中的原子数 4。'
tags:
- struct_build
data_files: []
reference_answers:
- key: file_exists
  value: cu_fcc.cif
- key: formula
  value:
    filename: cu_fcc.cif
    formula: Cu1
- key: cell_a
  value:
    filename: cu_fcc.cif
    param: a
    expected: 3.615
    tolerance: 0.02
- key: atom_count
  value:
    filename: cu_fcc.cif
    expected: 4
    tolerance: 0
- key: space_group_number
  value:
    filename: cu_fcc.cif
    expected_number: 225
    symprec: 0.1
- key: space_group_tokens
  value:
  - '225'
  - Fm-3m
- key: turn_budget
  value:
    max: 10
- key: token_budget_total
  value:
    max: 20000
scoring_checklist:
