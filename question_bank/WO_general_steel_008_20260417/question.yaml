id: WO_general_steel_008_20260417
capability: workflow_orchestration
domain: alloy
intent: Orchestrate Ni-content sweeps for duplex stainless-steel compositions, produce
  machine-checkable tensile predictions, and summarize trend plus uncertainty in a
  report.
human_prompt_seed: '研究 2209/ER2209 近似成分中 Ni 含量变化对抗拉强度预测的影响。

  请输出： 1) `duplex_ni_tensile_predictions.json`：至少包含 `formula`, `ni_content`, `predicted_uts`,
  `trend_label`； 2) `duplex_ni_tensile_analysis.md`：说明 Ni 含量变化导致强度变化的机理解释与不确定性。

  最终回答请给出”Ni 含量变化-强度变化”的总体趋势判断。'
tags:
- code_mlip
data_files: []
reference_answers:
- key: tensile_json
  value: duplex_ni_tensile_predictions.json
- key: analysis_md
  value: duplex_ni_tensile_analysis.md
- key: tensile_tokens
  value:
    filename: duplex_ni_tensile_predictions.json
    must_cover:
    - formula
    - ni_content
    - predicted_uts
    - trend_label
- key: analysis_tokens
  value:
    filename: duplex_ni_tensile_analysis.md
    must_cover:
    - Ni
    - 抗拉强度
    - 相比例
    - 不确定性
- key: turn_budget
  value:
    max: 14
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 8000
scoring_checklist:
