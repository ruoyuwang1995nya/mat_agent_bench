id: CR_WO_Ag_adsorption_20260412
capability: workflow_orchestration
domain: catalysis
intent: Compute adsorption energies of six adsorbates on Ag(001) and Ag(011) at on-top
  sites using MLIP/calculator with consistent energy reference per doc 3.2.1.
human_prompt_seed: '对 Ag 体相切出 (001) 与 (011) 两个表面；分别计算 H、CO、COOH、CO2、HCOO、HCOOH 六种吸附质在
  on-top 位点的吸附能。 使用 DP（或题目环境要求的等效势/计算器），并统一气相分子与体相/slab 的能量零点（说明 E_ads 定义与参考态）。 以表格汇总各体系吸附能（eV），并注明是否包含
  ZPE/熵校正（若未做，需明确写「仅电子能」）。

  '
tags:
- struct_surface
- code_mlip
data_files: []
reference_answers:
- key: turn_budget
  value:
    max: 35
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 85000
scoring_checklist:
- id: workflow_setup
  criterion: 'Agent demonstrates correct computational approach: (a) builds or references
    Ag bulk structure, (b) cuts or describes cutting (001) and (011) surface slabs,
    (c) prepares or scripts adsorbate-slab structures for the six adsorbates (H, CO,
    COOH, CO2, HCOO, HCOOH), and (d) uses an MLIP/DP calculator or submits remote
    Bohrium computation jobs. A well-structured script, code, or submitted computation
    jobs satisfying these elements counts as pass even if final numerical results
    are not yet available (e.g. due to wall-clock timeout).'
  axis: correctness
  verify: llm_binary_judge
- id: coverage_table
  criterion: '结果覆盖 Ag(001) 与 Ag(011)，六种吸附质（H, CO, COOH, CO2, HCOO, HCOOH），on-top 位点；给出吸附能数值表并定义能量参考（slab、气相）。NOTE:
    具体使用哪种计算器（DP、MACE-MP、或其他 MLIP）不是本条评判标准——只要结果覆盖齐全、参考态定义清楚即可。若答案中表格包含 markdown 分隔线（如
    |:---:|），这是格式标记，不是截断。Judge on coverage completeness and reference definition only.'
  axis: correctness
  verify: llm_binary_judge
  weight: 2.0
- id: grounding_workflow
  criterion: 从 Agent 的产物（脚本、代码、已提交的 Bohrium 计算任务、或最终叙述/表格）中能看出从体相/表面到吸附结构的合理计算链条。若有最终表格，则叙述与数值需自洽；若仅有脚本或计算作业提交记录，则代码逻辑须体现合理的结构构建与能量计算流程。未凭空列出与实际步骤无关的数值。
  axis: grounding
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling.
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within a generous benchmark ceiling.
  axis: efficiency
  verify: token_budget
