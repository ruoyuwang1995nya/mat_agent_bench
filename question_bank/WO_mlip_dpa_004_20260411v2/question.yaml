domain: agnostic
intent: Run two-stage MD (NVT equilibration + NPT production) on Al FCC supercell with DPA; report average temperature 
  and pressure.
human_prompt_seed: '对 FCC Al 进行分子动力学模拟。

  从数据库获取或构建 Al FCC 原胞，扩展为至少 2×2×2 超胞，

  使用 DPA 机器学习势按以下流程运行：

  1) NVT 平衡：300 K，2 ps

  2) NPT 采样：300 K，0 GPa，5 ps

  报告 NPT 阶段的平均温度 (K) 和平均压力 (GPa)。

  '
