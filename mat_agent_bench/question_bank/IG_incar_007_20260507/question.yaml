  criterion: INCAR file is generated.
  axis: correctness
  verify: artifact_exists
- id: incar_critical_tokens
  criterion: INCAR contains all critical parameter keywords.
  axis: correctness
  verify: text_file_contains_all
- id: critical_IBRION
  criterion: INCAR sets IBRION = 0 (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_ISPIN
  criterion: INCAR sets ISPIN = 2 (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_ISYM
  criterion: INCAR sets ISYM = 0 (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_NSW
  criterion: INCAR contains NSW assignment (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_POTIM
  criterion: INCAR sets POTIM = 0.5 (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_SIGMA
  criterion: INCAR sets SIGMA = 0.2 (critical param).
  axis: correctness
