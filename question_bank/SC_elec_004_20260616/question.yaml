intent: Build Ag(001) surface slab and place CO molecule at ontop site for adsorption calculation.
human_prompt_seed: 'Build the adsorption structure of CO on the Ag(001) surface:

  1. Obtain the Ag FCC bulk structure (space group Fm-3m, a=4.086 Å).

  2. Cut a (001) surface slab with 4 atomic layers (that is, 4 inequivalent atomic planes along z, with 36 Ag atoms total in a 3×3 supercell) and 15 Å of vacuum.

  3. Place a CO molecule at an ontop site on the top layer of the slab (C end down, initial distance about 2.0 Å).

  4. Output three structure files: bare_slab.vasp, CO_molecule.vasp, and adsorbed_system.vasp.

  '
