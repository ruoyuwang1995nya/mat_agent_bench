intent: Retrieve up to five ternary rare-earth transition-metal oxides excluding Fe and Ni.
human_prompt_seed: '检索并返回不超过 5 个三元氧化物，约束如下：

  - 同时包含：1 个稀土元素 + 1 个过渡金属元素 + O； - 元素总数为 3（ternary）； - 排除 Fe 和 Ni。

  请完成以下交付：

  1) `re_tm_oxide_candidates.json`：至少包含 `rank`, `formula`, `elements`, `database_source`, `structure_identifier`, `selection_basis`；
  2) `re_tm_oxide_report.md`：说明筛选逻辑（稀土、过渡金属、三元、排除 Fe/Ni）及结果不确定性。

  最终回答中确认每条候选如何满足上述组合约束。'
