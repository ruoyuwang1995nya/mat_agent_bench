id: DF_scxrd_001_20260408
capability: scientific_analysis
domain: agnostic
intent: Determine the crystal structure of an ordered molecular crystal (1-RTP, 293
  K) from raw single-crystal X-ray diffraction data. Starting from the reduced reflection
  file (.hkl) and the data-collection summary (.p4p), the agent must determine the
  space group, solve the structure, refine it, and generate a validated CIF with no
  A-level checkCIF alerts.
human_prompt_seed: '文件 `A23050101A0735.hkl` 和 `A23050101A0735.p4p` 是一个有机-无机杂化硝普盐在
  293 K 下采集的单晶 X 射线衍射数据（已经过数据还原）。请完成以下工作：

  1. 根据 .p4p 文件中的晶胞参数和系统消光规律，确定空间群；

  2. 使用合适的程序解析晶体结构；

  3. 对结构进行全矩阵最小二乘精修，直至收敛；

  4. 生成 CIF 文件，并通过 IUCr checkCIF 验证（不允许有 A 类警告）；

  5. 报告最终精修结果：R1、wR2、GooF 及晶胞参数。

  '
tags:
- char_xrd
- char_cif_validation
- phy_defect
