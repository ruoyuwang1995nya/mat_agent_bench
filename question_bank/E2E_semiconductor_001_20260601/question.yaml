reference_answer_prompt: 'Phase 1 (Bulk): Relax bulk FeS2 (Pa3, a=5.409 Å) and TiO2 (I41/amd, a=3.803 Å, c=9.517 Å) with PBE+U
  (U_Fe=2.0, U_Ti=7.3 eV), DFT-D3, ENCUT=600 eV. Verify band gaps: FeS2=0.96 eV, TiO2=3.21 eV. Phase 2 (Surfaces): Cleave
  FeS2(100) and TiO2(001) surfaces, add 20 Å vacuum, relax. Compute work functions: Φ(FeS2)=5.03 eV, Φ(TiO2)=5.22 eV. Phase
  3 (Heterojunction): Build (2×2)FeS2/(3×3)TiO2 supercell (6.73% mismatch), stack with interface, relax. Compute adhesion
  energy E_ad=-0.26 eV/Å². Phase 4 (Band alignment): Use potential line-up method. ΔV(z)=4.05 eV, (V-V)_TiO2=1.24 eV, (V-V)_FeS2=7.91
  eV. ΔE_VBO=2.62 eV, ΔE_CBO=0.37 eV. Type-II alignment. Heterojunction work function Φ=4.09 eV. Electrons transfer from FeS2
  to TiO2 under illumination.'
