id: E2E_silicon_001_20260601
task_type: end_to_end_research
capabilities:
- scientific_reasoning
- tool_utilization
- workflow_orchestration
- data_handling
- scientific_grounding
domain: semiconductor
difficulty: hard
intent: Starting from the diamond-cubic silicon crystal structure, design and execute a multi-stage computational 
  workflow to compute the equation of state, fit a Birch-Murnaghan EOS model, and extract equilibrium volume, bulk 
  modulus, and minimum energy.
human_prompt_seed: 'Starting from the provided equilibrium structure of diamond-cubic silicon (poscar.vasp), compute the equation
  of state and extract key equilibrium properties. Report results in results.json with keys: equilibrium_volume_A3 (float), bulk_modulus_GPa (float), minimum_energy_eV (float), eos_fit_residual (float), and
  num_volume_points (int). Include your full methodology, parameter choices, and any assumptions in methodology.txt. Also
  provide eos_data.csv with columns: volume_A3, energy_eV, scaling_pct.'
tags:
- eng_vasp
- eos
- birch_murnaghan
- bulk_modulus
- workflow_e2e
data_files:
- key: poscar
  path: poscar.vasp
  description: Diamond-cubic silicon equilibrium structure from Materials Project (mp-149)
reference_answers:
- key: results_exists
  value: results.json
- key: results_equilibrium_volume
  value:
    checks:
    - key: equilibrium_volume_A3
      max: 24.0
      min: 16.0
    filename: results.json
- key: results_bulk_modulus
  value:
    checks:
    - key: bulk_modulus_GPa
      max: 110
      min: 80
    filename: results.json
- key: results_energy
  value:
    checks:
    - key: minimum_energy_eV
      max: -9.0
      min: -11.0
    filename: results.json
- key: results_num_points
  value:
    checks:
    - key: num_volume_points
      expected: 5
      tolerance: 0
    filename: results.json
- key: methodology_exists
  value: methodology.txt
- key: eos_data_exists
  value: eos_data.csv
- key: workflow_orchestration_check
  value:
    expected: 'yes'
    question: 'Does the agent''s methodology demonstrate a correct multi-stage workflow: structure generation -> relaxation
      setup/execution -> energy collection -> EOS fitting?'
scoring_checklist:
- id: results_exists
