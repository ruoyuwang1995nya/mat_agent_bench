domain: semiconductor
difficulty: hard
intent: Starting from bulk crystal structures of pyrite FeS2 and anatase TiO2, build the TiO2(001)/FeS2(100) 
  heterojunction, compute electronic properties, determine band alignment and work functions, and predict charge carrier
  separation behavior for photocatalytic applications.
human_prompt_seed: 'Starting from the provided bulk crystal structures of pyrite FeS2 (mp-226) and anatase TiO2 (mp-390),
  design and analyze a TiO2(001)/FeS2(100) heterojunction for photocatalytic applications. Construct the interface model,
  compute the relevant electronic properties, and determine whether the heterojunction enables efficient charge carrier separation.
  Report your findings in results.json with keys: adhesion_energy_ev_per_A2, work_function_fes2_ev, work_function_tio2_ev,
  work_function_hetero_ev, vbo_ev, cbo_ev, band_alignment_type, charge_transfer_direction, and provide a detailed methodology
  report in analysis_report.txt.'
tags:
- eng_vasp
- end_to_end
- heterojunction
- photocatalysis
- charge_separation
data_files:
- key: poscar_fes2_bulk
  path: FeS2.poscar
  description: Bulk pyrite FeS2 POSCAR (cubic Pa3, a=5.397 Å)
- key: poscar_tio2_bulk
  path: TiO2.poscar
  description: Bulk anatase TiO2 POSCAR (tetragonal I41/amd, a=3.784 Å, c=9.515 Å)
