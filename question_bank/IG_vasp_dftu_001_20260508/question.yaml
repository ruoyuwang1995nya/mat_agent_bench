id: IG_vasp_dftu_001_20260508
task_type: simulation
capabilities:
- tool_utilization
- workflow_orchestration
domain: agnostic
intent: Generate VASP INCAR for NiO with DFT+U (Dudarev) settings.
human_prompt_seed: '工作区中有 NiO.vasp（NaCl结构氧化镍，4个原子：2 Ni + 2 O，POSCAR 中原子顺序为 Ni O）。

  NiO 是强关联反铁磁绝缘体，Ni 3d 电子存在强 on-site Coulomb 相互作用。 请生成考虑强关联效应的静态计算 INCAR 文件 `INCAR_dftu`。

  要求使用 Hubbard U 校正，Ni 的有效 U 值取 6.2 eV。 PBE 泛函，ENCUT=550 eV。'
tags:
- eng_vasp
data_files: []
reference_answers:
- key: incar_dftu_artifact
  value: INCAR_dftu
- key: must_ldau
  value:
    filename: INCAR_dftu
    tokens:
    - LDAU = .TRUE.
    - LDAU=.TRUE.
    flags: i
- key: must_ldautype
  value:
    filename: INCAR_dftu
    tokens:
    - LDAUTYPE = 2
    - LDAUTYPE=2
    flags: i
- key: must_ldaul
  value:
    filename: INCAR_dftu
    pattern: LDAUL\s*=\s*2\s+(-1|0)
    flags: i
- key: must_ldauu
  value:
    filename: INCAR_dftu
    pattern: LDAUU\s*=\s*6\.2\s+0
    flags: i
- key: turn_budget
  value:
    max: 12
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 10000
- key: must_ispin
  value:
    filename: INCAR_dftu
    pattern: ISPIN\s*=\s*2
    flags: i
scoring_checklist:
- id: incar_dftu_artifact
  criterion: INCAR_dftu file exists in workspace.
  axis: correctness
  verify: artifact_exists
- id: must_ldau
  criterion: LDAU = .TRUE. is set to enable DFT+U.
  axis: correctness
  verify: text_file_contains_all
- id: must_ldautype
  criterion: LDAUTYPE = 2 (Dudarev method) is specified.
  axis: correctness
  verify: text_file_contains_all
- id: must_ldaul
  criterion: LDAUL array matches species order (2 for Ni d-orbital, -1 or 0 for O).
  axis: correctness
  verify: text_file_regex
- id: must_ldauu
  criterion: LDAUU array sets 6.2 for Ni and 0 for O, matching POSCAR species order.
  axis: correctness
  verify: text_file_regex
- id: must_ispin
  criterion: INCAR_dftu sets ISPIN = 2 (required for antiferromagnetic NiO).
  axis: correctness
  verify: text_file_regex
- id: grounding_dftu
  criterion: Agent explains the physical basis for U value choice and why Dudarev
    (not Liechtenstein) method is appropriate.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  axis: efficiency
  verify: no_retries
  criterion: No repeated identical tool calls.
- id: turn_budget
  axis: efficiency
  verify: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
- id: token_budget_total
  axis: efficiency
  verify: token_budget
  criterion: Total token usage stays within benchmark ceiling.
