id: IG_incar_006_20260507
capability: input_generation
domain: agnostic
intent: 'Generate VASP INCAR for SCAN metaGGA calculation of intermetallic Tm2ZnGa2.
  Tm has f electrons; spin-polarized.

  '
human_prompt_seed: 为金属间化合物 Tm2ZnGa2 生成一个 SCAN metaGGA 泛函静态计算的 VASP INCAR。Tm 含 f 电子，需要自旋极化。
  将完整的 INCAR 写入当前目录下的 `INCAR` 文件。
tags:
- eng_vasp
reference_answers:
- key: incar_artifact
  value: INCAR
- key: incar_critical_tokens
  value:
    filename: INCAR
    tokens:
    - ISPIN
    - LASPH
    - METAGGA
    flags: i
- key: critical_ISPIN
  value:
    filename: INCAR
    pattern: ^\s*ISPIN\s*=\s*2\b
    flags: im
- key: critical_LASPH
  value:
    filename: INCAR
    pattern: ^\s*LASPH\s*=\s*\.?(?:TRUE|T)\.?
    flags: im
- key: critical_METAGGA
  value:
    filename: INCAR
    pattern: ^\s*METAGGA\s*=\s*SCAN\b
    flags: im
- key: optional_NSW
  value:
    filename: INCAR
    pattern: (?ims)\A(?!.*^\s*NSW\s*=)(?:.|\n)*\Z|^\s*NSW\s*=\s*0\b
    flags: im
- key: turn_budget
  value:
    max: 8
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 15000
- key: reasonable_params
  value:
    filename: INCAR
scoring_checklist:
- id: incar_artifact
  criterion: INCAR file is generated.
  axis: correctness
  verify: artifact_exists
- id: incar_critical_tokens
  criterion: INCAR contains all critical parameter keywords.
  axis: correctness
  verify: text_file_contains_all
- id: critical_ISPIN
  criterion: INCAR sets ISPIN = 2 (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_LASPH
  criterion: INCAR sets LASPH = .TRUE. (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_METAGGA
  criterion: INCAR sets METAGGA = SCAN (critical param).
  axis: correctness
  verify: text_file_regex
- id: optional_NSW
  criterion: INCAR may omit NSW; if provided, it must be NSW = 0.
  axis: correctness
  verify: text_file_regex
- id: reasonable_params
  criterion: The INCAR uses physically reasonable general settings for a VASP meta-GGA
    calculation. ENCUT is present (unless not relevant), EDIFF is present with a reasonable
    value, PREC is set. Machine-specific params (KPAR, NCORE, NPAR) are optional and
    should not be penalized if absent or different from reference.
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: The generated INCAR is grounded in the provided prompt data (material
    system, calculation type, critical parameters) rather than hallucinated. Judge
    solely from the final answer and stated file content; do not fail because the
    tool-call log omits MCP, web_search, or any specific tool.
  axis: grounding
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: efficiency_judge
  criterion: The agent produced the INCAR efficiently without unnecessary tool calls,
    redundant queries, or irrelevant exploration.
  axis: efficiency
  verify: llm_binary_judge
- id: duration_budget
  criterion: Wall-clock run duration does not exceed benchmark ceiling.
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
