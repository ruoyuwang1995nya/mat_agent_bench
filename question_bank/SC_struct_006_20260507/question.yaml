id: SC_struct_006_20260507
task_type: simulation
capabilities:
- structure_manipulation
domain: agnostic
difficulty: easy
intent: Add missing hydrogens to the diacetylmorphine (DACMOR) molecular crystal CIF and validate the formula, local 
  molecular environment, and tetrahedral geometry using MolCrysKit.
human_prompt_seed: '对以下通过 OSS URL 提供的 CIF 结构进行补氢处理：

  - `DACMOR.cif` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/cda9f292ec4b411facb478d0486b54ce/DACMOR.cif`


  该结构为二乙酰吗啡（diacetylmorphine）分子晶体，从单晶XRD解析得到，但缺少了 H 原子。

  请对该结构补氢，并导出为 `dacmor_hydrogenated.cif`。

  要求：添加 H 原子使结构符合价键规则、具备化学意义。


  重点检查并在最终答案中明确报告：

  (1) 补氢后每个分子的最简化学式；

  (2) 每个分子中 H 原子的总数；

  (3) 代表性的 H-C-H 键角（度）；

  (4) 补氢后分子的连接性是否完整（无断裂或多余键）。


  输出结构文件，并给出上述核查结论。

  '
tags:
- struct_molcrys
data_files:
- key: dacmor_cif
  path: DACMOR.cif
  oss_url: 
    https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/cda9f292ec4b411facb478d0486b54ce/DACMOR.cif
  description: DACMOR (diacetylmorphine) molecular-crystal CIF missing explicit H atoms.
