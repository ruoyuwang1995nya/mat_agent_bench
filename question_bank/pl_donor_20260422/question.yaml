  tolerance: 0.1
- key: required_fields
  value:
  - ranking_table
  - gap_extrapolation
  - conformational_note
  - shortlist
  - uncertainty_note
- key: grounding_source
  value:
    filename: donor_prescreen_bundle.json
- key: turn_budget
