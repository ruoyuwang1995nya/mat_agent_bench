id: BP_struct_004_20260423
task_type: simulation
capabilities:
- data_handling
- scientific_reasoning
domain: semiconductor
intent: Perform batch post-processing of pre-computed band structures for 3 materials (Si, Ge, GaAs) with unified 
  analysis parameters. Extract band gaps and band edge positions using identical k-paths, energy windows, and plot 
  specifications across all materials.
human_prompt_seed: '从 `postprocessing_bandstr.json` 读取 3 种材料（Si, Ge, GaAs）的带结构后处理配置。

  每种材料对应一个预计算的能带数据 CSV 文件（Si_bandstructure.csv、Ge_bandstructure.csv、GaAs_bandstructure.csv），包含沿 M-Gamma-K 路径的能带本征值数据。CSV 列格式为：k_index,
  k_distance, k_label, band_1, ..., band_N，其中 band_1–band_4 为价带，band_5–band_7 为导带，能量单位 eV，已参考 VBM = 0。

  对每种材料执行相同的分析流程： 1. k-path 固定为 M-Gamma-K，每段 50 个 k 点 2. 能量窗口统一为 [-5, 5] eV 3. 费米面参考点：VBM（价带最大值） 4. 所有绘图使用相同样式和范围

  输出要求： 1. 3 个带结构 PNG 图 2. 3 个数据表（CSV 格式） 3. 带隙值和边界位置汇总表

  关键考察点： 1. 分析参数（k-path, 能量窗口）在所有材料中完全一致 2. 虽然材料的绝对带隙不同，但分析流程相同 3. 输出文件和数据格式统一

  '
tags:
- eng_vasp
