- key: grounding_check
  value:
    grounding_source: 'Kitchaev et al. 2017 Discussion: cation-interstitial site compatibility in MnO₂ tunnel structures;
      Li⁺ prefers small tetrahedral/octahedral sites'
- key: duration_budget
  value:
