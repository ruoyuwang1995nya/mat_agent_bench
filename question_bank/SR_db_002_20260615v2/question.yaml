id: SR_db_002_20260615v2
task_type: search_and_interpretation
capabilities:
- tool_utilization
- scientific_reasoning
domain: agnostic
difficulty: easy
intent: Retrieve a target prototype crystal structure from an open database and summarize the returned structural 
  metadata.
human_prompt_seed: 'Retrieve one MgB2 crystal structure from an open database.


  Please provide the following deliverables:

  1) `mgb2_retrieval.json`: containing at least `formula`, `database_source`, `structure_identifier`, `space_group`,
  `lattice_summary`, and `candidate_count`;

  2) `mgb2_notes.md`: explain how you confirmed that the result is MgB2, and how you filtered the results if multiple
  candidates were returned;

  3) In the final answer, state that this is a "summary of structure-retrieval results", and do not expand into downstream
  phonon or electronic-structure calculations.

  '
tags:
- meta_database
data_files: []
reference_answers:
- key: retrieval_json
  value: mgb2_retrieval.json
- key: notes_md
