reference_answer_prompt: 'Objective: Determine the number of independent dielectric tensor elements from crystal symmetry.
  Compute the dielectric tensor using VASP density functional perturbation theory (DFPT). Compute the polycrystalline dielectric
  constant from the resulting tensor.

  Procedure:

  Read crystal_structure.cif. Determine the space group and crystal system using a symmetry analysis tool such as pymatgen
  or spglib. The structure belongs to space group R-3c (No. 167), which is a trigonal crystal system.

  For a trigonal crystal, the dielectric tensor has the symmetry form

  ε = [[ε1, 0, 0], [0, ε1, 0], [0, 0, ε3]]

  Therefore, the dielectric tensor contains two independent elements:

  ε1 = εxx = εyy ε3 = εzz

  Perform a full structural relaxation using VASP. Perform a DFPT dielectric calculation on the relaxed structure.

  Example INCAR settings:

  LEPSILON = .TRUE. IBRION = 8 NSW = 0 ISMEAR = 0 SIGMA = 0.05 EDIFF = 1E-8 PREC = Accurate

  Use a converged KSPACING and plane-wave cutoff.

  After the DFPT calculation completes, extract the resulting 3×3 dielectric tensor:

  ε = [[εxx, εxy, εxz], [εyx, εyy, εyz], [εzx, εzy, εzz]]

  Verify consistency with trigonal symmetry:

  εxx ≈ εyy εxy ≈ εyx ≈ 0 εxz ≈ εyz ≈ 0 εzx ≈ εzy ≈ 0

  Small numerical deviations may be present due to finite convergence tolerances.

  Compute the polycrystalline dielectric constant using the orientational average

  ε_poly = Tr(ε) / 3

  i.e.,

  ε_poly = (εxx + εyy + εzz) / 3

  For a trigonal dielectric tensor,

  ε_poly = (2ε1 + ε3) / 3

  Expected Key Conclusion:

  Space group: R-3c Crystal system: trigonal Independent dielectric tensor elements: 2

  Polycrystalline dielectric constant:

  ε_poly = (εxx + εyy + εzz)/3 = (2ε1 + ε3)/3

  From the paper, Cs2Ti(WO4)3 has ε∞=5.34, ε0=175.55, ε=180.89.'
