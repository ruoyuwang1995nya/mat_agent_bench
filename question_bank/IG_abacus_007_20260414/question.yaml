id: IG_abacus_007_20260414
capability: input_generation
domain: agnostic
intent: Generate ABACUS LCAO spin-polarized electric-field SCF and NSCF band inputs
  for a nanoribbon, including a line-mode KPT from Gamma to Y.
human_prompt_seed: '工作区中提供了 nanoribbon 结构。


  请准备一套“自旋极化 + 外电场”ABACUS LCAO 输入：

  1) 生成 SCF 输入，包含外电场控制参数。

  2) 生成对应的 NSCF band 输入，要求读取已收敛电荷。

  3) 生成 line-mode KPT，覆盖 Gamma 到 Y 的能带路径并保证采样足够密。


  将结果写入当前目录：`INPUT_spin_elec_scf`、`INPUT_spin_elec_band`、`KPT_band`。

  '
tags:
- abacus
- electrostatics
- mat_2d
- phy_electronic
data_files:
- key: nanoribbon
  path: nanoribbon.stru
  oss_url: ''
  description: Nanoribbon structure with vacuum for electric-field and band-structure
    setup.
reference_answers:
- key: must_input_spin_scf_core
  value:
    filename: INPUT_spin_elec_scf
    tokens:
    - calculation scf
    - nspin 2
    - basis_type lcao
    - efield_flag 1
    - efield_dir 2
    flags: i
- key: must_input_spin_band_core
  value:
    filename: INPUT_spin_elec_band
    tokens:
    - calculation nscf
    - init_chg file
    - nspin 2
    flags: i
- key: must_kpt_band_path_core
  value:
    filename: KPT_band
    required_points:
    - - 0.0
      - 0.0
      - 0.0
    - - 0.0
      - 0.5
      - 0.0
    tolerance: 1.0e-05
    require_line_mode: true
    require_order: true
- key: suggested_input_spin_numerics
  value:
    filename: INPUT_spin_elec_scf
    checks:
    - key: ecutwfc
      min: 90
      max: 120
    - key: scf_thr
      min: 1.0e-07
      max: 5.0e-06
    - key: smearing_method
      allowed_values:
      - gauss
      - gaussian
    - key: smearing_sigma
      min: 0.001
      max: 0.02
- key: suggested_input_spin_mixing
  value:
    filename: INPUT_spin_elec_scf
    tokens:
    - mixing_beta 0.1
    - mixing_ndim 20
    - mixing_gg0 1.5
    flags: i
- key: variable_efield_amp_small
  value:
    filename: INPUT_spin_elec_scf
    checks:
    - key: efield_amp
      min: 0.001
      max: 0.00999
- key: variable_kpt_band_density
  value:
    filename: KPT_band
    pattern: \b(?:80|8[1-9]|9\d|10\d|11\d|120)\b
    flags: i
- key: input_spin_scf_artifact
  value: INPUT_spin_elec_scf
- key: input_spin_band_artifact
  value: INPUT_spin_elec_band
- key: kpt_band_artifact
  value: KPT_band
- key: turn_budget
  value:
    max: 8
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 18000
scoring_checklist:
- id: must_input_spin_scf_core
  criterion: '[Must] INPUT_spin_elec_scf contains core spin-polarized SCF + external-field
    controls.'
  axis: correctness
  verify: text_file_contains_all
  weight: 1.0
- id: must_input_spin_band_core
  criterion: '[Must] INPUT_spin_elec_band is NSCF and reads converged charge (`init_chg
    file`).'
  axis: correctness
  verify: text_file_contains_all
  weight: 1.0
- id: must_kpt_band_path_core
  criterion: '[Must] KPT_band defines a line-mode path that includes Gamma->Y core
    coordinates ((0,0,0)->(0,0.5,0)).'
  axis: correctness
  verify: text_file_kpt_path
  weight: 1.0
- id: suggested_input_spin_numerics
  criterion: '[Suggested] SCF input follows benchmark numeric setup with tolerance
    (`ecutwfc/scf_thr/smearing`).'
  axis: correctness
  verify: text_file_numeric_range
  weight: 0.6
- id: suggested_input_spin_mixing
  criterion: '[Suggested] SCF input includes benchmark mixing controls.'
  axis: correctness
  verify: text_file_contains_all
  weight: 0.6
- id: variable_efield_amp_small
  criterion: '[Variable] External-field amplitude is in a small finite-field range
    (around 1e-3).'
  axis: correctness
  verify: text_file_numeric_range
  weight: 0.3
- id: variable_kpt_band_density
  criterion: '[Variable] KPT path interpolation density is in a reasonable range for
    band plotting.'
  axis: correctness
  verify: text_file_regex
  weight: 0.3
- id: input_spin_scf_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `INPUT_spin_elec_scf` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 0.33
- id: input_spin_band_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `INPUT_spin_elec_band` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 0.33
- id: kpt_band_artifact
  criterion: Generated deliverables count even if the final answer does not quote
    file contents; `KPT_band` must be written to the workspace.
  axis: correctness
  verify: artifact_exists
  weight: 0.34
- id: grounding_source
  criterion: The generated inputs are grounded in the provided nanoribbon structure
    and do not invent unrelated structural edits.
  axis: grounding
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: no_retries
  criterion: No repeated identical tool calls with the same parameter set.
  axis: efficiency
  verify: no_retries
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
  axis: efficiency
  verify: token_budget
