scoring_checklist:
- id: r1_factor
  criterion: Final R1 factor (on F, I>2sigma) is within tolerance of 0.0637 (human
    baseline for disordered structure). A value ≤ 0.08 is acceptable given the disorder.
  axis: correctness
  verify: numerical_range
  weight: 2.0
- id: wr2_factor
  criterion: Final wR2 factor (on F², all data) is within tolerance of 0.2183 (human
    baseline). Higher wR2 is expected for disordered structures; ≤ 0.25 is acceptable.
  axis: correctness
  verify: numerical_range
  weight: 1.5
- id: goof
  criterion: Goodness-of-fit (GooF, S) is within tolerance of 1.022. A value between
    0.9 and 1.2 indicates a well-refined structure.
  axis: correctness
  verify: numerical_range
  weight: 1.0
- id: space_group_number
  criterion: The agent correctly identifies the space group number as 4 (P2₁, monoclinic).
    The answer or CIF must report space group No. 4.
  axis: correctness
  verify: numerical_range
  weight: 1.5
- id: cell_volume
  criterion: Refined unit cell volume is within tolerance of 1025.98 Å³.
  axis: correctness
  verify: numerical_range
  weight: 1.0
- id: checkcif_validation
  criterion: The generated CIF passes IUCr checkCIF with zero A-level alerts.
  axis: correctness
  verify: checkcif_no_a_alerts
  weight: 2.0
- id: disorder_modeled
  criterion: The agent explicitly models the cation orientational disorder (e.g.,
    using split-atom positions, PART instructions, or occupancy constraints in SHELXL)
    and reports the disorder in the answer.
  axis: correctness
  verify: llm_binary_judge
  weight: 2.0
- id: cif_generated
  criterion: The agent produces a valid CIF file as output of the refinement.
  axis: correctness
  verify: llm_binary_judge
  weight: 1.0
- id: turn_budget
  criterion: Task completed within 40 turns.
  axis: efficiency
  verify: turn_budget
  weight: 1.0
- id: duration_budget
  criterion: Task completed within 6 hours (21600 seconds).
