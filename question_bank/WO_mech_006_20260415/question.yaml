domain: alloy
intent: Build the convex hull for a CuCrZr alloy and summarize stability interpretation artifacts.
human_prompt_seed: "对 CuCrZr 执行凸包稳定性分析（Mock版）：\n1. 先 query/检索并整理凸包分析所需输入文件与参考相信息；\n2. 说明稳定性判据（hull distance 与稳定标签关系）；\n3.
  不做真实计算，使用以下 mock 结果：\n   - hull_distance = 0.024 eV/atom\n   - stability_label = metastable\n   - reference_phases = [\"\
  Cu\", \"Cr2Zr\", \"CuZr2\"]\n4. 基于 mock 值做稳定性后处理与结论解释。\n\n请完成以下交付：\n1) `cucrzr_convex_hull_summary.json`：至少包含 `input_files`,
  `hull_distance`, `stability_label`, `reference_phases`, `notes`；\n2) `cucrzr_convex_hull_report.md`：说明 query 输入梳理、mock 后处理流程、稳定性判据及不确定性。\n\
  \n最终回答中请明确说明该结构在热力学稳定性上的定性结论（稳定/亚稳/不稳定）。\n"
