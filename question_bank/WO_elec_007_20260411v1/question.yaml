id: WO_elec_007_20260411v1
capability: workflow_orchestration
domain: catalysis
intent: Compute Pd(111) work function with ABACUS under a z-direction vacuum setup
  and summarize key computational settings and output.
human_prompt_seed: "计算 Pd(111) 表面功函数（Mock版）：\n1. 先 query/检索 Pd 体相与 Pd(111) slab 建模所需输入文件，并确认真空方向约束；\n\
  2. 列出关键设置（exchange-correlation functional、计算模式、真空方向、是否弛豫）；\n3. 不做真实 ABACUS 计算，使用以下\
  \ mock 结果：\n   - work_function_eV = 5.43\n   - vacuum_direction = z\n   - functional\
  \ = PBE\n   - calculation_mode = SCF\n4. 基于以上数值完成后处理与结论解释。\n\n请完成以下交付：\n1) `pd111_work_function.json`：至少包含\
  \ `input_files`, `work_function_eV`, `vacuum_direction`, `functional`, `calculation_mode`,\
  \ `notes`；\n2) `pd111_work_function_report.md`：说明 query 输入梳理、mock 后处理流程和结果解读。\n\n\
  最终回答需明确给出功函数数值（eV）并确认 vacuum_direction=z。\n"
tags:
- phy_electronic
- phy_surface
- abacus
- meta_userlog
