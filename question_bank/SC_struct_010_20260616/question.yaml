id: SC_struct_010_20260616
task_type: simulation
capabilities:
- structure_manipulation
domain: agnostic
difficulty: easy
intent: Build a seven-layer Ag(111) slab with explicit water and potassium ions for an electrochemical interface initial
  model.
human_prompt_seed: 'Build an initial Ag(111) interface structure and export it as `ag111_k_water_interface.cif`.

  Requirements:

  (1) The Ag(111) slab must be a (2 × 3) in-plane supercell with 7 atomic layers.

  (2) Add 43 H2O molecules and 2 K ions above the metal substrate; only neutral H2O molecules are allowed, with no OH-/H3O+ or water dissociation products.

  (3) Keep about 12 Å of vacuum along the z direction.

  (4) In the final answer, explicitly report the Ag atom count, H2O molecule count, K ion count, slab layer count, and vacuum thickness, and state that these solvent molecules and ions are located above the same side of the metal surface.

  The final answer must also include an `<eval_results>` JSON block, for example `{"vacuum_angstrom": 12.0, "supercell_a": 2, "supercell_b": 3, "adsorbate_side": "same_side"}`, so that vacuum thickness, in-plane supercell size, and same-side solvent/ion placement can be machine-checked.

  '
