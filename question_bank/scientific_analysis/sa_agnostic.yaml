      and crystal system information for the high-temperature disordered phase.
  reference_answers:
  - key: r1_factor
    value: 0.0637
    tolerance: 0.015
    unit: dimensionless
  - key: wr2_factor
    value: 0.2183
    tolerance: 0.04
    unit: dimensionless
  - key: goof
    value: 1.022
    tolerance: 0.1
    unit: dimensionless
  - key: space_group_number
    value: 4
    tolerance: 0
    unit: IT_number
  - key: cell_volume
    value: 1025.98
    tolerance: 5.0
    unit: A3
  - key: checkcif_validation
    value:
      filename: '*.cif'
      max_a_alerts: 0
  - key: turn_budget
    value:
      max: 40
  - key: duration_budget
    value:
      max: 21600000
  - key: token_budget_total
    value:
      max: 25000
  scoring_checklist:
  - id: r1_factor
    criterion: Final R1 factor (on F, I>2sigma) is within tolerance of 0.0637 (human baseline
      for disordered structure). A value ≤ 0.08 is acceptable given the disorder.
    axis: correctness
    verify: numerical_range
    weight: 2.0
  - id: wr2_factor
    criterion: Final wR2 factor (on F², all data) is within tolerance of 0.2183 (human baseline).
