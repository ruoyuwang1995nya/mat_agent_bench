    2. 使用合适的程序解析晶体结构；

    3. 对结构进行精修，需对无序部分进行合理建模（如分裂原子模型或约束/限制）；

    4. 生成 CIF 文件，并通过 IUCr checkCIF 验证（不允许有 A 类警告）；

    5. 报告最终精修结果：R1、wR2、GooF 及晶胞参数。

    '
