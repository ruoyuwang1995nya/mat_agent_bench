id: IG_incar_019_20260508
task_type: simulation
capabilities:
- tool_utilization
- workflow_orchestration
domain: agnostic
intent: 'Generate VASP INCAR for non-magnetic insulator static SCF calculation of cesium borate B12Cs4O20. Non-magnetic (ISPIN=1),
  wide-gap insulator.

  '
human_prompt_seed: 为硼酸铯 B12Cs4O20 生成一个非磁性绝缘体的静态 SCF 计算 VASP INCAR。体系为非磁性，宽带隙绝缘体。将完整的 INCAR 写入当前目录下的 `INCAR` 文件。
tags:
- eng_vasp
reference_answers:
- key: incar_artifact
  value: INCAR
- key: incar_critical_tokens
  value:
    filename: INCAR
    tokens:
    - ENCUT
    - ISPIN
    flags: i
- key: critical_ENCUT
  value:
    filename: INCAR
    pattern: ^\s*ENCUT\s*=\s*(?:[3-6]\d{2}|700)(?:\.\d+)?\b
    flags: im
- key: critical_ISPIN
  value:
    filename: INCAR
    pattern: ^\s*ISPIN\s*=\s*1\b
    flags: im
- key: optional_NSW
  value:
    filename: INCAR
    pattern: (?ims)\A(?!.*^\s*NSW\s*=)(?:.|\n)*\Z|^\s*NSW\s*=\s*0\b
    flags: im
- key: reasonable_params
  value:
    filename: INCAR
- key: correct_ISMEAR_insulator
  value:
    filename: INCAR
    pattern: ^\s*ISMEAR\s*=\s*(0|-5)\b
    flags: im
scoring_checklist:
- id: incar_artifact
  criterion: INCAR file is generated.
  axis: correctness
  verify: artifact_exists
  capability: tool_utilization
  weight: 0.5
- id: incar_critical_tokens
  criterion: INCAR contains all critical parameter keywords.
  axis: correctness
  verify: text_file_contains_all
  capability: data_handling
  weight: 0.5
- id: critical_ENCUT
  criterion: INCAR sets ENCUT in the 300-700 eV range (critical param).
  axis: correctness
  verify: text_file_regex
  capability: data_handling
  weight: 0.5
- id: critical_ISPIN
  criterion: INCAR sets ISPIN = 1 (critical param).
  axis: correctness
  verify: text_file_regex
  capability: tool_utilization
  weight: 0.5
- id: optional_NSW
  criterion: INCAR may omit NSW; if provided, it must be NSW = 0.
  axis: correctness
  verify: text_file_regex
  capability: data_handling
  weight: 0.5
- id: reasonable_params
  criterion: The INCAR uses physically reasonable general settings for a VASP static SCF calculation. ENCUT is present 
    (unless not relevant), EDIFF is present with a reasonable value, PREC is set. Machine-specific params (KPAR, NCORE, 
    NPAR) are optional and should not be penalized if absent or different from reference.
  axis: correctness
  verify: llm_binary_judge
  capability: data_handling
  weight: 0.5
- id: grounding_source
  criterion: The generated INCAR is grounded in the provided prompt data (material system, calculation type, critical 
    parameters) rather than hallucinated. Judge solely from the final answer and stated file content; do not fail 
    because the tool-call log omits MCP, web_search, or any specific tool.
  axis: grounding
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
- id: correct_ISMEAR_insulator
  criterion: INCAR sets ISMEAR = 0 (Gaussian) or ISMEAR = -5 (tetrahedron) which are appropriate for wide-gap
    insulators. Positive ISMEAR values (Methfessel-Paxton, for metals) must not be used for insulating systems.
  axis: correctness
  verify: text_file_regex
  capability: scientific_reasoning
  weight: 0.5
