- id: efficiency_judge
  criterion: Pawley refinement and thermal expansion fitting are performed in a direct
    pipeline without unnecessary repeated refinements or redundant parameter sweeps.
  axis: efficiency
  verify: llm_binary_judge
- id: turn_budget
