  1) `hea_alcr0.8cofeni_kb_summary.json` (containing at least `vec`, `mixing_enthalpy`, `mixing_entropy`, `binary_energy_summary`,
  `solid_solution_prediction`, and `possible_structure`);
  2) `hea_alcr0.8cofeni_kb_report.md` (explaining the source of the criteria, the conclusion, and the uncertainty).'
