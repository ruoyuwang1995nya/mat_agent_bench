id: IG_incar_001_20260508
task_type: simulation
capabilities:
- tool_utilization
- workflow_orchestration
domain: agnostic
intent: 'Generate VASP INCAR for a band structure calculation of Lu4N4. Non-self-consistent
  run reading existing charge density (ICHARG=11), with projected band output (LORBIT=11).

  '
human_prompt_seed: 为 Lu4N4 体系生成一个能带结构计算的 VASP INCAR 文件。要求：非自洽计算，从已有电荷密度读取，输出投影能带。将完整的
  INCAR 写入当前目录下的 `INCAR` 文件。
tags:
- eng_vasp
reference_answers:
- key: incar_artifact
  value: INCAR
- key: incar_critical_tokens
  value:
    filename: INCAR
    tokens:
    - ICHARG
    - LORBIT
    flags: i
- key: critical_ICHARG
  value:
    filename: INCAR
    pattern: ^\s*ICHARG\s*=\s*11\b
    flags: im
- key: critical_LORBIT
  value:
    filename: INCAR
    pattern: ^\s*LORBIT\s*=\s*11\b
    flags: im
- key: optional_IBRION
  value:
    filename: INCAR
    pattern: (?ims)\A(?!.*^\s*IBRION\s*=)(?:.|\n)*\Z|^\s*IBRION\s*=\s*\-1\b
    flags: im
- key: optional_NSW
  value:
    filename: INCAR
    pattern: (?ims)\A(?!.*^\s*NSW\s*=)(?:.|\n)*\Z|^\s*NSW\s*=\s*0\b
    flags: im
- key: turn_budget
  value:
    max: 8
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 15000
- key: reasonable_params
  value:
    filename: INCAR
scoring_checklist:
- id: incar_artifact
  criterion: INCAR file is generated.
  axis: correctness
  verify: artifact_exists
- id: incar_critical_tokens
  criterion: INCAR contains all critical parameter keywords.
  axis: correctness
  verify: text_file_contains_all
- id: critical_ICHARG
  criterion: INCAR sets ICHARG = 11 (critical param).
  axis: correctness
  verify: text_file_regex
- id: critical_LORBIT
  criterion: INCAR sets LORBIT = 11 (critical param).
  axis: correctness
  verify: text_file_regex
- id: optional_IBRION
  criterion: INCAR may omit IBRION; if provided, it must be IBRION = -1.
  axis: correctness
  verify: text_file_regex
- id: optional_NSW
  criterion: INCAR may omit NSW; if provided, it must be NSW = 0.
  axis: correctness
  verify: text_file_regex
- id: reasonable_params
  criterion: The INCAR uses physically reasonable general settings for a VASP band
    structure calculation. ENCUT is present (unless not relevant), EDIFF is present
    with a reasonable value, PREC is set. Machine-specific params (KPAR, NCORE, NPAR)
    are optional and should not be penalized if absent or different from reference.
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: The generated INCAR is grounded in the provided prompt data (material
    system, calculation type, critical parameters) rather than hallucinated. Judge
    solely from the final answer and stated file content; do not fail because the
    tool-call log omits MCP, web_search, or any specific tool.
  axis: grounding
  verify: llm_binary_judge
- id: soc_consideration
  criterion: Agent acknowledges or considers spin-orbit coupling (SOC) for Lu (Z=71,
    heavy lanthanide) in the band structure calculation. The agent should either enable
    LSORBIT=.TRUE. or explicitly discuss whether SOC is needed for this system.
  axis: grounding
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: efficiency_judge
  criterion: The agent produced the INCAR efficiently without unnecessary tool calls,
    redundant queries, or irrelevant exploration.
  axis: efficiency
  verify: llm_binary_judge
- id: duration_budget
  criterion: Wall-clock run duration does not exceed benchmark ceiling.
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
