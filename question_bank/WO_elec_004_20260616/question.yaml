intent: Compute average Na intercalation voltage of NFPP using mock energies.
human_prompt_seed: "Compute the average Na intercalation voltage of NFPP:\n1. Retrieve the NFPP (Na₄Fe₃(PO₄)₂P₂O₇) structure (space group Pna2₁, Z=4) and use the unit cell (104 atoms).\n2. Sodiated state: Na₁₆Fe₁₂P₁₆O₆₀ (fully sodiated unit cell, 104 atoms).\n\
  \   Desodiated state: Na₄Fe₁₂P₁₆O₆₀ (remove 12 Na in the order Na3→Na1→Na4, 92 atoms).\n3. Use the following mock energies (simulating DPA-relaxed results):\n   - E_sodiated = -689.60 eV\n   - E_desodiated = -633.08 eV\n   - μ_Na (BCC Na metal) = -1.31 eV/atom\n   - n = 12 (number of removed Na ions: 3 per formula unit × Z=4)\n4. Compute the average voltage using V = -[E(sodiated) - E(desodiated) - n·μ_Na] / n.\n5. Report the average voltage (V vs Na/Na⁺), the value of n, and the energy values.\n"
