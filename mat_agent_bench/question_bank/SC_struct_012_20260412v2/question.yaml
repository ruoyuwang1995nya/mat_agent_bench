id: SC_struct_012_20260412v2
capability: structure_construction
domain: agnostic
intent: Construct corundum (alpha-Al2O3) using Wyckoff-position information and validate
  lattice/formula consistency.
human_prompt_seed: '请基于刚玉（corundum, alpha-Al2O3）的 Wyckoff 位点信息构建晶体结构，并导出为 `corundum_wyckoff.cif`。

  已知目标信息： - 空间群编号：167； - 晶格常数近似：a=b≈4.7602 Å, c≈12.9933 Å； - 采用 Wyckoff 位点方式构建，而不是只给出最终化学式。

  交付物要求： 1) `corundum_wyckoff.cif`； 2) `wyckoff_construction_notes.md`，说明所用空间群、位点设置、坐标参数与结果检查要点。

  最终回答需简要说明：为什么该结构与 corundum 一致，以及参数可能存在的小偏差来源。'
tags:
- phy_surface
- mat_oxide
- meta_userlog
