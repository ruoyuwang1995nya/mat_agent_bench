scoring_checklist:
- id: feasibility_warning
  criterion: Agent clearly warns that DFT calculation on 10000 atoms is computationally infeasible (would require 
    enormous memory and time, O(N^3) scaling).
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: scale_analysis
  criterion: Agent provides a quantitative or semi-quantitative explanation of why this is infeasible (e.g., memory 
    estimate, time estimate, comparison to typical DFT limits of ~1000 atoms).
  verify: llm_binary_judge
  capability: scientific_reasoning
  weight: 0.5
- id: alternative_suggestion
  criterion: Agent suggests practical alternatives (e.g., classical MD, machine learning potentials, smaller 
    representative cell, AIMD on subset).
  verify: llm_binary_judge
  capability: scientific_grounding
  weight: 0.5
