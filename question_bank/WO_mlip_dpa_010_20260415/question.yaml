domain: agnostic
intent: Fine-tune a DPA3 potential for a fixed step budget and summarize key hyperparameters and outcomes.
human_prompt_seed: "执行 DPA3 微调流程评估（Mock版）：\n1. 先 query/检索并整理训练所需输入文件（数据集、模型配置、训练参数）；\n2. 明确目标训练步数与学习率策略；\n3. 不做真实训练，使用以下 mock
  结果：\n   - train_steps = 3000\n   - lr_type = cosine\n   - start_lr = 1.0e-2\n   - stop_lr = 1.0e-5\n   - valid_ratio = 0.2\n\
  \   - best_valid_loss = 0.021\n   - status = converged_for_mock\n4. 基于 mock 值做后处理并判断是否可进入下游验证。\n\n请输出：\n1) `dpa3_finetune_config.json`：记录
  `input_files`、训练步数、学习率策略、loss 关键参数、验证划分；\n2) `dpa3_finetune_report.md`：概述 query 输入梳理、mock 后处理过程、结果与改进建议。\n\n最终回答请给出：本次微调是否满足继续下游验证的最低条件。\n"
