domain: agnostic
difficulty: easy
intent: Add missing hydrogens to the diacetylmorphine (DACMOR) molecular crystal CIF and validate the formula, local 
  molecular environment, and tetrahedral geometry using MolCrysKit.
human_prompt_seed: 'Add missing hydrogens to the following CIF structure provided via OSS URL:

  - `DACMOR.cif` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/cda9f292ec4b411facb478d0486b54ce/DACMOR.cif`


  This structure is a molecular crystal of diacetylmorphine, obtained from single-crystal XRD, but it is missing H atoms.

  Please hydrogenate this structure and export it as `dacmor_hydrogenated.cif`.

  Requirement: add H atoms so that the structure follows valence rules and is chemically meaningful.


  Please explicitly check and report the following in the final answer:

  (1) The reduced chemical formula of each molecule after hydrogenation.

  (2) The total number of H atoms in each molecule.

  (3) A representative H-C-H bond angle (degrees).

  (4) Whether the molecular connectivity is complete after hydrogenation (no broken or extra bonds).


  Output the structure file and provide the above verification conclusions.

  '
tags:
- struct_molcrys
