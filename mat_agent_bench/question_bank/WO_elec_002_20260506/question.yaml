id: WO_elec_002_20260506
capability: workflow_orchestration
domain: agnostic
intent: 'Build and execute periodic liquid water gap workflow: construct 32-water
  box, compute HOMO-LUMO gap with hybrid acceleration.'
human_prompt_seed: '计算周期性液态水体系的 HOMO-LUMO gap： 构建 32 个水分子的周期性盒子（密度 ~1.0 g/cm3）， 使用杂化泛函或加速方案（如先
  PBE 再 HSE 单点）计算电子 gap。

  请完成以下交付： 1) `water_gap_report.json`：至少包含 `gap_eV`, `hybrid_functional`, `acceleration_strategy`,
  `gap_extraction_method`, `cost_estimate`； 2) 最终回答需简要确认 gap 值和加速方案。

  '
tags:
- struct_build
- eng_cp2k
data_files: []
reference_answers:
- key: gap_value_eV
  value: 6.2
  tolerance: 1.2
- key: report_artifact
  value: water_gap_report.json
- key: report_required_tokens
  value:
    filename: water_gap_report.json
    tokens:
    - gap_eV
    - hybrid_functional
    - acceleration_strategy
    - gap_extraction_method
    - cost_estimate
    flags: i
- key: turn_budget
  value:
    max: 35
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 50000
scoring_checklist:
- id: gap_value_eV
  criterion: Gap value is in tolerance.
  axis: correctness
  verify: numerical_range
- id: report_artifact
  criterion: Agent writes `water_gap_report.json` to workspace.
  axis: correctness
  verify: artifact_exists
- id: report_required_tokens
  criterion: JSON report includes all required fields (gap_eV, hybrid_functional,
    acceleration_strategy, gap_extraction_method, cost_estimate).
  axis: correctness
  verify: text_file_contains_all
- id: grounding_source
  criterion: The gap value in the JSON report and final answer is consistent with
    the stated calculation approach. Judge from deliverables; do not fail because
    the tool-call log omits MCP, web_search, or any specific tool.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: Amorphous builder and DOS calculator are not called repeatedly with identical
    parameters.
  axis: efficiency
  verify: no_retries
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: efficiency_judge
  criterion: Liquid water gap workflow (build box → SCF/hybrid → DOS → report) is
    executed without redundant intermediate calculations.
  axis: efficiency
  verify: llm_binary_judge
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
    a generous benchmark ceiling (tunable per deployment).
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage is recorded and stays within a generous benchmark ceiling
    (tunable per task after calibration).
  axis: efficiency
  verify: token_budget
