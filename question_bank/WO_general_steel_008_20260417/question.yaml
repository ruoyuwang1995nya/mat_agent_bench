  criterion: Agent writes `duplex_ni_tensile_predictions.json` to workspace.
  axis: correctness
  verify: artifact_exists
- id: analysis_md
  criterion: Agent writes `duplex_ni_tensile_analysis.md` to workspace.
  axis: correctness
  verify: artifact_exists
- id: tensile_tokens
  criterion: Prediction JSON includes required composition-strength fields.
  axis: correctness
  verify: llm_binary_judge
- id: analysis_tokens
  criterion: Analysis document explains Ni-strength trend with uncertainty caveats.
  axis: correctness
  verify: llm_binary_judge
- id: grounding_source
  criterion: Deliverables are grounded in generated prediction artifacts and avoid
    unsupported metallurgy claims.
  axis: grounding
  verify: llm_binary_judge
- id: no_retries
  criterion: No repeated identical tool calls with the same parameter set.
  axis: efficiency
  verify: no_retries
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
