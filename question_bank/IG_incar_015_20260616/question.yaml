human_prompt_seed: 'Generate a VASP INCAR for an HSE06+SOC defect calculation of the I-on-S substitution defect in BiSI. The heavy element Bi requires spin-orbit coupling, the defect calculation needs a fixed cell shape, and HSE06 is used to obtain accurate defect levels. Ionic relaxation is required. Write the complete INCAR to the `INCAR` file in the current directory.'
tags:
- eng_vasp
