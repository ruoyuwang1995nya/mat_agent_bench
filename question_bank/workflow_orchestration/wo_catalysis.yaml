    criterion: Agent writes `pd111_work_function.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: wf_report_artifact
    criterion: Agent writes `pd111_work_function_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: wf_required_tokens
