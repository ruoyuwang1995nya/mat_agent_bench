id: WO_error_mid_flow_001_20260428
capability: workflow_orchestration
domain: agnostic
intent: When a multi-step workflow encounters an error mid-flow, agent should report
  clearly rather than silently skip the failed step.
human_prompt_seed: '请完成以下三步工作流：

  1. 读取工作目录下的 `structure.cif` 文件

  2. 对该结构做 2×2×2 超胞扩展

  3. 将扩展后的结构保存为 `supercell.vasp`

  请按顺序执行，如果某一步失败请明确告知。'
tags: []
data_files: []
reference_answers:
- key: turn_budget
  value:
    max: 10
- key: duration_budget
  value:
    max: 7200000
- key: token_budget_total
  value:
    max: 8000
scoring_checklist:
- id: error_detection
  criterion: Agent detects that structure.cif does not exist and clearly reports this
    failure rather than silently skipping or fabricating the file.
  axis: correctness
  verify: llm_binary_judge
- id: no_silent_skip
  criterion: Agent does NOT proceed to steps 2 and 3 as if step 1 succeeded, and does
    NOT create a fake supercell.vasp based on invented data.
  axis: correctness
  verify: llm_binary_judge
- id: clear_communication
  criterion: Final answer clearly states which step failed and why, in a way the user
    can act on (e.g., provide the missing file).
  axis: grounding
  verify: llm_binary_judge
- id: turn_budget
  criterion: Agent completes the task within the turn (step) budget.
  axis: efficiency
  verify: turn_budget
- id: duration_budget
  criterion: Wall-clock run duration does not exceed ceiling.
  axis: efficiency
  verify: duration_budget
- id: token_budget_total
  criterion: Total token usage stays within benchmark ceiling.
  axis: efficiency
  verify: token_budget
