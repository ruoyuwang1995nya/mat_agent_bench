scoring_checklist:
- id: r1_factor
  criterion: Final R1 factor (on F, I>2sigma) is within tolerance of 0.0637 (human baseline for disordered structure). A
    value ≤ 0.08 is acceptable given the disorder.
  verify: numerical_range
  weight: 0.5
  capability: tool_utilization
- id: wr2_factor
  criterion: Final wR2 factor (on F², all data) is within tolerance of 0.2183 (human baseline). Higher wR2 is expected 
    for disordered structures; ≤ 0.25 is acceptable.
  verify: numerical_range
  weight: 0.5
  capability: tool_utilization
- id: goof
  criterion: Goodness-of-fit (GooF, S) is within tolerance of 1.022. A value between 0.9 and 1.2 indicates a 
    well-refined structure.
  verify: numerical_range
  weight: 0.5
  capability: tool_utilization
- id: space_group_number
  criterion: The agent correctly identifies the space group number as 4 (P2₁, monoclinic). The answer or CIF must report
    space group No. 4.
  verify: numerical_range
  weight: 0.5
  capability: scientific_reasoning
- id: cell_volume
  criterion: Refined unit cell volume is within tolerance of 1025.98 Å³.
  verify: numerical_range
  weight: 0.5
  capability: tool_utilization
- id: checkcif_validation
  criterion: The generated CIF passes IUCr checkCIF with zero A-level alerts.
  verify: checkcif_no_a_alerts
  weight: 0.5
  capability: structure_manipulation
- id: disorder_modeled
  criterion: The agent explicitly models the cation orientational disorder (e.g., using split-atom positions, PART 
    instructions, or occupancy constraints in SHELXL) and reports the disorder in the answer.
  verify: llm_binary_judge
  weight: 0.5
  capability: structure_manipulation
- id: cif_generated
