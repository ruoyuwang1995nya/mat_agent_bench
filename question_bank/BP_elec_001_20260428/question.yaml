intent: Batch-compute H adsorption energy on 3 different metal (001) surfaces using mock energies to test batch workflow
  efficiency.
human_prompt_seed: "批量计算 H 原子在 Cu(001)、Ag(001)、Au(001) 三种金属表面的吸附能，用于 HER 活性对比：\n\n对每种金属执行相同流程：\n1. 获取 FCC 体相结构（Cu: Fm-3m,
  a=3.615 Å; Ag: Fm-3m, a=4.085 Å; Au: Fm-3m, a=4.078 Å）；\n2. 切 (001) 面 slab（4 层，15 Å 真空，2×2 扩胞）；\n3. 在 ontop 位点放置 H 原子（距表面
  1.5 Å）；\n4. 使用以下mock能量值（模拟DPA弛豫结果）：\n\n   | 金属 | E_slab (eV) | E_slab+H (eV) |\n   |------|-------------|---------------|\n\
  \   | Cu   | -57.12      | -61.08        |\n   | Ag   | -43.56      | -47.63        |\n   | Au   | -50.84      | -54.83\
  \        |\n\n   H₂ 参考能量：E_H₂ = -6.68 eV（Final Energy/Atom ≈ -3.34 eV，只计算一次，三种金属共用）\n\n5. 计算 E_ads = E(slab+H) - E(slab)
  - 0.5×E(H₂)；\n\n关键要求：\n- 三种金属的 slab 参数完全一致（同样层数、真空、扩胞）\n- H₂ 参考能量只使用一次，三种金属共用\n- 输出三种金属的吸附能对比表，并按 |ΔG_H| 排序评价 HER 活性\n\n\
  预期结果：\n- Cu: E_ads ≈ -0.62 eV\n- Ag: E_ads ≈ -0.73 eV\n- Au: E_ads ≈ -0.65 eV\n"
